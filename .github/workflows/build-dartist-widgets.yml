name: Build Dartist Widgets

on:
  push:
    branches: [main]
    paths:
      - "android/dartist-widgets/**"
      - ".github/workflows/build-dartist-widgets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android companion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p android/dartist-widgets :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dartist-widgets-debug
          path: android/dartist-widgets/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
