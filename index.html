<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Adaptation automatique aux écrans de smartphones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Projets - Damien</title>
    <style>
        /* --- 1. Variables de style pour faciliter les modifications --- */
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        /* --- 2. Réinitialisation de base --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- 3. Conteneur principal --- */
        .hub-container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* --- 4. En-tête --- */
        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* --- 5. Liste des liens vers les projets --- */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .project-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
        }

        .project-card:hover, .project-card:focus {
            background: rgba(56, 189, 248, 0.08);
            border-color: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .project-icon {
            font-size: 2rem;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .project-info {
            text-align: left;
            flex-grow: 1;
        }

        .project-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .project-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .project-arrow {
            font-size: 1.2rem;
            color: var(--accent-color);
            transition: transform 0.2s ease;
            margin-left: 10px;
        }

        .project-card:hover .project-arrow {
            transform: translateX(4px);
        }

        /* Carte inactive (pour futurs projets) */
        .project-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .project-card.disabled:hover {
            transform: none;
            border-color: var(--card-border);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: none;
        }

        /* --- 6. Ajustement mobile --- */
        @media (max-width: 480px) {
            .hub-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .project-card {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <main class="hub-container">
        <!-- Icône de profil / hub -->
        <div class="avatar">🚀</div>
        
        <h1>Damien Acquart</h1>
        <p class="subtitle">Bienvenue sur mon espace GitHub Pages. Retrouvez ici l'ensemble de mes réalisations et applications.</p>

        <section class="project-list">
            
            <!-- Lien vers le dépôt jeux.io -->
            <a href="https://damien-acq.github.io/jeux.io/" class="project-card">
                <div class="project-icon">🎮</div>
                <div class="project-info">
                    <div class="project-title">Salle d'Arcade</div>
                    <div class="project-desc">Plateforme de jeux web (Undercover et plus)</div>
                </div>
                <div class="project-arrow">→</div>
            </a>

            <!-- Modèle pour un futur projet (ex. Portfolio, Outil, etc.) -->
            <div class="project-card disabled">
                <div class="project-icon">📦</div>
                <div class="project-info">
                    <div class="project-title">Prochain projet</div>
                    <div class="project-desc">En cours de conception</div>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
