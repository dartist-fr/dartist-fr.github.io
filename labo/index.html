<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Labo • Projets & Expériences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #15171c;
            --surface: #1c1f26;
            --ink: #f1f0ea;
            --ink-soft: #a8acb5;
            --ink-faint: #686c76;
            --line: #2b2e35;
            --accent: #ff2e88;
            --accent-soft: rgba(255, 46, 136, 0.1);
            --font-body: 'Inter', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 4rem 1.5rem 3rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 44rem;
            width: 100%;
        }

        header {
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
        }

        .back-link {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--ink-faint);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .back-link:hover { color: var(--accent); }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--ink-soft);
            font-size: 0.95rem;
        }

        .section-title {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-faint);
            margin-bottom: 1rem;
        }

        .grid-projets {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .carte-projet {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .carte-projet:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .info-projet h2 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: var(--ink);
        }

        .info-projet p {
            font-size: 0.85rem;
            color: var(--ink-soft);
        }

        .badge-status {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
            background: rgba(34, 230, 255, 0.1);
            color: #22e6ff;
            border: 1px solid rgba(34, 230, 255, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
        }

        footer {
            margin-top: 4rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--ink-faint);
            border-top: 1px solid var(--line);
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="../" class="back-link">&larr; Retour au Hub principal</a>
            <h1>Le Labo</h1>
            <p>Espace de prototypage et d'expérimentation de code en cours de développement.</p>
        </header>

        <main>
            <div class="section-title">Projets actifs</div>
            <div class="grid-projets">
                
                <!-- Lien vers le jeu Qui est-ce ? -->
                <a href="qui-est-ce/" class="carte-projet">
                    <div class="info-projet">
                        <h2>Qui est-ce ? (Édition Soirée)</h2>
                        <p>Jeu de déduction personnalisé avec les photos et les prénoms de la bande.</p>
                    </div>
                    <span class="badge-status">Actif</span>
                </a>

            </div>
        </main>

        <footer>
            <span>Espace protégé — dartist</span>
        </footer>
    </div>

</body>
</html>
