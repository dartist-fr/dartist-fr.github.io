<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Le Bobard — Salle d'Arcade</title>
    <link rel="manifest" href="/jeux.io/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette nocturne arcade : fond sombre + néon Ambre/Orange pour Le Bobard */
            --bg-color: #0a0713;
            --bg-panel: #16102b;
            --card-bg: #16102b;
            --grid-line: rgba(245, 158, 11, 0.10);
            --border-color: rgba(245, 158, 11, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #bba9d6;
            --accent: #f59e0b; /* Orange néon */
            --accent-glow: rgba(245, 158, 11, 0.25);
            --moon: #ffe14d;
            --red: #ff3b5c;
            --green: #4dffa6;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { background: var(--bg-color); }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% -5%, rgba(255, 225, 77, 0.16) 0%, transparent 42%),
                radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.18) 0%, transparent 60%);
            background-size: 38px 38px, 38px 38px, 100% 100%, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            overflow-x: hidden;
            font-size: 1.15rem;
        }

        /* Scanlines CRT globales */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
                rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
            );
            z-index: 100;
            mix-blend-mode: multiply;
        }

        /* --- Barre supérieure --- */
        .top-bar { max-width: 560px; margin: 0 auto 20px; display: flex; justify-content: flex-start; }
        .btn-back {
            display: inline-flex; align-items: center; gap: 10px;
            font-family: var(--font-display); font-size: 0.55rem;
            color: var(--accent); text-decoration: none;
            padding: 11px 16px; border: 2px solid var(--accent);
            background: var(--accent-glow);
            box-shadow: 0 0 0 2px var(--bg-color), 4px 4px 0 rgba(245, 158, 11, 0.4);
            transition: transform 0.12s steps(2), box-shadow 0.12s;
        }
        .btn-back:hover, .btn-back:focus {
            transform: translate(-2px, -2px);
            box-shadow: 0 0 0 2px var(--bg-color), 6px 6px 0 var(--accent);
            outline: none;
        }

        /* --- Conteneur (borne) --- */
        .container {
            max-width: 560px; margin: 0 auto;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 26px 22px;
            box-shadow: 0 0 0 4px var(--bg-color), 8px 8px 0 rgba(0,0,0,0.6), 0 0 30px rgba(245, 158, 11, 0.25);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.15rem; line-height: 1.5; text-align: center;
            color: var(--accent);
            text-shadow: 0 0 8px rgba(245, 158, 11, 0.9), 0 0 20px rgba(245, 158, 11, 0.5), 3px 3px 0 #2a0d4a;
            margin-bottom: 14px;
            animation: flicker 5s infinite;
        }
        @keyframes flicker { 0%,92%,100%{opacity:1;} 93%{opacity:0.7;} 94%{opacity:1;} 96%{opacity:0.85;} }

        h2 {
            font-family: var(--font-display);
            font-size: 0.72rem; line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .phase-subtitle {
            text-align: center; font-size: 1.15rem;
            color: var(--text-sub); margin-bottom: 22px; letter-spacing: 0.5px;
        }

        /* --- Panneaux --- */
        .panel {
            background: rgba(0,0,0,0.30);
            border: 2px solid var(--border-color);
            padding: 16px; margin-bottom: 16px;
        }
        .panel h2 {
            font-family: var(--font-display); font-size: 0.62rem;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--text-sub); margin-bottom: 14px;
            display: flex; justify-content: space-between; gap: 8px; line-height: 1.5;
        }

        /* --- Chips joueurs --- */
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .chip {
            display: flex; align-items: center; gap: 8px;
            background: var(--accent-glow); border: 1px solid var(--accent);
            padding: 6px 10px; font-size: 1.1rem;
        }
        .chip button { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 1rem; font-family: var(--font-body); }
        .chip button:hover { color: var(--red); }

        .inline-input { display: flex; gap: 10px; }
        input[type="text"] {
            flex-grow: 1; background: #070510; border: 2px solid var(--border-color);
            color: #fff; padding: 11px 12px; font-size: 1.1rem; outline: none;
            font-family: var(--font-body);
        }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

        /* --- Listes de sélection (Boutons de réponses) --- */
        .select-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
        .select-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.30); border: 2px solid var(--border-color);
            padding: 13px 14px; color: #fff; font-size: 1.1rem; cursor: pointer;
            transition: transform 0.1s steps(2), border-color 0.1s, background 0.1s;
        }
        .select-item:hover { transform: translateX(3px); border-color: var(--accent); }
        .select-item.selected { border-color: var(--moon); background: var(--accent-glow); box-shadow: 0 0 14px rgba(245, 158, 11, 0.3); }

        /* --- Boutons d'action principaux --- */
        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 14px; font-family: var(--font-display); font-size: 0.66rem;
            letter-spacing: 0.04em; cursor: pointer; border: none;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.6);
            transition: transform 0.1s steps(2), box-shadow 0.1s;
            line-height: 1.5; text-align: center; margin-top: 10px;
        }
        .btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 rgba(0,0,0,0.7); }
        .btn-primary { background: var(--accent); color: #000; text-shadow: 0 0 6px rgba(255,255,255,0.3); }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-ghost { background: rgba(245, 158, 11, 0.10); border: 2px solid var(--accent); color: var(--text-main); }

        /* --- Carte de révélation / Transition --- */
        .card-reveal {
            border: 2px dashed var(--accent);
            padding: 26px 18px; text-align: center; margin: 18px 0;
            background: var(--accent-glow);
            box-shadow: inset 0 0 26px rgba(245, 158, 11, 0.15);
        }
        .role-badge {
            font-family: var(--font-display); font-size: 0.95rem;
            color: var(--moon); text-transform: uppercase; margin: 14px 0;
            letter-spacing: 0.04em; line-height: 1.5;
            text-shadow: 0 0 10px rgba(255,225,77,0.6);
        }

        /* --- Règles du jeu (Adaptation) --- */
        ul.rules-list { margin-left: 20px; color: var(--text-sub); text-align: left; }
        ul.rules-list li { margin-bottom: 10px; line-height: 1.4; }
        ul.rules-list strong { color: var(--accent); }

        @media (max-width: 600px) {
            body { background-size: 28px 28px, 28px 28px, 100% 100%, 100% 100%; }
            h1 { font-size: 0.95rem; }
            .btn-back { font-size: 0.5rem; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../" class="btn-back">&lsaquo; HUB</a>
    </div>

    <main class="container" id="app"></main>

    <script>
        // --- BASE DE DONNÉES DES QUESTIONS ---
        const banqueQuestions = [
            { q: "Quelle est la particularité de la machine à corder Pro's Pro MT-300 ?", r: "Elle est électronique" },
            { q: "Dans le jeu de société Galèrapagos, quel est le but principal ?", r: "Quitter l'île avant la tempête" },
            { q: "Combien y a-t-il de cases sur un échiquier classique ?", r: "64" },
            { q: "Quel fruit est appelé 'pomme d'amour' en néerlandais ?", r: "La tomate" },
            { q: "Quelle est la durée exacte d'un match de football américain professionnel ?", r: "60 minutes" },
            { q: "Dans Zelda: Breath of the Wild, quel pouvoir arrête le temps ?", r: "Cinetis" },
            { q: "Quel animal est connu pour dormir avec un œil ouvert ?", r: "Le dauphin" },
            { q: "Quel est l'os le plus long du corps humain ?", r: "Le fémur" }
        ];

        // --- ÉTAT GLOBAL DE LA PARTIE ---
        let state = {
            screen: "setup", 
            players: ["Joueur 1", "Joueur 2", "Joueur 3", "Joueur 4"],
            gamePlayers: [],
            questionActuelle: null,
            reponses: [],
            votes: {},
            tourJoueurIndex: 0
        };

        // --- OUTILS ---
        function shuffle(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Échappement des caractères pour éviter les bugs HTML
        function esc(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // --- GESTION DES JOUEURS ---
        function addPlayer() {
            const input = document.getElementById("playerNameInput");
            const name = input ? input.value.trim() : "";
            if (name && !state.players.includes(name)) {
                state.players.push(name);
                render();
                // Remettre le focus sur l'input après l'ajout
                setTimeout(() => document.getElementById("playerNameInput").focus(), 10);
            }
        }

        function removePlayer(index) {
            state.players.splice(index, 1);
            render();
        }

        function demarrerJeu() {
            if (state.players.length < 2) {
                alert("Il faut au moins 2 joueurs pour jouer au Bobard !");
                return;
            }
            
            // Initialisation des scores si c'est la première manche
            if (state.gamePlayers.length === 0 || state.gamePlayers.length !== state.players.length) {
                state.gamePlayers = state.players.map(nom => ({ nom: nom, score: 0 }));
            }

            state.questionActuelle = banqueQuestions[Math.floor(Math.random() * banqueQuestions.length)];
            state.reponses = [{ texte: state.questionActuelle.r, auteur: "La Vraie Réponse" }];
            state.votes = {};
            state.tourJoueurIndex = 0;
            state.screen = "transition_invention";
            render();
        }

        // --- SAUVEGARDE DES ACTIONS ---
        function validerInvention() {
            const input = document.getElementById('fausseReponse');
            const texte = input ? input.value.trim() : "";
            if (!texte) return; 
            
            state.reponses.push({ texte: texte, auteur: state.gamePlayers[state.tourJoueurIndex].nom });
            
            state.tourJoueurIndex++;
            if (state.tourJoueurIndex < state.gamePlayers.length) {
                state.screen = "transition_invention";
            } else {
                state.reponses = shuffle(state.reponses);
                state.tourJoueurIndex = 0;
                state.screen = "transition_vote";
            }
            render();
        }

        function enregistrerVote(reponseIndex) {
            const repChoisie = state.reponses[reponseIndex];
            state.votes[state.gamePlayers[state.tourJoueurIndex].nom] = repChoisie;

            state.tourJoueurIndex++;
            if (state.tourJoueurIndex < state.gamePlayers.length) {
                state.screen = "transition_vote";
            } else {
                calculerScores();
                state.screen = "resultats";
            }
            render();
        }

        function calculerScores() {
            for (const [nomVotant, rep] of Object.entries(state.votes)) {
                const votant = state.gamePlayers.find(j => j.nom === nomVotant);
                if (rep.auteur === "La Vraie Réponse") {
                    votant.score += 2; 
                } else {
                    const piegeur = state.gamePlayers.find(j => j.nom === rep.auteur);
                    if (piegeur) piegeur.score += 1; 
                }
            }
        }

        function changerJoueurs() {
            state.gamePlayers = []; // Réinitialise les scores
            state.screen = "setup";
            render();
        }

        // --- RENDU GRAPHIQUE ---
        function render() {
            const app = document.getElementById("app");
            
            if (state.screen === "setup") {
                let chipsHtml = state.players.map((p, i) => `
                    <div class="chip">
                        <span>${esc(p)}</span>
                        <button onclick="removePlayer(${i})">✕</button>
                    </div>
                `).join("");

                app.innerHTML = `
                    <h1>LE BOBARD</h1>
                    <p class="phase-subtitle">L'art de l'esbroufe</p>

                    <div class="panel">
                        <h2>Comment jouer ?</h2>
                        <ul class="rules-list">
                            <li><strong>Invention :</strong> Lisez la question et inventez une fausse réponse totalement crédible.</li>
                            <li><strong>Vote :</strong> Retrouvez la VRAIE réponse cachée parmi les bobards.</li>
                            <li><strong>Points :</strong> 2 pts pour la vérité, 1 pt chaque fois qu'un ami vote pour votre invention !</li>
                        </ul>
                    </div>

                    <div class="panel">
                        <h2>Joueurs (${state.players.length})</h2>
                        <div class="chips">${chipsHtml}</div>
                        <div class="inline-input">
                            <input type="text" id="playerNameInput" placeholder="Nom du joueur" onkeydown="if(event.key==='Enter') addPlayer()">
                            <button class="btn btn-ghost" style="width:auto; padding:0 16px; margin-top:0;" onclick="addPlayer()">+</button>
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="demarrerJeu()">Lancer la partie ›</button>
                `;
            } 
            
            else if (state.screen === "transition_invention") {
                const joueur = state.gamePlayers[state.tourJoueurIndex];
                app.innerHTML = `
                    <h1>Phase d'Invention</h1>
                    <p class="phase-subtitle">Préparation</p>
                    <div class="card-reveal">
                        <p style="color:var(--text-sub); font-size:1.2rem; margin-bottom:20px;">Donnez le téléphone à</p>
                        <div class="role-badge" style="font-size:1.8rem; color:var(--text-main); text-shadow:none;">${esc(joueur.nom)}</div>
                        <p style="color:var(--text-sub); font-size:1rem; margin-top:20px;">Personne d'autre ne doit regarder !</p>
                        <button class="btn btn-primary" style="margin-top:20px;" onclick="state.screen='invention'; render();">Je suis prêt</button>
                    </div>
                `;
            }

            else if (state.screen === "invention") {
                const joueur = state.gamePlayers[state.tourJoueurIndex];
                app.innerHTML = `
                    <h1>À vous de jouer</h1>
                    <p class="phase-subtitle">Tour de ${esc(joueur.nom)}</p>
                    <div class="panel" style="text-align:center;">
                        <h2 style="font-size: 1.2rem; color: var(--accent); margin-bottom: 20px; line-height: 1.4; text-transform:none;">${esc(state.questionActuelle.q)}</h2>
                        <p style="font-size: 1.1rem; color: var(--text-sub); margin-bottom: 15px;">Inventez une réponse crédible :</p>
                        <input type="text" id="fausseReponse" placeholder="Votre faux fait..." onkeydown="if(event.key==='Enter') validerInvention()">
                        <button class="btn btn-primary" style="margin-top: 20px;" onclick="validerInvention()">Valider secrètement</button>
                    </div>
                `;
                // Focus automatique sur l'input
                setTimeout(() => { const el = document.getElementById('fausseReponse'); if(el) el.focus(); }, 50);
            }

            else if (state.screen === "transition_vote") {
                const joueur = state.gamePlayers[state.tourJoueurIndex];
                let msg = state.tourJoueurIndex === 0 ? "Tout le monde a répondu !" : "Vote enregistré.";
                app.innerHTML = `
                    <h1>L'heure du vote</h1>
                    <p class="phase-subtitle">Délibération</p>
                    <div class="card-reveal">
                        <p style="color:var(--text-sub); font-size:1.1rem; margin-bottom:20px;">${msg}<br><br>Passez le téléphone à</p>
                        <div class="role-badge" style="font-size:1.8rem; color:var(--text-main); text-shadow:none;">${esc(joueur.nom)}</div>
                        <button class="btn btn-primary" style="margin-top:20px;" onclick="state.screen='vote'; render();">Je suis prêt à voter</button>
                    </div>
                `;
            }

            else if (state.screen === "vote") {
                const joueur = state.gamePlayers[state.tourJoueurIndex];
                let boutonsHTML = state.reponses.map((rep, index) => {
                    if (rep.auteur === joueur.nom) return ''; // Ne peut pas voter pour lui-même
                    return `
                        <div class="select-item" onclick="enregistrerVote(${index})">
                            <span>${esc(rep.texte)}</span>
                        </div>
                    `;
                }).join('');

                app.innerHTML = `
                    <h1>Le scrutin</h1>
                    <p class="phase-subtitle">Vote de ${esc(joueur.nom)}</p>
                    <div class="panel">
                        <h2 style="font-size: 1.2rem; color: var(--accent); text-align: center; margin-bottom: 20px; line-height: 1.4; text-transform:none;">${esc(state.questionActuelle.q)}</h2>
                        <p style="font-size: 1.1rem; color: var(--text-sub); margin-bottom: 15px; text-align:center;">Trouvez la VRAIE réponse :</p>
                        <div class="select-list">
                            ${boutonsHTML}
                        </div>
                    </div>
                `;
            }

            else if (state.screen === "resultats") {
                // Tri des joueurs par score décroissant
                const classement = [...state.gamePlayers].sort((a, b) => b.score - a.score);
                
                app.innerHTML = `
                    <h1>Résultats 🏆</h1>
                    <p class="phase-subtitle">Fin de la manche</p>
                    
                    <div class="card-reveal" style="margin-bottom: 20px; padding: 20px 15px;">
                        <p style="color:var(--text-sub); font-size: 1.1rem; margin-bottom: 10px;">La vraie réponse était :</p>
                        <div class="role-badge" style="color: var(--green); font-size: 1.3rem;">${esc(state.questionActuelle.r)}</div>
                    </div>

                    <div class="panel">
                        <h2>Classement Général</h2>
                        <div class="select-list" style="margin-top: 10px;">
                            ${classement.map(j => `
                                <div class="select-item" style="cursor: default; margin-bottom: 8px;">
                                    <span>${esc(j.nom)}</span>
                                    <span style="color: var(--accent); font-weight: bold;">${j.score} pts</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="demarrerJeu()">Manche Suivante ⟳</button>
                    <button class="btn btn-ghost" onclick="changerJoueurs()">Changer de joueurs</button>
                `;
            }
        }

        // Lancement au chargement
        render();
    </script>
</body>
</html>
