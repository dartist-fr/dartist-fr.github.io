<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0616">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Qui est-ce ? — Salle d'Arcade (Multijoueur)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0616;
            --card-bg: #140a26;
            --grid-line: rgba(255, 46, 136, 0.10);
            --border-color: rgba(255, 46, 136, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #9d8bc4;
            --accent: #ff2e88;
            --neon-yellow: #ffe14d;
            --neon-cyan: #22e6ff;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }
        :root[data-theme="light"] {
            --bg-color: #cdbf9c;
            --card-bg: #e6dcc0;
            --grid-line: rgba(0, 0, 0, 0.03);
            --border-color: rgba(179, 165, 120, 0.8);
            --text-main: #241f17;
            --text-sub: #6a5f45;
            --accent: #9e2a24;
            --neon-yellow: #556021;
            --neon-cyan: #225588;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-color); }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(255, 46, 136, 0.15) 0%, transparent 55%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            font-size: 1.25rem;
        }

        body::after {
            content: "";
            position: fixed; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
            z-index: 100; mix-blend-mode: multiply;
        }

        #app { max-width: 800px; margin: 0 auto; position: relative; z-index: 10; }

        header {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 0 0 4px var(--bg-color), 6px 6px 0 rgba(0,0,0,0.6), 0 0 20px rgba(255,46,136,0.2);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        h1 { font-family: var(--font-display); font-size: 0.9rem; color: var(--accent); text-shadow: 0 0 8px rgba(255,46,136,0.8); margin: 0; }
        .subtitle { font-size: 1rem; color: var(--text-sub); margin-top: 4px; }
        .headerbtns { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .themebtn {
            font-family: var(--font-display); font-size: 0.5rem;
            background: rgba(255, 46, 136, 0.08); border: 2px solid var(--accent);
            color: var(--accent); padding: 8px 10px; cursor: pointer;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }

        .panel {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 0 0 4px var(--bg-color), 6px 6px 0 rgba(0,0,0,0.6);
        }
        .panel h2 {
            font-family: var(--font-display);
            font-size: 0.75rem;
            color: var(--neon-cyan);
            margin-bottom: 14px;
            text-shadow: 0 0 6px rgba(34,230,255,0.4);
        }

        input[type=text] {
            width: 100%; background: var(--bg-color); border: 2px solid var(--border-color);
            color: var(--text-main); padding: 10px; font-size: 1.25rem; font-family: var(--font-body);
            outline: none; margin-bottom: 10px; text-align: center;
        }
        input[type=text]:focus { border-color: var(--accent); }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 14px; font-family: var(--font-display); font-size: 0.65rem;
            cursor: pointer; border: none; box-shadow: 4px 4px 0 rgba(0,0,0,0.7);
            text-transform: uppercase; text-align: center; margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: #fff; text-shadow: 0 0 6px rgba(0,0,0,0.5); }
        .btn-ghost { background: transparent; border: 2px solid var(--accent); color: var(--text-main); }
        
        .codebox {
            font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.2em;
            color: var(--neon-yellow); text-align: center; padding: 15px;
            background: var(--bg-color); border: 2px dashed var(--border-color); margin: 10px 0;
            user-select: all;
        }
        .linkbtn { background: none; border: none; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; text-decoration: underline; display: block; margin: 10px auto; font-family: var(--font-body); }
        .center { text-align: center; }
        .dim { color: var(--text-sub); }

        .secret-reveal-card {
            background: var(--bg-color); border: 2px solid var(--neon-yellow);
            padding: 15px; margin: 10px 0; text-align: center;
            font-family: var(--font-display); font-size: 0.9rem; color: var(--neon-yellow);
            text-shadow: 0 0 8px rgba(255,225,77,0.6);
        }

        .grid-persos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .carte-perso {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .carte-perso:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .carte-perso.elimine {
            opacity: 0.3;
            filter: grayscale(1);
            border-color: #444;
        }

        .carte-perso img {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 2px;
            margin-bottom: 4px;
            border: 1px solid var(--border-color);
        }

        .carte-perso span {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--text-main);
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

let peer = null;
let conn = null;
let isHost = false;
let roomCode = "";

let state = {
    screen: "home", // "home", "host_waiting", "join_form", "game"
    personnages: [],
    mystere: null,
    themeMode: "dark"
};

function loadStorage() {
    try {
        var tm = localStorage.getItem("qi_theme");
        if (tm === "light" || tm === "dark") state.themeMode = tm;
    } catch(e) {}
    applyTheme();
}

function applyTheme() {
    document.documentElement.setAttribute("data-theme", state.themeMode);
}

function toggleTheme() {
    state.themeMode = state.themeMode === "dark" ? "light" : "dark";
    try { localStorage.setItem("qi_theme", state.themeMode); } catch(e) {}
    applyTheme();
    render();
}

function toggleFullscreen() {
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}
document.addEventListener("fullscreenchange", function(){ render(); });

function generateRoomCode() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var code = "";
    for(var i=0; i<4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
}

function selectionner24Aleatoires() {
    let copieMelangee = [...LISTE_COMPLETE_PERSONNAGES].sort(() => 0.5 - Math.random());
    return copieMelangee.slice(0, 24).map(p => ({ nom: p.nom, img: p.img, elimine: false }));
}

function startNewRound() {
    if (!isHost) return;
    
    // L'hôte génère une nouvelle grille et 2 personnages mystères différents
    let nouvelleGrille = selectionner24Aleatoires();
    let indexHost = Math.floor(Math.random() * 24);
    let indexGuest = Math.floor(Math.random() * 24);
    
    // On s'assure que l'adversaire a un personnage mystère différent
    while (indexGuest === indexHost) {
        indexGuest = Math.floor(Math.random() * 24);
    }

    // Mise à jour locale pour l'Hôte (on clone pour être sûr de la désynchronisation des actions)
    state.personnages = JSON.parse(JSON.stringify(nouvelleGrille));
    state.mystere = state.personnages[indexHost];
    state.screen = "game";

    // Envoi de la grille commune et de l'index unique au Client
    if (conn && conn.open) {
        conn.send({
            type: 'INIT_GAME',
            grille: nouvelleGrille,
            mystereIndex: indexGuest
        });
    }
    render();
}

function startHosting() {
    isHost = true;
    roomCode = generateRoomCode();

    if(peer) peer.destroy();
    peer = new Peer(roomCode);

    peer.on('open', function(id) {
        state.screen = "host_waiting";
        render();
    });

    peer.on('connection', function(c) {
        conn = c;
        setupConnectionListeners();

        conn.on('open', function() {
            startNewRound(); // Démarre la partie automatiquement quand le client se connecte
        });
    });
}

function joinRoomForm() {
    isHost = false;
    state.screen = "join_form";
    render();
}

function connectToRoom() {
    var codeInput = document.getElementById("roomCodeInput");
    if(!codeInput || !codeInput.value.trim()) { alert("Entre un code de salon valide !"); return; }
    roomCode = codeInput.value.trim().toUpperCase();

    if(peer) peer.destroy();
    peer = new Peer();

    peer.on('open', function() {
        conn = peer.connect(roomCode);
        setupConnectionListeners();
    });
}

function setupConnectionListeners() {
    conn.on('data', function(data) {
        if(data.type === 'INIT_GAME') {
            // Le client reçoit la grille de l'hôte et son propre index mystère
            state.personnages = JSON.parse(JSON.stringify(data.grille));
            state.mystere = state.personnages[data.mystereIndex];
            state.screen = "game";
            render();
        } else if(data.type === 'REQUEST_RESTART') {
            // Si le client demande à recommencer, l'hôte génère une nouvelle partie
            if(isHost) {
                startNewRound();
            }
        }
    });
}

// Fonction de relance rapide
function recommencerPartie() {
    if(isHost) {
        startNewRound();
    } else {
        if(conn && conn.open) {
            conn.send({ type: 'REQUEST_RESTART' }); // Demande à l'hôte de relancer
        }
    }
}

function toggleEliminer(index) {
    // Les clics n'affectent QUE l'écran actuel (pas d'envoi réseau)
    state.personnages[index].elimine = !state.personnages[index].elimine;
    render();
}

function render() {
    var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    var html = "";
    
    html += '<header>';
    html += '<div><h1>QUI EST-CE ?</h1><div class="subtitle">Salon en Ligne (Grilles Indépendantes)</div></div>';
    html += '<div class="headerbtns">';
    html += '<button class="themebtn" onclick="toggleTheme()">'+(state.themeMode==="dark" ? "☀️" : "🌙")+'</button>';
    html += '<button class="themebtn" onclick="toggleFullscreen()">'+(isFs ? "✕" : "⛶")+'</button>';
    html += '</div></header>';

    if(state.screen === "home") {
        html += '<div class="panel center">';
        html += '<h2>Salon Multijoueur</h2>';
        html += '<p class="dim" style="margin-bottom:15px;">Même tableau pour les deux, mais chaque joueur mène son enquête de son côté :</p>';
        html += '<button class="btn btn-primary" onclick="startHosting()">Créer un salon</button>';
        html += '<button class="btn btn-ghost" style="margin-top:10px;" onclick="joinRoomForm()">Rejoindre un salon</button>';
        html += '</div>';
    }
    else if(state.screen === "host_waiting") {
        html += '<div class="panel center">';
        html += '<h2>Salon Créé</h2>';
        html += '<p class="dim">Donne ce code à ton adversaire :</p>';
        html += '<div class="codebox">'+roomCode+'</div>';
        html += '<p class="dim" style="margin-top:15px;">En attente de connexion du second joueur...</p>';
        html += '<button class="linkbtn" onclick="state.screen=\'home\'; render();">&#8249; Annuler</button>';
        html += '</div>';
    }
    else if(state.screen === "join_form") {
        html += '<div class="panel center">';
        html += '<h2>Rejoindre un salon</h2>';
        html += '<p class="dim" style="margin-bottom:10px;">Entre le code à 4 caractères :</p>';
        html += '<input type="text" id="roomCodeInput" placeholder="EX: A4X9" maxlength="4" style="text-transform:uppercase;">';
        html += '<button class="btn btn-primary" onclick="connectToRoom()">Se connecter au salon</button>';
        html += '<button class="linkbtn" onclick="state.screen=\'home\'; render();">&#8249; Retour</button>';
        html += '</div>';
    }
    else if(state.screen === "game") {
        let cartes = state.personnages.map((p, index) => `
            <div class="carte-perso ${p.elimine ? 'elimine' : ''}" onclick="toggleEliminer(${index})">
                <img src="${p.img}" alt="${p.nom}">
                <span>${p.nom}</span>
            </div>
        `).join("");

        html += '<div class="panel center" style="margin-bottom:15px; padding:12px;">';
        html += '<div style="font-family:var(--font-display); font-size:0.7rem; color:var(--neon-cyan);">SALON : ' + roomCode + '</div>';
        html += '<p class="dim" style="font-size:1rem; margin-top:5px;">L\'adversaire doit deviner :</p>';
        html += '<div class="secret-reveal-card">';
        html += '🎯 ' + (state.mystere ? state.mystere.nom : 'Chargement...') + '';
        html += '</div></div>';

        html += '<div class="panel">';
        html += '<h2>Ton Enquête (Actions privées)</h2>';
        html += '<div class="grid-persos">' + cartes + '</div>';
        html += '<button class="btn btn-ghost" style="margin-top:20px;" onclick="recommencerPartie()">Recommencer avec le même groupe ⟳</button>';
        html += '</div>';
    }

    document.getElementById("app").innerHTML = html;
    var rci = document.getElementById("roomCodeInput");
    if(rci){ rci.addEventListener("keydown", function(e){ if(e.key==="Enter") connectToRoom(); }); rci.focus({preventScroll:true}); }
}

loadStorage();
render();
</script>
</body>
</html>
