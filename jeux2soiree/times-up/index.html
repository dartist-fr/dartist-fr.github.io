    <style>
        :root {
            --bg-color: #0b0616;
            --card-bg: #140a26;
            --grid-line: rgba(245, 158, 11, 0.10);
            --border-color: rgba(245, 158, 11, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #9d8bc4;
            --accent: #f59e0b;
            --neon-pink: #ff2e88;
            --neon-green: #4dffa6;
            --neon-cyan: #22e6ff;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-color); }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.15) 0%, transparent 55%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            font-size: 1.2rem;
        }

        body::after {
            content: "";
            position: fixed; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
            z-index: 100; mix-blend-mode: multiply;
        }

        .top-bar { max-width: 560px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-back, .btn-fs {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-size: 0.5rem;
            color: var(--accent); text-decoration: none;
            padding: 10px 14px; border: 2px solid var(--accent);
            background: rgba(245, 158, 11, 0.06); cursor: pointer;
            box-shadow: 0 0 0 2px var(--bg-color), 4px 4px 0 rgba(245, 158, 11, 0.35);
        }

        .container {
            max-width: 560px; margin: 0 auto;
            background: var(--card-bg); border: 2px solid var(--accent);
            padding: 26px 22px;
            box-shadow: 0 0 0 4px var(--bg-color), 8px 8px 0 rgba(0,0,0,0.6), 0 0 30px rgba(245,158,11,0.25);
            position: relative; z-index: 10;
        }

        h1 {
            font-family: var(--font-display); font-size: 1.1rem; line-height: 1.5; text-align: center;
            color: var(--accent); text-shadow: 0 0 8px rgba(245,158,11,0.9), 3px 3px 0 #4a2e0d;
            margin-bottom: 10px;
        }

        .phase-subtitle { text-align: center; font-size: 1.15rem; color: var(--text-sub); margin-bottom: 18px; }

        .panel { background: rgba(0,0,0,0.35); border: 2px solid var(--border-color); padding: 18px; margin-bottom: 16px; text-align: center; }
        
        .timer-box {
            font-family: var(--font-display); font-size: 1.4rem; color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255,46,136,0.6); margin-bottom: 15px; text-align: center;
        }

        .mode-badge {
            display: inline-block; font-family: var(--font-display); font-size: 0.55rem;
            padding: 6px 10px; margin-bottom: 12px; background: rgba(34, 230, 255, 0.15);
            color: var(--neon-cyan); border: 1px solid var(--neon-cyan); text-transform: uppercase;
        }

        .mot-a-trouver {
            font-family: var(--font-display); font-size: 1.25rem; color: #fff;
            background: #07040f; border: 2px solid var(--accent); padding: 16px;
            margin-bottom: 15px; text-shadow: 0 0 8px rgba(245,158,11,0.8);
            word-break: break-word; text-align: center;
        }

        .interdits-box {
            text-align: left; background: rgba(255, 46, 136, 0.05);
            border: 2px dashed var(--neon-pink); padding: 14px; margin-bottom: 20px;
        }
        .interdits-box h3 {
            font-family: var(--font-display); font-size: 0.55rem; color: var(--neon-pink);
            margin-bottom: 8px; text-transform: uppercase;
        }
        .interdits-list {
            font-size: 1.15rem; color: var(--text-main); line-height: 1.4;
        }

        .grid-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }

        .grid-options {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 14px; font-family: var(--font-display); font-size: 0.6rem;
            cursor: pointer; border: none; box-shadow: 3px 3px 0 rgba(0,0,0,0.6);
            line-height: 1.4; text-align: center;
        }
        .btn-success { background: var(--neon-green); color: #000; text-shadow: 0 0 4px rgba(255,255,255,0.4); }
        .btn-danger { background: var(--neon-pink); color: #fff; text-shadow: 0 0 4px rgba(0,0,0,0.5); }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-cyan { background: var(--neon-cyan); color: #000; }
        .btn-time { background: rgba(245, 158, 11, 0.15); border: 2px solid var(--accent); color: var(--text-main); font-size: 0.7rem; }
        .btn-time.selected { background: var(--accent); color: #000; font-weight: bold; }

        .score-final {
            font-family: var(--font-display); font-size: 1.6rem; color: var(--neon-green);
            text-shadow: 0 0 10px rgba(77,255,166,0.6); margin: 15px 0;
        }
    </style>
</head>

        let state = {
            screen: "setup",

            score: 0,
            tempsRestant: 60,
            motsMelanges: [],
            indexMotActuel: 0,
            timerInterval: null
        };

        function configurerMode(mode) {
            state.modeJeu = mode;
            render();
        }

        function configurerDuree(secondes) {
            state.dureeSelectionnee = secondes;
            render();
        }

        function melangerTableau(tableau) {
            let arr = [...tableau];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function demarrerPartie() {
            state.score = 0;
            state.tempsRestant = state.dureeSelectionnee;
            state.motsMelanges = melangerTableau(BASE_MOTS);
            state.indexMotActuel = 0;
            state.screen = "jeu";
            render();

            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.tempsRestant--;
                if (state.tempsRestant <= 0) {
                    clearInterval(state.timerInterval);
                    state.screen = "fin";
                }
                render();
            }, 1000);
        }

        function validerMot() {
            state.score++;
            state.indexMotActuel++;
            render();
        }

        function passerMot() {
            state.indexMotActuel++;
            render();
        }

                    <p class="phase-subtitle">Paramètres de la partie</p>
                    
                    <div class="panel" style="margin-bottom:12px;">
                        <p style="font-size:0.95rem; color:var(--text-sub); margin-bottom:8px; text-transform:uppercase; font-family:var(--font-display);">1. Mode de jeu</p>
                        <div class="grid-options">
                            <button class="btn ${state.modeJeu === 'parole' ? 'btn-primary' : 'btn-time'}" onclick="configurerMode('parole')">💬 Parler</button>
                            <button class="btn ${state.modeJeu === 'mime' ? 'btn-cyan' : 'btn-time'}" onclick="configurerMode('mime')">🎭 Mimer</button>
                        </div>
                    </div>

                    <div class="panel" style="margin-bottom:15px;">
                        <p style="font-size:0.95rem; color:var(--text-sub); margin-bottom:8px; text-transform:uppercase; font-family:var(--font-display);">2. Temps du chronomètre</p>
                        <div class="grid-options">
                            <button class="btn btn-time ${state.dureeSelectionnee === 30 ? 'selected' : ''}" onclick="configurerDuree(30)">30 sec</button>
                            <button class="btn btn-time ${state.dureeSelectionnee === 60 ? 'selected' : ''}" onclick="configurerDuree(60)">60 sec</button>
                            <button class="btn btn-time ${state.dureeSelectionnee === 90 ? 'selected' : ''}" onclick="configurerDuree(90)">90 sec</button>
                            <button class="btn btn-time ${state.dureeSelectionnee === 120 ? 'selected' : ''}" onclick="configurerDuree(120)">120 sec</button>
                        </div>
                    </div>

                    <button class="btn btn-success" style="font-size:0.7rem; padding:16px;" onclick="demarrerPartie()">Lancer la partie (${state.dureeSelectionnee}s) ›</button>
                `;
            }
            else if (state.screen === "jeu") {
                let current = state.motsMelanges[state.indexMotActuel % state.motsMelanges.length];

                let contenuModeHtml = "";
                if (state.modeJeu === "parole") {
                    let interditsHtml = current.interdits.map(interdit => `• ${interdit}`).join("<br>");
                    contenuModeHtml = `
                        <div class="mode-badge">Mode : Parole</div>
                        <div class="interdits-box">
                            <h3>Mots Interdits :</h3>
                            <div class="interdits-list">${interditsHtml}</div>
                        </div>
                    `;
                } else {
                    contenuModeHtml = `
                        <div class="mode-badge" style="background: rgba(34,230,255,0.15); color:var(--neon-cyan); border-color:var(--neon-cyan);">Mode : Mime uniquement</div>
                        <div class="interdits-box" style="border-color:var(--neon-cyan); background:rgba(34,230,255,0.05);">
                            <h3>Règle :</h3>
                            <div class="interdits-list" style="color:var(--neon-cyan);">Mimez le mot sans parler ni faire aucun bruit !</div>
                        </div>
                    `;
                }

                app.innerHTML = `
                    <div class="timer-box">⏱️ ${state.tempsRestant} SECONDES</div>
                    
                    <div class="mot-a-trouver">
                        ${current.mot}
                    </div>

                    ${contenuModeHtml}

                    <div class="grid-actions">
                        <button class="btn btn-danger" onclick="passerMot()">Passer ⏭️</button>
                        <button class="btn btn-success" onclick="validerMot()">Trouvé ! ✓</button>
                    </div>

                    <div style="text-align:center; margin-top:15px; font-size:1.1rem; color:var(--text-sub);">
                        Score actuel : <strong style="color:var(--accent);">${state.score}</strong>
                    </div>
                `;
            }
            else if (state.screen === "fin") {
                if (state.timerInterval) clearInterval(state.timerInterval);

                app.innerHTML = `
                    <h1>FIN DU TEMPS !</h1>
                    <p class="phase-subtitle">Le chronomètre est écoulé</p>
                    <div class="panel">
                        <p style="font-size:1.1rem; color:var(--text-sub);">Score final de l'équipe :</p>
                        <div class="score-final">${state.score} Points</div>
                        <button class="btn btn-primary" onclick="state.screen='setup'; render();">Changer les paramètres / Rejouer ⟳</button>
                    </div>
                `;
            }
        }

        document.getElementById('btn-fullscreen').addEventListener('click', function () {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                this.textContent = "QUITTER";
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                this.textContent = 'PLEIN ÉCRAN';
            }
        });

        render();
    </script>
</body>
</html>
