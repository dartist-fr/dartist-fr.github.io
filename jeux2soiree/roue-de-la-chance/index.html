<body>

<div id="app"></div>

<script>

    /* =========================================================
       ÉTAT DE L'APPLICATION
    ========================================================= */

    const state = {

        screen: "home",

        /* IMPORTANT :
           La liste est vide au démarrage. */

        names: [],

        themeMode: "dark",

        rotation: 0,

        spinning: false,

        winnerIndex: null
    };


    /* =========================================================
       STOCKAGE LOCAL
    ========================================================= */

    function loadStorage() {

        try {

            const savedTheme =
                localStorage.getItem(
                    "wheel_theme"
                );

            if (
                savedTheme === "dark" ||
                savedTheme === "light"
            ) {

                state.themeMode =
                    savedTheme;
            }

            /*
             * Les noms précédemment entrés
             * peuvent être conservés.
             */

            const savedNames =
                localStorage.getItem(
                    "wheel_names"
                );

            if (savedNames) {

                const parsed =
                    JSON.parse(savedNames);

                if (
                    Array.isArray(parsed)
                ) {

                    state.names =
                        parsed;
                }
            }

        } catch (error) {

            console.log(
                "Impossible de charger les données."
            );
        }

        applyTheme();
    }


    function saveStorage() {

        try {

            localStorage.setItem(
                "wheel_theme",
                state.themeMode
            );

            localStorage.setItem(
                "wheel_names",
                JSON.stringify(
                    state.names
                )
            );

        } catch (error) {}
    }


    /* =========================================================
       THEME
    ========================================================= */

    function applyTheme() {

        document.documentElement
            .setAttribute(
                "data-theme",
                state.themeMode
            );
    }


    function toggleTheme() {

        state.themeMode =
            state.themeMode === "dark"
                ? "light"
                : "dark";

        saveStorage();

        applyTheme();

        render();
    }


    /* =========================================================
       PLEIN ÉCRAN
    ========================================================= */

    function toggleFullscreen() {

        const isFullscreen =
            document.fullscreenElement ||
            document.webkitFullscreenElement;

        if (!isFullscreen) {

            const element =
                document.documentElement;

            if (
                element.requestFullscreen
            ) {

                element.requestFullscreen();
            }

        } else {

            if (
                document.exitFullscreen
            ) {

                document.exitFullscreen();
            }
        }
    }


    document.addEventListener(
        "fullscreenchange",
        render
    );


    /* =========================================================
       AJOUTER UN NOM
    ========================================================= */

    function ajouterNom() {

        const input =
            document.getElementById(
                "nameInput"
            );

        if (!input) return;

        const nom =
            input.value.trim();

        if (!nom) {

            input.focus();

            return;
        }

        state.names.push(nom);

        input.value = "";

        saveStorage();

        render();

        setTimeout(() => {

            const newInput =
                document.getElementById(
                    "nameInput"
                );

            if (newInput) {

                newInput.focus();
            }

        }, 30);
    }


    /* =========================================================
       SUPPRIMER UN NOM
    ========================================================= */

    function supprimerNom(index) {

        if (state.spinning) return;

        state.names.splice(
            index,
            1
        );

        state.winnerIndex =
            null;

        saveStorage();

        render();
    }


    /* =========================================================
       VIDER LA LISTE
    ========================================================= */

    function viderListe() {

        if (state.spinning) return;

        if (!state.names.length) return;

        const confirmation =
            confirm(
                "Supprimer tous les participants ?"
            );

        if (!confirmation) return;

        state.names = [];

        state.winnerIndex = null;

        state.rotation = 0;

        saveStorage();

        render();
    }


    /* =========================================================
       MELANGER
    ========================================================= */

    function melangerListe() {

        if (state.spinning) return;

        for (
            let i =
                state.names.length - 1;

            i > 0;

            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );

            [
                state.names[i],
                state.names[j]
            ] = [
                state.names[j],
                state.names[i]
            ];
        }

        saveStorage();

        render();
    }


    /* =========================================================
       DESSIN DE LA ROUE
    ========================================================= */

    function drawWheel() {

        const canvas =
            document.getElementById(
                "wheel"
            );

        if (!canvas) return;

        const wrapper =
            canvas.parentElement;

        const rect =
            wrapper.getBoundingClientRect();

        const size =
            Math.max(
                300,
                Math.floor(
                    rect.width
                )
            );

        const dpr =
            window.devicePixelRatio ||
            1;

        canvas.width =
            size * dpr;

        canvas.height =
            size * dpr;

        canvas.style.width =
            size + "px";

        canvas.style.height =
            size + "px";

        const ctx =
            canvas.getContext("2d");

        ctx.scale(
            dpr,
            dpr
        );

        const center =
            size / 2;

        const radius =
            center - 8;

        ctx.clearRect(
            0,
            0,
            size,
            size
        );


        /* =========================
           ROUE VIDE
        ========================= */

        if (!state.names.length) {

            ctx.beginPath();

            ctx.arc(
                center,
                center,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#211437";

            ctx.fill();

            ctx.lineWidth = 5;

            ctx.strokeStyle =
                "#ff2e88";

            ctx.stroke();

            ctx.fillStyle =
                "#9d8bc4";

            ctx.font =
                "26px VT323";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "AJOUTE DES NOMS",
                center,
                center
            );

            return;
        }


        /* =========================
           SECTEURS
        ========================= */

        const count =
            state.names.length;

        const slice =
            (Math.PI * 2) /
            count;

        const colors = [

            "#ff2e88",
            "#7d3cff",
            "#22e6ff",
            "#ff4d4d",
            "#ff9d00",
            "#21d19f",
            "#b84dff",
            "#ff4db8"

        ];


        for (
            let i = 0;
            i < count;
            i++
        ) {

            const start =
                -Math.PI / 2 +
                i * slice;

            const end =
                start + slice;


            /* Secteur */

            ctx.beginPath();

            ctx.moveTo(
                center,
                center
            );

            ctx.arc(
                center,
                center,
                radius,
                start,
                end
            );

            ctx.closePath();

            ctx.fillStyle =
                colors[
                    i %
                    colors.length
                ];

            ctx.fill();

            ctx.lineWidth = 2;

            ctx.strokeStyle =
                "rgba(11,6,22,0.9)";

            ctx.stroke();


            /* =========================
               TEXTE
            ========================= */

            const middle =
                start +
                slice / 2;

            ctx.save();

            ctx.translate(
                center,
                center
            );

            ctx.rotate(
                middle
            );

            let text =
                state.names[i];

            let maxChars;

            if (count > 60) {

                maxChars = 7;

            } else if (count > 40) {

                maxChars = 9;

            } else if (count > 25) {

                maxChars = 11;

            } else if (count > 15) {

                maxChars = 15;

            } else {

                maxChars = 22;
            }


            if (
                text.length >
                maxChars
            ) {

                text =
                    text.substring(
                        0,
                        maxChars - 1
                    ) + "…";
            }


            let fontSize;

            if (count <= 8) {

                fontSize = 22;

            } else if (count <= 15) {

                fontSize = 17;

            } else if (count <= 30) {

                fontSize = 13;

            } else if (count <= 60) {

                fontSize = 10;

            } else {

                fontSize = 8;
            }


            ctx.font =
                "bold " +
                fontSize +
                "px VT323";

            ctx.fillStyle =
                "#ffffff";

            ctx.textAlign =
                "right";

            ctx.textBaseline =
                "middle";

            ctx.shadowColor =
                "rgba(0,0,0,0.9)";

            ctx.shadowBlur = 3;

            ctx.fillText(
                text,
                radius - 22,
                0
            );

            ctx.restore();
        }


        /* =========================
           CONTOUR EXTERIEUR
        ========================= */

        ctx.beginPath();

        ctx.arc(
            center,
            center,
            radius,
            0,
            Math.PI * 2
        );

        ctx.lineWidth = 8;

        ctx.strokeStyle =
            "#ff2e88";

        ctx.shadowColor =
            "rgba(255,46,136,0.8)";

        ctx.shadowBlur = 12;

        ctx.stroke();

        ctx.shadowBlur = 0;
    }


    /* =========================================================
       LANCER LA ROUE
    ========================================================= */

    function lancerRoue() {

        if (state.spinning)
            return;

        if (
            state.names.length < 2
        ) {

            alert(
                "Ajoute au moins 2 participants !"
            );

            return;
        }


        state.spinning = true;

        state.winnerIndex =
            Math.floor(
                Math.random() *
                state.names.length
            );


        const count =
            state.names.length;

        const slice =
            360 / count;


        /*
         * On calcule l'angle nécessaire
         * pour placer le gagnant sous
         * le pointeur situé en haut.
         */

        const targetAngle =
            -(
                state.winnerIndex *
                slice
            ) -
            slice / 2;


        const currentAngle =
            state.rotation % 360;


        let delta =
            targetAngle -
            currentAngle;


        while (delta < 0) {

            delta += 360;
        }


        /*
         * Nombre de tours :
         * entre 7 et 9 tours.
         */

        const extraTurns =
            7 +
            Math.floor(
                Math.random() * 3
            );


        const finalRotation =
            state.rotation +
            extraTurns * 360 +
            delta;


        const wheel =
            document.getElementById(
                "wheel"
            );


        if (!wheel) return;


        wheel.style.transition =
            "transform 6s cubic-bezier(0.12, 0.78, 0.16, 1)";


        wheel.style.transform =
            "rotate(" +
            finalRotation +
            "deg)";


        state.rotation =
            finalRotation;


        setTimeout(() => {

            state.spinning =
                false;

            afficherResultat();

        }, 6100);
    }


    /* =========================================================
       AFFICHER LE GAGNANT
    ========================================================= */

    function afficherResultat() {

        const resultBox =
            document.getElementById(
                "resultBox"
            );

        const resultName =
            document.getElementById(
                "resultName"
            );

        if (
            !resultBox ||
            !resultName
        ) return;


        resultName.textContent =
            state.names[
                state.winnerIndex
            ];


        resultBox.classList.add(
            "visible"
        );


        jouerSonVictoire();
    }


    /* =========================================================
       SON DE VICTOIRE
    ========================================================= */

    function jouerSonVictoire() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext)
                return;


            const audio =
                new AudioContext();

            const osc =
                audio.createOscillator();

            const gain =
                audio.createGain();


            osc.type =
                "square";


            osc.frequency.setValueAtTime(
                440,
                audio.currentTime
            );


            osc.frequency
                .exponentialRampToValueAtTime(
                    880,
                    audio.currentTime +
                    0.25
                );


            gain.gain.setValueAtTime(
                0.001,
                audio.currentTime
            );


            gain.gain
                .exponentialRampToValueAtTime(
                    0.18,
                    audio.currentTime +
                    0.03
                );


            gain.gain
                .exponentialRampToValueAtTime(
                    0.001,
                    audio.currentTime +
                    0.5
                );


            osc.connect(gain);

            gain.connect(
                audio.destination
            );


            osc.start();

            osc.stop(
                audio.currentTime +
                0.5
            );

        } catch (error) {}
    }


    /* =========================================================
       RETIRER LE GAGNANT
    ========================================================= */

    function retirerGagnant() {

        if (
            state.winnerIndex === null ||
            state.spinning
        ) return;


        const winner =
            state.names[
                state.winnerIndex
            ];


        const confirmation =
            confirm(
                "Retirer \"" +
                winner +
                "\" de la roue ?"
            );


        if (!confirmation)
            return;


        state.names.splice(
            state.winnerIndex,
            1
        );


        state.winnerIndex =
            null;

        state.rotation =
            0;

        saveStorage();

        render();
    }


    /* =========================================================
       RESET RESULTAT
    ========================================================= */

    function resetResult() {

        state.winnerIndex =
            null;

        state.rotation =
            0;
    }


    /* =========================================================
       SECURITE HTML
    ========================================================= */

    function escapeHTML(text) {

        return String(text)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );
    }


    /* =========================================================
       AFFICHAGE
    ========================================================= */

    function render() {

        const isFullscreen =
            !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement
            );


        let html = "";


        /* =========================
           BARRE DU HAUT
        ========================= */

        html += `
            <div class="top-bar">

                <a
                    href="../"
                    class="btn-back"
                >
                    &lsaquo; HUB
                </a>

            </div>
        `;


        /* =========================
           HEADER
        ========================= */

        html += `
            <header>

                <div>

                    <h1>
                        ROUE DE LA CHANCE
                    </h1>

                    <div class="subtitle">
                        Tirage au sort • Rétro Néon
                    </div>

                </div>

                <div class="headerbtns">

                    <button
                        class="themebtn"
                        onclick="toggleTheme()"
                    >
                        ${
                            state.themeMode === "dark"
                                ? "☀️"
                                : "🌙"
                        }
                    </button>

                    <button
                        class="themebtn"
                        onclick="toggleFullscreen()"
                    >
                        ${
                            isFullscreen
                                ? "✕"
                                : "⛶"
                        }
                    </button>

                </div>

            </header>
        `;


        /* =====================================================
           PAGE PARTICIPANTS
        ===================================================== */

        if (
            state.screen === "home"
        ) {

            html += `

                <div class="panel">

                    <h2>
                        PARTICIPANTS
                    </h2>

                    <p
                        class="dim"
                        style="margin-bottom:12px;"
                    >
                        Entre les noms des personnes
                        à faire participer au tirage.
                    </p>


                    <input
                        type="text"
                        id="nameInput"
                        placeholder="Entre un nom..."
                        maxlength="60"
                        autocomplete="off"
                    >


                    <button
                        class="btn btn-primary"
                        onclick="ajouterNom()"
                    >
                        + AJOUTER LE NOM
                    </button>


                    <div class="counter">

                        ${
                            state.names.length
                        }

                        PARTICIPANT${
                            state.names.length > 1
                                ? "S"
                                : ""
                        }

                    </div>


                    <div class="name-list">

                        ${
                            state.names.length

                            ? state.names.map(
                                (name, index) => `

                                    <div
                                        class="name-item"
                                    >

                                        <span>
                                            ${
                                                escapeHTML(
                                                    name
                                                )
                                            }
                                        </span>

                                        <button
                                            class="remove-name"
                                            onclick="supprimerNom(${index})"
                                        >
                                            ✕
                                        </button>

                                    </div>

                                `
                            ).join("")

                            : `

                                <p
                                    class="dim center"
                                    style="padding:20px;"
                                >
                                    Aucun participant.
                                    <br><br>
                                    Ajoute le premier nom
                                    pour commencer.
                                </p>

                            `
                        }

                    </div>


                    <div
                        style="
                            display:grid;
                            grid-template-columns:
                                1fr 1fr;
                            gap:8px;
                            margin-top:12px;
                        "
                    >

                        <button
                            class="btn btn-ghost"
                            onclick="melangerListe()"
                        >
                            🔀 MÉLANGER
                        </button>


                        <button
                            class="btn btn-ghost"
                            onclick="viderListe()"
                        >
                            🗑 VIDER
                        </button>

                    </div>


                    <button
                        class="btn btn-primary"
                        style="margin-top:20px;"
                        onclick="
                            if(state.names.length < 2) {
                                alert('Ajoute au moins 2 participants !');
                                return;
                            }

                            state.screen='wheel';
                            resetResult();
                            render();
                        "
                    >
                        🎰 LANCER LA ROUE
                    </button>

                </div>
            `;
        }


        /* =====================================================
           PAGE ROUE
        ===================================================== */

        else if (
            state.screen === "wheel"
        ) {

            html += `

                <div class="game-layout">

                    <!-- =====================
                         ROUE
                    ====================== -->

                    <div class="panel wheel-panel">

                        <h2>
                            TIRAGE AU SORT
                        </h2>


                        <div
                            class="wheel-wrapper"
                        >

                            <div
                                class="pointer"
                            ></div>


                            <canvas
                                id="wheel"
                            ></canvas>


                            <div
                                class="wheel-center"
                            >
                                GO!
                            </div>

                        </div>


                        <!-- RESULTAT -->

                        <div
                            id="resultBox"
                            class="result-box"
                        >

                            <div
                                class="result-label"
                            >
                                🎉 LE GAGNANT EST...
                            </div>


                            <div
                                id="resultName"
                                class="result-name"
                            ></div>

                        </div>


                        <!-- LANCER -->

                        <button
                            class="btn btn-primary"
                            onclick="lancerRoue()"
                            ${
                                state.spinning
                                    ? "disabled"
                                    : ""
                            }
                        >
                            🎰 TOURNER LA ROUE
                        </button>


                        <!-- RETIRER -->

                        <button
                            class="btn btn-yellow"
                            onclick="retirerGagnant()"
                        >
                            ✓ RETIRER LE GAGNANT
                        </button>


                        <!-- MODIFIER -->

                        <button
                            class="btn btn-ghost"
                            onclick="
                                state.screen='home';
                                resetResult();
                                render();
                            "
                        >
                            ⚙ MODIFIER LES NOMS
                        </button>

                    </div>


                    <!-- =====================
                         LISTE
                    ====================== -->

                    <div class="panel">

                        <h2>
                            PARTICIPANTS
                        </h2>


                        <div class="counter">

                            ${
                                state.names.length
                            }

                            NOM${
                                state.names.length > 1
                                    ? "S"
                                    : ""
                            }

                        </div>


                        <div class="name-list">

                            ${
                                state.names.map(
                                    (name, index) => `

                                        <div
                                            class="name-item"
                                        >

                                            <span>
                                                ${
                                                    escapeHTML(
                                                        name
                                                    )
                                                }
                                            </span>

                                            <button
                                                class="remove-name"
                                                onclick="supprimerNom(${index})"
                                            >
                                                ✕
                                            </button>

                                        </div>

                                    `
                                ).join("")
                            }

                        </div>


                        <button
                            class="btn btn-ghost"
                            onclick="melangerListe()"
                        >
                            🔀 MÉLANGER
                        </button>


                        <button
                            class="linkbtn"
                            onclick="
                                state.screen='home';
                                render();
                            "
                        >
                            ‹ Retour aux participants
                        </button>

                    </div>

                </div>

            `;
        }


        /* =========================
           INSERTION
        ========================= */

        document.getElementById(
            "app"
        ).innerHTML = html;


        /* =========================
           ENTER = AJOUT
        ========================= */

        const input =
            document.getElementById(
                "nameInput"
            );


        if (input) {

            input.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        ajouterNom();
                    }
                }
            );
        }


        /* =========================
           DESSIN ROUE
        ========================= */

        if (
            state.screen === "wheel"
        ) {

            requestAnimationFrame(
                () => {

                    drawWheel();

                    const wheel =
                        document.getElementById(
                            "wheel"
                        );

                    if (wheel) {

                        wheel.style.transform =
                            "rotate(" +
                            state.rotation +
                            "deg)";
                    }
                }
            );
        }
    }


    /* =========================================================
       REDIMENSIONNEMENT
    ========================================================= */

    window.addEventListener(
        "resize",
        function() {

            if (
                state.screen === "wheel"
            ) {

                drawWheel();
            }
        }
    );


    /* =========================================================
       DEMARRAGE
    ========================================================= */

    loadStorage();

    render();

</script>

</body>
</html>
