<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Insider — Salle d'Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0713;
            --card-bg: #16102b;
            --grid-line: rgba(34, 230, 255, 0.10);
            --border-color: rgba(34, 230, 255, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #bba9d6;
            --accent: #22e6ff;
            --accent-glow: rgba(34, 230, 255, 0.25);
            --moon: #ffe14d;
            --red: #ff3b5c;
            --green: #4dffa6;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-color); }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% -5%, rgba(34, 230, 255, 0.16) 0%, transparent 42%);
            background-size: 38px 38px, 38px 38px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            font-size: 1.15rem;
        }

        body::after {
            content: "";
            position: fixed; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
            z-index: 100; mix-blend-mode: multiply;
        }

        .top-bar { max-width: 560px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-back, .btn-fs {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-size: 0.5rem;
            color: var(--accent); text-decoration: none;
            padding: 10px 14px; border: 2px solid var(--accent);
            background: var(--accent-glow); cursor: pointer;
            box-shadow: 0 0 0 2px var(--bg-color), 4px 4px 0 rgba(34, 230, 255, 0.4);
        }

        .container {
            max-width: 560px; margin: 0 auto;
            background: var(--card-bg); border: 2px solid var(--accent);
            padding: 26px 22px;
            box-shadow: 0 0 0 4px var(--bg-color), 8px 8px 0 rgba(0,0,0,0.6), 0 0 30px rgba(34,230,255,0.25);
            position: relative; z-index: 10;
        }

        h1 {
            font-family: var(--font-display); font-size: 1.15rem; line-height: 1.5; text-align: center;
            color: var(--accent); text-shadow: 0 0 8px rgba(34,230,255,0.9), 3px 3px 0 #0d324a;
            margin-bottom: 14px;
        }

        .phase-subtitle { text-align: center; font-size: 1.15rem; color: var(--text-sub); margin-bottom: 22px; }

        .panel { background: rgba(0,0,0,0.30); border: 2px solid var(--border-color); padding: 16px; margin-bottom: 16px; }
        .panel h2 { font-family: var(--font-display); font-size: 0.62rem; color: var(--text-sub); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .chip {
            display: flex; align-items: center; gap: 8px;
            background: var(--accent-glow); border: 1px solid var(--accent);
            padding: 6px 10px; font-size: 1.1rem;
        }
        .chip button { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 1rem; font-family: var(--font-body); }

        .inline-input { display: flex; gap: 10px; }
        input[type="text"] {
            flex-grow: 1; background: #070510; border: 2px solid var(--border-color);
            color: #fff; padding: 11px 12px; font-size: 1.1rem; outline: none; font-family: var(--font-body);
        }

        /* Boutons de sélection de difficulté */
        .difficulty-selector { display: flex; gap: 8px; }
        .btn-diff {
            flex: 1; padding: 8px 4px; background: rgba(0,0,0,0.4); border: 2px solid var(--border-color);
            color: var(--text-sub); font-family: var(--font-display); font-size: 0.5rem; cursor: pointer; text-align: center;
        }
        .btn-diff.active { border-color: var(--accent); background: var(--accent-glow); color: var(--text-main); text-shadow: 0 0 6px var(--accent); }

        /* Stepper pour choisir les tours */
        .stepper { display: flex; align-items: center; gap: 10px; }
        .stepper button {
            width: 30px; height: 30px; background: var(--accent-glow);
            border: 2px solid var(--accent); color: #fff; cursor: pointer;
            font-family: var(--font-display); font-size: 0.6rem;
        }
        .stepper button:hover { background: var(--accent); color: #000; }
        .stepper span { font-family: var(--font-display); font-size: 0.7rem; min-width: 24px; text-align: center; color: var(--moon); }

        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 14px; font-family: var(--font-display); font-size: 0.66rem;
            cursor: pointer; border: none; box-shadow: 3px 3px 0 rgba(0,0,0,0.6);
            line-height: 1.5; text-align: center; margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: #000; text-shadow: 0 0 6px rgba(255,255,255,0.3); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-ghost { background: rgba(34,230,255,0.10); border: 2px solid var(--accent); color: var(--text-main); }

        .card-reveal {
            border: 2px dashed var(--accent); padding: 26px 18px; text-align: center; margin: 18px 0;
            background: var(--accent-glow); box-shadow: inset 0 0 26px rgba(34,230,255,0.15);
        }
        .word-box {
            font-family: var(--font-display); font-size: 1rem; color: var(--moon);
            margin: 16px 0; line-height: 1.6; text-shadow: 0 0 8px rgba(255,225,77,0.5);
        }

        .select-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
        .select-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.30); border: 2px solid var(--border-color);
            padding: 13px 14px; color: #fff; font-size: 1.1rem; cursor: pointer;
        }
        .select-item:hover { border-color: var(--accent); background: var(--accent-glow); }

        ul.rules-list { margin-left: 20px; color: var(--text-sub); text-align: left; }
        ul.rules-list li { margin-bottom: 8px; line-height: 1.4; }
        ul.rules-list strong { color: var(--accent); }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../" class="btn-back">&lsaquo; HUB</a>
        <button type="button" id="btn-fullscreen" class="btn-fs">PLEIN ÉCRAN</button>
    </div>

    <main class="container" id="app"></main>

    <script>
        // Banque de plus de 100 mots répartis par difficulté
        const banqueMots = {
            facile: [
                "Un chat", "Un chien", "Une pomme", "Le chocolat", "Un smartphone", "Une voiture", "Un lit", "Une table", "Un crayon", "Un ballon",
                "Une banane", "Un poisson", "Une maison", "Un vélo", "Une montre", "Une guitare", "Un livre", "Une tasse", "Une porte", "Une chemise",
                "Un chapeau", "Un canapé", "Un nuage", "Le soleil", "La lune", "Une fleur", "Un arbre", "Un oiseau", "Du pain", "Du lait",
                "Une pizza", "Des pâtes", "Un miroir", "Une chaise", "Une télé", "Une radio", "Un ordinateur", "Des lunettes", "Un sac", "Des chaussures"
            ],
            moyen: [
                "La Tour Eiffel", "Un astronaute", "Un sous-marin", "Un volcan", "Une boussole", "Un igloo", "Un kangourou", "Une montgolfière", "Un robot", "Un phare",
                "Un dromadaire", "Une sorcière", "Un toboggan", "Un koala", "Un pingouin", "Un vampire", "Une licorne", "Un marteau", "Une échelle", "Une corde",
                "Un appareil photo", "Une casquette", "Un parapluie", "Un micro", "Un skate", "Une trottinette", "Un cactus", "Une pyramide", "Un fantôme", "Un ananas",
                "Un violon", "Une épée", "Un papillon", "Une cascade", "Un lion", "Un masque", "Un hélicoptère", "Un télescope", "Un shamallow", "Une bicyclette"
            ],
            difficile: [
                "La photosynthèse", "Un paradoxe", "Un caméléon", "L'archéologie", "La gravité", "Un mirage", "Une métaphore", "L'inflation", "Un algorithme", "Une éclipse",
                "Un labyrinthe", "La liberté", "Une symphonie", "Un archipel", "La démocratie", "Un cataclysme", "Une constellation", "Le subconscient", "Un antagoniste", "Une utopie",
                "La résonance", "Un catalyseur", "L'immensité", "Une épiphanie", "Un anachronisme", "La bureaucratie", "Un pléonasme", "La métamorphose", "Un paradoxe", "L'intuition",
                "Un consensus", "La trajectoire", "Un protocole", "Une synergie", "Le paroxysme", "L'hologramme", "Un baromètre", "La biodiversité", "Un hémisphère", "L'osmose"
            ]
        };

        let state = {
            screen: "setup",
            players: ["Joueur 1", "Joueur 2", "Joueur 3", "Joueur 4"],
            gamePlayers: [],
            motActuel: "",
            revealIndex: 0,
            revealed: false,
            tourActuel: 1,
            maxTours: 15,
            difficulte: "moyen" // Difficulté par défaut
        };

        function addPlayer() {
            const input = document.getElementById("playerNameInput");
            const name = input ? input.value.trim() : "";
            if (name && !state.players.includes(name)) {
                state.players.push(name);
                render();
                setTimeout(() => document.getElementById("playerNameInput").focus(), 10);
            }
        }

        function removePlayer(index) {
            state.players.splice(index, 1);
            render();
        }

        function updateMaxTours(delta) {
            state.maxTours = Math.max(5, Math.min(30, state.maxTours + delta));
            render();
        }

        function setDifficulte(niveau) {
            state.difficulte = niveau;
            render();
        }

        function shuffle(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function demarrerJeu() {
            if (state.players.length < 3) {
                alert("Il faut au moins 3 joueurs pour une partie d'Insider !");
                return;
            }

            // Sélection du mot selon la difficulté choisie
            const listeMots = banqueMots[state.difficulte];
            state.motActuel = listeMots[Math.floor(Math.random() * listeMots.length)];

            if (state.gamePlayers.length === 0 || state.gamePlayers.length !== state.players.length) {
                state.gamePlayers = state.players.map(name => ({ name: name, role: "", score: 0 }));
            }

            let roles = ["maitre", "insider"];
            while (roles.length < state.players.length) {
                roles.push("villageois");
            }
            roles = shuffle(roles);
            let joueursMelanges = shuffle(state.players);

            state.gamePlayers.forEach((gp, index) => {
                gp.name = joueursMelanges[index];
                gp.role = roles[index];
            });

            state.revealIndex = 0;
            state.revealed = false;
            state.tourActuel = 1;
            state.screen = "reveal";
            render();
        }

        function render() {
            const app = document.getElementById("app");

            if (state.screen === "setup") {
                let chipsHtml = state.players.map((p, i) => `
                    <div class="chip">
                        <span>${p}</span>
                        <button onclick="removePlayer(${i})">✕</button>
                    </div>
                `).join("");

                app.innerHTML = `
                    <h1>INSIDER</h1>
                    <p class="phase-subtitle">Trouve le mot, démasque l'espion</p>

                    <div class="panel">
                        <h2>Règles du jeu & Système de points</h2>
                        <ul class="rules-list">
                            <li><strong>Le Maître :</strong> Connaît le mot et répond par Oui ou Non.</li>
                            <li><strong>L'Insider :</strong> Connaît le mot et doit influencer le groupe sans se faire griller.</li>
                            <li><strong>Limite de tours :</strong> Si le compteur de questions tombe à 0 avant que le mot ne soit trouvé, l'Insider gagne !</li>
                            <li><strong>Points :</strong> +2 pts pour les villageois si l'Insider est démasqué. +3 pts pour l'Insider s'il réussit sa tâche discrètement.</li>
                        </ul>
                    </div>

                    <div class="panel">
                        <h2>Difficulté du mot</h2>
                        <div class="difficulty-selector">
                            <button class="btn-diff ${state.difficulte === 'facile' ? 'active' : ''}" onclick="setDifficulte('facile')">Facile</button>
                            <button class="btn-diff ${state.difficulte === 'moyen' ? 'active' : ''}" onclick="setDifficulte('moyen')">Moyen</button>
                            <button class="btn-diff ${state.difficulte === 'difficile' ? 'active' : ''}" onclick="setDifficulte('difficile')">Difficile</button>
                        </div>
                    </div>

                    <div class="panel">
                        <h2>
                            <span>Limite de questions</span>
                            <div class="stepper">
                                <button onclick="updateMaxTours(-1)">−</button>
                                <span>${state.maxTours}</span>
                                <button onclick="updateMaxTours(1)">+</button>
                            </div>
                        </h2>
                    </div>

                    <div class="panel">
                        <h2>Participants (${state.players.length})</h2>
                        <div class="chips">${chipsHtml}</div>
                        <div class="inline-input">
                            <input type="text" id="playerNameInput" placeholder="Nom du joueur" onkeydown="if(event.key==='Enter') addPlayer()">
                            <button class="btn btn-ghost" style="width:auto; padding:0 16px; margin-top:0;" onclick="addPlayer()">+</button>
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="demarrerJeu()">Distribuer les rôles ›</button>
                `;
            } 
            else if (state.screen === "reveal") {
                const current = state.gamePlayers[state.revealIndex];

                let roleDescription = "";
                if (current.role === "maitre") {
                    roleDescription = `👑 <strong>MAÎTRE DU MOT</strong><br><br>Le mot secret est :<div class="word-box">${state.motActuel}</div><br>Tu animes le jeu et réponds aux questions des autres par Oui ou Non.`;
                } else if (current.role === "insider") {
                    roleDescription = `🕵️ <strong>INSIDER (ESPION)</strong><br><br>Le mot secret est :<div class="word-box">${state.motActuel}</div><br>Aide le groupe à trouver le mot avant la fin des ${state.maxTours} tours sans te faire repérer !`;
                } else {
                    roleDescription = `🧑‍🌾 <strong>VILLAGEOIS</strong><br><br>Tu ne connais pas le mot. Pose des questions au Maître pour le deviner et surveille les comportements louches !`;
                }

                if (!state.revealed) {
                    app.innerHTML = `
                        <h1>Attribution des rôles</h1>
                        <p class="phase-subtitle">Joueur ${state.revealIndex + 1} / ${state.gamePlayers.length}</p>
                        <div class="card-reveal">
                            <p style="color:var(--text-sub); font-size:1.1rem; margin-bottom:15px;">Passez le téléphone à :</p>
                            <h2 style="font-size:1.5rem; color:var(--text-main); margin-bottom:20px;">${current.name}</h2>
                            <button class="btn btn-primary" onclick="state.revealed=true; render();">👁️ Voir mon rôle</button>
                        </div>
                    `;
                } else {
                    app.innerHTML = `
                        <h1>Votre Rôle</h1>
                        <p class="phase-subtitle">${current.name}</p>
                        <div class="card-reveal" style="text-align: left; font-size: 1rem; line-height: 1.5;">
                            ${roleDescription}
                        </div>
                        <button class="btn btn-ghost" onclick="
                            if (state.revealIndex + 1 < state.gamePlayers.length) {
                                state.revealIndex++; state.revealed = false; render();
                            } else {
                                state.screen = 'play'; render();
                            }
                        ">Mémorisé — Passer au joueur suivant ›</button>
                    `;
                }
            }
            else if (state.screen === "play") {
                app.innerHTML = `
                    <h1>Phase de Questionnement</h1>
                    <p class="phase-subtitle">Tour ${state.tourActuel} / ${state.maxTours}</p>
                    
                    <div class="panel" style="text-align:center; padding: 20px;">
                        <p style="font-size:1.1rem; color:var(--text-sub); margin-bottom:15px;">Le groupe pose des questions au Maître du mot.</p>
                        
                        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;">
                            <button class="btn btn-ghost" onclick="if(state.tourActuel < state.maxTours) { state.tourActuel++; render(); }">+ Question suivante (${state.tourActuel}/${state.maxTours})</button>
                        </div>

                        <hr style="border-color:var(--border-color); margin: 20px 0;">

                        <p style="font-size:1.1rem; margin-bottom:15px;">Le mot a-t-il été trouvé par le groupe ?</p>
                        <button class="btn btn-primary" onclick="state.screen='vote_insider'; render();">Oui, mot trouvé ! Passer au vote 🗳️</button>
                        <button class="btn btn-danger" style="margin-top:10px;" onclick="finDePartie('insider_gagne_temps')">Non, temps écoulé (Victoire Insider) ❌</button>
                    </div>
                `;
            }
            else if (state.screen === "vote_insider") {
                let votesHtml = state.gamePlayers.map(gp => `
                    <div class="select-item" onclick="validerVoteInsider('${gp.name}')">
                        <span>${gp.name}</span>
                        <span>👉 Suspecter</span>
                    </div>
                `).join("");

                app.innerHTML = `
                    <h1>Démasquez l'Insider</h1>
                    <p class="phase-subtitle">Le mot a été trouvé ! Qui était l'espion ?</p>
                    <div class="panel">
                        <p style="font-size:1rem; color:var(--text-sub); margin-bottom:15px;">Votez pour la personne que vous suspectez d'avoir influencé le groupe :</p>
                        <div class="select-list">
                            ${votesHtml}
                        </div>
                    </div>
                `;
            }
            else if (state.screen === "fin_partie") {
                let classement = [...state.gamePlayers].sort((a, b) => b.score - a.score);
                const insiderObj = state.gamePlayers.find(p => p.role === "insider");

                app.innerHTML = `
                    <h1>Résultats de la Manche</h1>
                    <p class="phase-subtitle">${state.messageFin}</p>

                    <div class="card-reveal" style="margin-bottom:20px;">
                        <p style="color:var(--text-sub);">L'Insider était :</p>
                        <div class="role-badge" style="color:var(--red);">${insiderObj ? insiderObj.name : "Inconnu"}</div>
                        <p style="color:var(--text-sub); font-size:1.0rem; margin-top:10px;">Le mot secret était : <strong>${state.motActuel}</strong></p>
                    </div>

                    <div class="panel">
                        <h2>Classement Général</h2>
                        <div class="select-list" style="margin-top: 10px;">
                            ${classement.map(j => `
                                <div class="select-item" style="cursor: default; margin-bottom: 8px;">
                                    <span>${j.name}</span>
                                    <span style="color: var(--accent); font-weight: bold;">${j.score} pts</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="demarrerJeu()">Manche Suivante ⟳</button>
                    <button class="btn btn-ghost" onclick="state.screen='setup'; render();">Changer de joueurs</button>
                `;
            }
        }

        function validerVoteInsider(nomAccuse) {
            const insiderObj = state.gamePlayers.find(p => p.role === "insider");
            
            if (nomAccuse === insiderObj.name) {
                state.gamePlayers.forEach(gp => {
                    if (gp.role !== "insider") gp.score += 2;
                });
                state.messageFin = "🏆 Victoire du Village ! L'Insider a été démasqué.";
            } else {
                if (insiderObj) insiderObj.score += 3;
                state.messageFin = "🕵️ Victoire de l'Insider ! Il a berné tout le monde.";
            }

            state.screen = "fin_partie";
            render();
        }

        function finDePartie(raison) {
            if (raison === 'insider_gagne_temps') {
                const insiderObj = state.gamePlayers.find(p => p.role === "insider");
                if (insiderObj) insiderObj.score += 3;
                state.messageFin = "⏱️ Temps écoulé ! L'Insider remporte la mise.";
            }
            state.screen = "fin_partie";
            render();
        }

        document.getElementById('btn-fullscreen').addEventListener('click', function () {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                this.textContent = "QUITTER";
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                this.textContent = "PLEIN ÉCRAN";
            }
        });

        render();
    </script>
</body>
</html>
