<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Monopoly • Jeux2Soirée</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#252525 0%,#101010 45%,#050505 100%);
    color:#fff;
    font-family:VT323,monospace;
}

button,
input{
    font-family:VT323,monospace;
}

button{
    cursor:pointer;
}

#app{
    min-height:100vh;
    padding:20px;
}

/* =====================================================
   ACCUEIL
===================================================== */

.screen{
    max-width:1200px;
    margin:auto;
}

.hidden{
    display:none!important;
}

.logo{
    text-align:center;
    margin:20px 0 30px;
}

.logo h1{
    margin:0;
    font-family:"Press Start 2P",monospace;
    font-size:34px;
    color:#fff;
    text-shadow:4px 4px 0 #000;
}

.logo span{
    display:block;
    margin-top:12px;
    font-size:24px;
}

.menu{
    max-width:500px;
    margin:auto;
    padding:25px;
    border:3px solid #fff;
    background:#151515;
    box-shadow:8px 8px 0 #000;
}

.menu h2{
    margin-top:0;
    font-family:"Press Start 2P";
    font-size:18px;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:2px solid #777;
    background:#222;
    color:#fff;
    font-size:22px;
}

button{
    border:2px solid #fff;
    background:#222;
    color:#fff;
    padding:12px 18px;
    font-size:22px;
    margin:5px 0;
}

button:hover{
    background:#fff;
    color:#000;
}

.primary{
    width:100%;
    background:#e63946;
    border-color:#e63946;
}

.primary:hover{
    background:#fff;
    color:#e63946;
}

.divider{
    height:2px;
    background:#444;
    margin:20px 0;
}

/* =====================================================
   GAME
===================================================== */

#gameScreen{
    max-width:1500px;
    margin:auto;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:15px;
}

.room{
    font-family:"Press Start 2P";
    font-size:13px;
}

#turnText{
    font-size:25px;
}

/* =====================================================
   LAYOUT
===================================================== */

.gameLayout{
    display:grid;
    grid-template-columns:minmax(500px,850px) 320px;
    gap:20px;
    align-items:start;
}

.boardWrap{
    width:100%;
    aspect-ratio:1;
    max-width:850px;
    margin:auto;
}

.board{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(11,1fr);
    grid-template-rows:repeat(11,1fr);
    background:#eee;
    border:6px solid #111;
    box-shadow:12px 12px 0 #000;
}

.tile{
    position:relative;
    border:1px solid #111;
    background:#f4f0df;
    color:#111;
    overflow:hidden;
    min-width:0;
}

.tile.center{
    grid-column:2 / 11;
    grid-row:2 / 11;
    background:
        linear-gradient(
            135deg,
            #d7f1d7,
            #f5f0d9
        );
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

.centerTitle{
    font-family:"Press Start 2P";
    font-size:24px;
    transform:rotate(-20deg);
    color:#222;
}

.centerSub{
    font-size:25px;
    margin-top:15px;
}

.propertyColor{
    height:18%;
    width:100%;
}

.tileName{
    font-size:17px;
    line-height:1;
    text-align:center;
    padding:4px;
}

.tilePrice{
    position:absolute;
    bottom:4px;
    width:100%;
    text-align:center;
    font-size:15px;
}

.tileSpecial{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:16px;
    padding:5px;
    height:100%;
}

.corner{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    font-family:"Press Start 2P";
    font-size:10px;
}

.pawn{
    position:absolute;
    z-index:10;
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:2px 2px 0 #000;
    transform:translate(-50%,-50%);
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.panel{
    background:#151515;
    border:2px solid #555;
    padding:15px;
    box-shadow:5px 5px 0 #000;
}

.panel h3{
    margin:0 0 10px;
    font-family:"Press Start 2P";
    font-size:13px;
}

.money{
    font-size:32px;
    color:#78e08f;
}

.players{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.player{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px;
    background:#222;
    border-left:5px solid #fff;
}

.player.active{
    background:#343434;
    border-left-color:#78e08f;
}

.actions button{
    width:100%;
}

.dice{
    display:flex;
    gap:10px;
    justify-content:center;
    font-size:50px;
}

.log{
    max-height:260px;
    overflow:auto;
    font-size:18px;
}

.logLine{
    padding:4px 0;
    border-bottom:1px solid #333;
}

#error{
    color:#ff7675;
    min-height:25px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

    .gameLayout{
        grid-template-columns:1fr;
    }

    .boardWrap{
        max-width:750px;
    }

    .sidebar{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){

    #app{
        padding:8px;
    }

    .logo h1{
        font-size:22px;
    }

    .board{
        border-width:3px;
    }

    .tileName{
        font-size:10px;
    }

    .tilePrice{
        font-size:9px;
    }

    .propertyColor{
        height:12%;
    }

    .centerTitle{
        font-size:12px;
    }

    .centerSub{
        font-size:15px;
    }

    .sidebar{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =================================================
         MENU
    ================================================== -->

    <section id="menuScreen" class="screen">

        <div class="logo">
            <h1>MONOPOLY</h1>
            <span>JEUX2SOIRÉE</span>
        </div>

        <div class="menu">

            <h2>Créer une partie</h2>

            <input
                id="createName"
                placeholder="Ton prénom"
                maxlength="18"
            >

            <button
                class="primary"
                id="createBtn"
            >
                CRÉER UN SALON
            </button>

            <div class="divider"></div>

            <h2>Rejoindre</h2>

            <input
                id="joinName"
                placeholder="Ton prénom"
                maxlength="18"
            >

            <input
                id="joinRoom"
                placeholder="CODE DU SALON"
                maxlength="4"
            >

            <button
                id="joinBtn"
                class="primary"
            >
                REJOINDRE
            </button>

            <div id="error"></div>

        </div>

    </section>


    <!-- =================================================
         GAME
    ================================================== -->

    <section id="gameScreen" class="hidden">

        <div class="topbar">

            <div>
                <div class="room">
                    SALON :
                    <span id="roomCode">----</span>
                </div>

                <div id="turnText">
                    En attente...
                </div>
            </div>

            <button id="startBtn">
                COMMENCER
            </button>

        </div>


        <div class="gameLayout">

            <!-- BOARD -->

            <div class="boardWrap">

                <div id="board" class="board">

                    <div
                        id="center"
                        class="tile center"
                    >
                        <div class="centerTitle">
                            MONOPOLY
                        </div>

                        <div class="centerSub">
                            EUROPE
                        </div>
                    </div>

                </div>

            </div>


            <!-- SIDEBAR -->

            <aside class="sidebar">

                <div class="panel">

                    <h3>MON PORTEFEUILLE</h3>

                    <div
                        id="money"
                        class="money"
                    >
                        0 €
                    </div>

                </div>


                <div class="panel">

                    <h3>DÉS</h3>

                    <div
                        id="dice"
                        class="dice"
                    >
                        🎲 🎲
                    </div>

                </div>


                <div class="panel">

                    <h3>ACTIONS</h3>

                    <div class="actions">

                        <button id="rollBtn">
                            🎲 LANCER LES DÉS
                        </button>

                        <button id="buyBtn">
                            🏠 ACHETER
                        </button>

                    </div>

                </div>


                <div class="panel">

                    <h3>JOUEURS</h3>

                    <div
                        id="players"
                        class="players"
                    ></div>

                </div>


                <div class="panel">

                    <h3>JOURNAL</h3>

                    <div
                        id="log"
                        class="log"
                    ></div>

                </div>

            </aside>

        </div>

    </section>

</div>

<script src="monopoly.js"></script>

</body>
</html>
