<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Préfères ? — Édition Hardcore & Humour Noir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0616;
            --card-bg: #140a26;
            --grid-line: rgba(255, 46, 136, 0.10);
            --border-color: rgba(255, 46, 136, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #9d8bc4;
            --accent: #ff2e88;
            --neon-green: #4dffa6;
            --neon-cyan: #22e6ff;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-color); }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(255, 46, 136, 0.15) 0%, transparent 55%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            font-size: 1.2rem;
        }
        body::after {
            content: "";
            position: fixed; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
            z-index: 100; mix-blend-mode: multiply;
        }
        .top-bar { max-width: 600px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-back, .btn-fs {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-size: 0.5rem;
            color: var(--accent); text-decoration: none;
            padding: 10px 14px; border: 2px solid var(--accent);
            background: rgba(255, 46, 136, 0.06); cursor: pointer;
            box-shadow: 0 0 0 2px var(--bg-color), 4px 4px 0 rgba(255, 46, 136, 0.35);
        }
        .container {
            max-width: 600px; margin: 0 auto;
            background: var(--card-bg); border: 2px solid var(--accent);
            padding: 24px 20px;
            box-shadow: 0 0 0 4px var(--bg-color), 8px 8px 0 rgba(0,0,0,0.6), 0 0 30px rgba(255,46,136,0.25);
            position: relative; z-index: 10;
            text-align: center;
        }
        h1 {
            font-family: var(--font-display); font-size: 1.1rem; line-height: 1.4;
            color: var(--accent); text-shadow: 0 0 8px rgba(255,46,136,0.9), 3px 3px 0 #4a0d2b;
            margin-bottom: 8px;
        }
        .phase-subtitle { font-size: 1.15rem; color: var(--text-sub); margin-bottom: 20px; }
        .panel { background: rgba(0,0,0,0.35); border: 2px solid var(--border-color); padding: 18px; margin-bottom: 16px; text-align: center; }
        .btn-mode {
            display: block; width: 100%; padding: 14px; margin-bottom: 12px;
            font-family: var(--font-display); font-size: 0.6rem; cursor: pointer;
            border: 2px solid; background: #07040f; box-shadow: 3px 3px 0 rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }
        .btn-mode:hover { transform: translateY(-2px); }
        .mode-soft { color: var(--neon-cyan); border-color: var(--neon-cyan); }
        .mode-normal { color: var(--neon-green); border-color: var(--neon-green); }
        .mode-hardcore { color: var(--accent); border-color: var(--accent); }
        .dilemme-box {
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;
        }
        .btn-choix {
            background: #07040f; border: 2px solid var(--border-color); color: #fff;
            padding: 20px; font-family: var(--font-body); font-size: 1.3rem;
            cursor: pointer; transition: all 0.2s; text-align: center; line-height: 1.4;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.4); position: relative;
        }
        .btn-choix:hover { border-color: var(--accent); background: rgba(255, 46, 136, 0.1); }
        .btn-action {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 14px; font-family: var(--font-display); font-size: 0.6rem;
            background: var(--accent); color: #000; border: none; cursor: pointer;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.6); font-weight: bold; margin-top: 10px;
        }
        .btn-secondary { background: rgba(255, 46, 136, 0.1); border: 2px solid var(--accent); color: var(--text-main); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../" class="btn-back">&lsaquo; HUB</a>
        <button type="button" id="btn-fullscreen" class="btn-fs">PLEIN ÉCRAN</button>
    </div>
    <main class="container" id="app"></main>
    <script>
        const QUESTIONS = {
            soft: [
                ["Avoir toujours une chanson ridicule bloquée dans la tête", "Ne plus jamais pouvoir écouter de musique de ta vie"],
                ["Avoir un rire de hyène à chaque fois que tu es stressé", "Péter très fort à chaque fois que tu dis bonjour à quelqu'un"],
                ["Devoir porter des palmes pour marcher partout", "Devoir te déplacer uniquement en faisant du moonwalk"]
            ],
            normal: [
                ["Que ton historique Google soit lu à haute voix à ton mariage", "Que tes parents trouvent ta boîte mail secrète"],
                ["Vivre sans smartphone pendant 10 ans", "Passer 1 an en cellule avec ton ex le/la plus toxique"],
                ["Avoir des mains de 3 mètres de long", "Avoir des jambes de 40 centimètres"]
            ],
            hardcore: [
                // --- Version trash / humour noir poussé ---
                ["Manger un steak de ton propre mollet cuit à point par un chef 3 étoiles", "Boire un shot du sang menstruel de ton ex qui t'a le plus traîné dans la boue"],
                ["Devoir choisir lequel de tes deux parents meurt aujourd'hui, en sachant que l'autre saura que c'est toi qui as décidé", "Vivre avec la certitude que tu as accidentellement tué un enfant en voiture et que personne ne le saura jamais"],
                ["Passer le reste de ta vie à sentir en permanence l'odeur de putréfaction d'un cadavre que tu es le seul à percevoir", "Devoir toucher tous les jours le sexe encore chaud d'un mort dans une morgue pour garder ton emploi"],
                ["Regarder en boucle, pendant 72h non-stop, la vidéo de ta mère en train de se faire baiser par ton meilleur pote", "Effacer définitivement de ta mémoire le visage et la voix de toutes les personnes que tu as aimées"],
                ["Avoir un cadavre frais dans le coffre de ta voiture que tu dois transporter tous les jours sans te faire griller", "Être convaincu à 100 % que tu es un tueur en série alors que tu n'as jamais tué personne"],
                ["Vivre dans un monde où tout le monde entend tes pensées les plus dégueulasses en temps réel", "Ne pouvoir communiquer qu'en hurlant tes secrets les plus sales à chaque conversation"],
                ["Assister impuissant à l'humiliation sexuelle publique de ton frère/sœur devant 10 000 personnes", "Être toi-même la cible de cette même humiliation filmée et diffusée en direct"],
                ["Devoir sucer le pied d'un SDF pourri une fois par semaine pour rester en vie", "Manger une pleine cuillère de caca frais de ton pire ennemi tous les matins"],
                ["Savoir que ta partenaire te trompe avec ton père et ne jamais pouvoir le dire", "Découvrir que tu es le fruit d'un viol et que ton vrai père est en prison pour ça"],
                ["Passer le reste de ta vie enfermé dans une pièce avec le bruit en boucle des derniers râles d'agonie de quelqu'un que tu aimais", "Entendre en permanence les pensées sexuelles les plus crades de tous les inconnus autour de toi"],
                ["Devoir choisir entre sauver ton enfant ou sauver 100 enfants inconnus, en sachant que ton choix sera filmé et jugé par le monde entier", "Vivre avec la certitude que tu as laissé mourir ton enfant pour sauver les 100 autres"],
                ["Avoir un cancer en phase terminale et devoir raconter à ta famille que c'est de leur faute", "Être le seul survivant d'un accident où tous tes proches sont morts parce que tu as insisté pour prendre la voiture"],
                ["Devoir te branler en public devant ta propre famille une fois par an", "Ne plus jamais pouvoir te toucher le sexe, même sous la douche, jusqu'à ta mort"],
                ["Vivre avec un trou permanent dans le crâne par lequel on peut voir ton cerveau bouger", "Avoir une fistule anale qui s'ouvre et se ferme toute seule en public sans que tu puisses le contrôler"],
                ["Savoir exactement la date, l'heure et la manière dont tu vas mourir, et ne rien pouvoir y faire", "Vivre dans l'angoisse permanente que n'importe qui autour de toi peut t'assassiner demain"]
            ]
        };

        let state = {
            screen: "setup",
            modeActuel: "normal",
            questionCourante: 0
        };

        function choisirMode(mode) {
            state.modeActuel = mode;
            state.screen = "jeu";
            state.questionCourante = Math.floor(Math.random() * QUESTIONS[mode].length);
            render();
        }

        function questionSuivante() {
            let liste = QUESTIONS[state.modeActuel];
            state.questionCourante = Math.floor(Math.random() * liste.length);
            render();
        }

        function render() {
            const app = document.getElementById("app");
            if (state.screen === "setup") {
                app.innerHTML = `
                    <h1>TU PRÉFÈRES ?</h1>
                    <p class="phase-subtitle">Choisis l'intensité de la soirée</p>
                    <div class="panel">
                        <button class="btn-mode mode-soft" onclick="choisirMode('soft')">Mode SOFT 🟢<br><span style="font-size:0.45rem; color:var(--text-sub)">Rigolo et gentiment gênant</span></button>
                        <button class="btn-mode mode-normal" onclick="choisirMode('normal')">Mode NORMAL 🟡<br><span style="font-size:0.45rem; color:var(--text-sub)">Gênance et dilemmes classiques</span></button>
                        <button class="btn-mode mode-hardcore" onclick="choisirMode('hardcore')">Mode HARDCORE 🔴<br><span style="font-size:0.45rem; color:var(--text-sub)">Humour noir pure race — trash max</span></button>
                    </div>
                `;
            } else if (state.screen === "jeu") {
                let dilemme = QUESTIONS[state.modeActuel][state.questionCourante];
                app.innerHTML = `
                    <h1>MODE ${state.modeActuel.toUpperCase()}</h1>
                    <p class="phase-subtitle">Faites votre choix, lâcheurs...</p>
                    
                    <div class="dilemme-box">
                        <button class="btn-choix" onclick="questionSuivante()">👉 ${dilemme[0]}</button>
                        <div style="font-family:var(--font-display); font-size:0.7rem; color:var(--accent);">OU</div>
                        <button class="btn-choix" onclick="questionSuivante()">👉 ${dilemme[1]}</button>
                    </div>
                    <button class="btn-action" onclick="questionSuivante()">Dilemme suivant ➔</button>
                    <button class="btn-action btn-secondary" onclick="state.screen='setup'; render();">Changer de mode ⟳</button>
                `;
            }
        }

        document.getElementById('btn-fullscreen').addEventListener('click', function () {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                this.textContent = "QUITTER";
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                this.textContent = "PLEIN ÉCRAN";
            }
        });

        render();
    </script>
</body>
</html>
