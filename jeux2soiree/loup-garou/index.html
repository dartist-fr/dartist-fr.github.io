<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loup-Garou — Salle d'Arcade</title>
    <link rel="manifest" href="/jeux.io/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette nocturne arcade : clair de lune violet + néon sang */
            --bg-color: #0a0713;
            --bg-panel: #16102b;
            --card-bg: #16102b;
            --grid-line: rgba(124, 58, 237, 0.10);
            --border-color: rgba(168, 85, 247, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #a794c9;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --moon: #ffe14d;
            --red: #ff3b5c;
            --green: #4dffa6;
            --amber: #ffb14d;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { background: var(--bg-color); }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            /* Sol d'arcade + halo de pleine lune */
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% -5%, rgba(255, 225, 77, 0.16) 0%, transparent 42%),
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.18) 0%, transparent 60%);
            background-size: 38px 38px, 38px 38px, 100% 100%, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            overflow-x: hidden;
            font-size: 1.15rem;
        }

        /* Scanlines CRT globales */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
                rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
            );
            z-index: 100;
            mix-blend-mode: multiply;
        }

        /* --- Barre supérieure --- */
        .top-bar { max-width: 560px; margin: 0 auto 20px; display: flex; justify-content: flex-start; }
        .btn-back {
            display: inline-flex; align-items: center; gap: 10px;
            font-family: var(--font-display); font-size: 0.55rem;
            color: var(--accent); text-decoration: none;
            padding: 11px 16px; border: 2px solid var(--accent);
            background: var(--accent-glow);
            box-shadow: 0 0 0 2px var(--bg-color), 4px 4px 0 rgba(168, 85, 247, 0.4);
            transition: transform 0.12s steps(2), box-shadow 0.12s;
        }
        .btn-back:hover, .btn-back:focus {
            transform: translate(-2px, -2px);
            box-shadow: 0 0 0 2px var(--bg-color), 6px 6px 0 var(--accent);
            outline: none;
        }

        /* --- Conteneur (borne) --- */
        .container {
            max-width: 560px; margin: 0 auto;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 26px 22px;
            box-shadow: 0 0 0 4px var(--bg-color), 8px 8px 0 rgba(0,0,0,0.6), 0 0 30px rgba(168,85,247,0.25);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.15rem; line-height: 1.5; text-align: center;
            color: var(--accent);
            text-shadow: 0 0 8px rgba(168,85,247,0.9), 0 0 20px rgba(168,85,247,0.5), 3px 3px 0 #2a0d4a;
            margin-bottom: 14px;
            animation: flicker 5s infinite;
        }
        @keyframes flicker { 0%,92%,100%{opacity:1;} 93%{opacity:0.7;} 94%{opacity:1;} 96%{opacity:0.85;} }

        h2 {
            font-family: var(--font-display);
            font-size: 0.72rem; line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .phase-subtitle {
            text-align: center; font-size: 1.15rem;
            color: var(--text-sub); margin-bottom: 22px; letter-spacing: 0.5px;
        }

        /* --- Panneaux --- */
        .panel {
            background: rgba(0,0,0,0.30);
            border: 2px solid var(--border-color);
            padding: 16px; margin-bottom: 16px;
        }
        .panel h2 {
            font-family: var(--font-display); font-size: 0.62rem;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--text-sub); margin-bottom: 14px;
            display: flex; justify-content: space-between; gap: 8px; line-height: 1.5;
        }

        /* --- Chips joueurs --- */
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .chip {
            display: flex; align-items: center; gap: 8px;
            background: var(--accent-glow); border: 1px solid var(--accent);
            padding: 6px 10px; font-size: 1.1rem;
        }
        .chip button { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 1rem; font-family: var(--font-body); }
        .chip button:hover { color: var(--red); }

        .inline-input { display: flex; gap: 10px; }
        input[type="text"] {
            flex-grow: 1; background: #070510; border: 2px solid var(--border-color);
            color: #fff; padding: 11px 12px; font-size: 1.1rem; outline: none;
            font-family: var(--font-body);
        }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(168,85,247,0.4); }

        /* --- Lignes de rôles --- */
        .role-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px dashed rgba(168,85,247,0.18);
        }
        .role-row:last-child { border-bottom: none; }
        .role-info { font-size: 1.1rem; flex-grow: 1; padding-right: 10px; }
        .role-name { font-weight: 600; color: var(--text-main); }
        .role-desc { font-size: 0.95rem; color: var(--text-sub); line-height: 1.3; }

        .stepper { display: flex; align-items: center; gap: 8px; }
        .stepper button {
            width: 30px; height: 30px; background: var(--accent-glow);
            border: 2px solid var(--accent); color: #fff; cursor: pointer;
            font-family: var(--font-display); font-size: 0.6rem;
        }
        .stepper button:hover { background: var(--accent); }
        .stepper span { font-family: var(--font-display); font-size: 0.7rem; min-width: 22px; text-align: center; color: var(--moon); }

        .checkbox-row { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; cursor: pointer; }
        .checkbox-row input { accent-color: var(--accent); width: 18px; height: 18px; }

        /* --- Boutons --- */
        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 14px; font-family: var(--font-display); font-size: 0.66rem;
            letter-spacing: 0.04em; cursor: pointer; border: none;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.6);
            transition: transform 0.1s steps(2), box-shadow 0.1s;
            line-height: 1.5; text-align: center;
        }
        .btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 rgba(0,0,0,0.7); }
        .btn-primary { background: var(--accent); color: #fff; text-shadow: 0 0 6px rgba(0,0,0,0.5); }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-ghost { background: rgba(168,85,247,0.10); border: 2px solid var(--accent); color: var(--text-main); }

        /* --- Carte de révélation --- */
        .card-reveal {
            border: 2px dashed var(--accent);
            padding: 26px 18px; text-align: center; margin: 18px 0;
            background: var(--accent-glow);
            box-shadow: inset 0 0 26px rgba(168,85,247,0.15);
        }
        .role-badge {
            font-family: var(--font-display); font-size: 0.95rem;
            color: var(--moon); text-transform: uppercase; margin: 14px 0;
            letter-spacing: 0.04em; line-height: 1.5;
            text-shadow: 0 0 10px rgba(255,225,77,0.6);
        }

        /* --- Listes de sélection --- */
        .select-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
        .select-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.30); border: 2px solid var(--border-color);
            padding: 13px 14px; color: #fff; font-size: 1.1rem; cursor: pointer;
            transition: transform 0.1s steps(2), border-color 0.1s, background 0.1s;
        }
        .select-item:hover { transform: translateX(3px); border-color: var(--accent); }
        .select-item.selected { border-color: var(--moon); background: var(--accent-glow); box-shadow: 0 0 14px rgba(168,85,247,0.3); }
        .select-item.dead { opacity: 0.35; text-decoration: line-through; cursor: not-allowed; }

        .alive-summary { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
        .alive-pill {
            font-size: 1rem; padding: 5px 9px;
            background: rgba(0,0,0,0.30); border: 1px solid var(--border-color);
        }
        .alive-pill.dead { text-decoration: line-through; opacity: 0.30; }

        @media (max-width: 600px) {
            body { background-size: 28px 28px, 28px 28px, 100% 100%, 100% 100%; }
            h1 { font-size: 0.95rem; }
            .btn-back { font-size: 0.5rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <!-- MODIFICATION ICI : On utilise ../ pour remonter directement d'un niveau au dossier parent (le hub) -->
        <a href="../" class="btn-back">&lsaquo; HUB</a>
    </div>

    <main class="container" id="app"></main>

    <script>
        // --- BASE DE DONNÉES DES RÔLES ---
        const ROLES_DEF = {
            loup: { name: "Loup-Garou", team: "loups", icon: "🐺", desc: "Dévore un villageois chaque nuit avec la meute." },
            infect: { name: "Infect Père des Loups", team: "loups", icon: "🩸", desc: "Loup-garou capable d'infecter une victime pour la convertir." },
            loup_blanc: { name: "Loup Blanc", team: "solo", icon: "🐺⚪", desc: "Chasse avec les loups, mais peut éliminer un loup une nuit sur deux." },
            voyante: { name: "Voyante", team: "village", icon: "🔮", desc: "Espionne l'identité réelle d'un joueur chaque nuit." },
            sorciere: { name: "Sorcière", team: "village", icon: "🧪", desc: "Possède une potion de vie et une potion de mort uniques." },
            chasseur: { name: "Chasseur", team: "village", icon: "🏹", desc: "Tire sur un joueur s'il est éliminé." },
            garde: { name: "Garde", team: "village", icon: "🛡️", desc: "Protège un joueur contre les loups chaque nuit." },
            petite_fille: { name: "Petite Fille", team: "village", icon: "👧", desc: "Peut espionner discrètement les loups la nuit." },
            cupidon: { name: "Cupidon", team: "village", icon: "💘", desc: "Désigne deux amoureux la première nuit. Si l'un meurt, l'autre meurt." },
            ange: { name: "Ange", team: "solo", icon: "🪽", desc: "Gagne la partie s'il parvient à être éliminé lors du tout premier vote de jour." },
            villageois: { name: "Simple Villageois", team: "village", icon: "🧑‍🌾", desc: "Ne possède aucun pouvoir particulier. Débat et vote le jour." }
        };

        // --- ÉTAT GLOBAL DE LA PARTIE ---
        let state = {
            screen: "setup", 
            players: ["Joueur 1", "Joueur 2", "Joueur 3", "Joueur 4", "Joueur 5", "Joueur 6"],
            silentMode: false,
            roleCounts: {
                loup: 1, infect: 0, loup_blanc: 0,
                voyante: 1, sorciere: 1, chasseur: 0,
                garde: 0, petite_fille: 0, cupidon: 0, ange: 0
            },
            gamePlayers: [],
            revealIndex: 0,
            revealed: false,
            nightNumber: 1,
            nightStep: 0, 
            nightActions: {},
            witchPotions: { heal: true, death: true },
            lovers: [],
            infectedPlayerId: null,
            hunterPending: null,
            dayDeaths: [],
            selectedTarget: null,
            firstDayVotePassed: false,
            winner: null
        };

        function shuffle(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- LOGIQUE DE CONFIGURATION ---
        function addPlayer() {
            const input = document.getElementById("playerNameInput");
            const name = input ? input.value.trim() : "";
            if (!name) return;
            state.players.push(name);
            render();
        }

        function removePlayer(index) {
            state.players.splice(index, 1);
            render();
        }

        function updateRoleCount(roleKey, delta) {
            state.roleCounts[roleKey] = Math.max(0, (state.roleCounts[roleKey] || 0) + delta);
            render();
        }

        function getSpecialRolesTotal() {
            return Object.values(state.roleCounts).reduce((a, b) => a + b, 0);
        }

        function startDistribution() {
            const totalSpecial = getSpecialRolesTotal();
            if (state.players.length < 4) {
                alert("Il faut au minimum 4 joueurs pour démarrer.");
                return;
            }
            if (totalSpecial > state.players.length) {
                alert("Vous avez configuré plus de rôles spéciaux que de joueurs.");
                return;
            }

            let deck = [];
            for (const [role, count] of Object.entries(state.roleCounts)) {
                for (let i = 0; i < count; i++) deck.push(role);
            }
            while (deck.length < state.players.length) {
                deck.push("villageois");
            }
            deck = shuffle(deck);

            state.gamePlayers = state.players.map((name, index) => ({
                id: index,
                name: name,
                role: deck[index],
                alive: true,
                isLover: false,
                isInfected: false
            }));

            state.revealIndex = 0;
            state.revealed = false;
            state.nightNumber = 1;
            state.witchPotions = { heal: true, death: true };
            state.lovers = [];
            state.infectedPlayerId = null;
            state.firstDayVotePassed = false;
            state.screen = "reveal";
            render();
        }

        // --- CYCLE DES PHASES DE NUIT ---
        function getNightSteps() {
            const steps = [];
            const hasAlive = (role) => state.gamePlayers.some(p => p.role === role && p.alive);

            if (state.nightNumber === 1 && hasAlive("cupidon")) steps.push("cupidon");
            if (hasAlive("garde")) steps.push("garde");
            if (hasAlive("voyante")) steps.push("voyante");
            
            const wolvesAlive = state.gamePlayers.some(p => (p.role === "loup" || p.role === "infect" || p.role === "loup_blanc" || p.isInfected) && p.alive);
            if (wolvesAlive) steps.push("loups");

            if (hasAlive("infect") && !state.infectedPlayerId) steps.push("infect");
            if (hasAlive("loup_blanc") && state.nightNumber % 2 === 0) steps.push("loup_blanc");
            if (hasAlive("sorciere") && (state.witchPotions.heal || state.witchPotions.death)) steps.push("sorciere");

            return steps;
        }

        function nextNightStep() {
            const steps = getNightSteps();
            state.nightStep++;
            state.selectedTarget = null;

            if (state.nightStep >= steps.length) {
                resolveNight();
            } else {
                render();
            }
        }

        function resolveNight() {
            let deaths = [];
            const wolfVictimId = state.nightActions.wolfVictim;
            const protectedId = state.nightActions.protected;
            const witchKillId = state.nightActions.witchKill;
            const witchSave = state.nightActions.witchSaved;
            const whiteKillId = state.nightActions.whiteKill;
            const infectedId = state.nightActions.infected;

            // Attaque des loups
            if (wolfVictimId !== undefined && wolfVictimId !== null) {
                if (wolfVictimId !== protectedId && !witchSave) {
                    if (infectedId === wolfVictimId) {
                        const victim = state.gamePlayers.find(p => p.id === wolfVictimId);
                        if (victim) {
                            victim.isInfected = true;
                            state.infectedPlayerId = victim.id;
                        }
                    } else {
                        deaths.push(wolfVictimId);
                    }
                }
            }

            // Attaque Loup Blanc
            if (whiteKillId !== undefined && whiteKillId !== null) {
                if (!deaths.includes(whiteKillId) && whiteKillId !== protectedId) {
                    deaths.push(whiteKillId);
                }
            }

            // Potion de mort de la sorcière
            if (witchKillId !== undefined && witchKillId !== null) {
                if (!deaths.includes(witchKillId)) {
                    deaths.push(witchKillId);
                }
            }

            state.dayDeaths = [];
            deaths.forEach(id => killPlayer(id, "nuit"));

            state.screen = "day";
            checkGameEnd();
            render();
        }

        function killPlayer(id, cause) {
            const p = state.gamePlayers.find(pl => pl.id === id);
            if (!p || !p.alive) return;
            p.alive = false;
            state.dayDeaths.push({ player: p, cause: cause });

            if (p.isLover) {
                const otherLover = state.gamePlayers.find(pl => pl.isLover && pl.id !== p.id && pl.alive);
                if (otherLover) {
                    otherLover.alive = false;
                    state.dayDeaths.push({ player: otherLover, cause: "chagrin" });
                }
            }

            if (p.role === "chasseur") {
                state.hunterPending = p;
            }
        }

        function checkGameEnd() {
            const alive = state.gamePlayers.filter(p => p.alive);
            const wolves = alive.filter(p => p.role === "loup" || p.role === "infect" || p.role === "loup_blanc" || p.isInfected);
            const villagers = alive.filter(p => !wolves.includes(p));

            if (alive.length === 2 && alive[0].isLover && alive[1].isLover) {
                state.winner = "Amoureux";
                state.screen = "end";
                return true;
            }
            if (wolves.length === 0) {
                state.winner = "Village";
                state.screen = "end";
                return true;
            }
            if (wolves.length >= villagers.length) {
                if (wolves.length === 1 && wolves[0].role === "loup_blanc" && villagers.length === 0) {
                    state.winner = "Loup Blanc";
                } else {
                    state.winner = "Loups-Garous";
                }
                state.screen = "end";
                return true;
            }
            return false;
        }

        // --- RENDU PRINCIPAL ---
        function render() {
            const app = document.getElementById("app");
            if (state.screen === "setup") app.innerHTML = renderSetup();
            else if (state.screen === "reveal") app.innerHTML = renderReveal();
            else if (state.screen === "night") app.innerHTML = renderNight();
            else if (state.screen === "day") app.innerHTML = renderDay();
            else if (state.screen === "vote") app.innerHTML = renderVote();
            else if (state.screen === "hunter") app.innerHTML = renderHunter();
            else if (state.screen === "end") app.innerHTML = renderEnd();
        }

        function renderSetup() {
            const totalSpecial = getSpecialRolesTotal();
            const totalPlayers = state.players.length;
            const simpleVillagers = Math.max(0, totalPlayers - totalSpecial);

            let chipsHtml = state.players.map((p, i) => `
                <div class="chip">
                    <span>${p}</span>
                    <button onclick="removePlayer(${i})">✕</button>
                </div>
            `).join("");

            let rolesHtml = Object.entries(ROLES_DEF).filter(([k]) => k !== "villageois").map(([key, r]) => `
                <div class="role-row">
                    <div class="role-info">
                        <div class="role-name">${r.icon} ${r.name}</div>
                        <div class="role-desc">${r.desc}</div>
                    </div>
                    <div class="stepper">
                        <button onclick="updateRoleCount('${key}', -1)">−</button>
                        <span>${state.roleCounts[key] || 0}</span>
                        <button onclick="updateRoleCount('${key}', 1)">+</button>
                    </div>
                </div>
            `).join("");

            return `
                <h1>🐺 Loup-Garou</h1>
                <p class="phase-subtitle">Paramétrez les participants et les rôles du village</p>
                
                <div class="panel">
                    <h2>Joueurs (${totalPlayers})</h2>
                    <div class="chips">${chipsHtml}</div>
                    <div class="inline-input">
                        <input type="text" id="playerNameInput" placeholder="Nom du joueur" onkeydown="if(event.key==='Enter') addPlayer()">
                        <button class="btn btn-ghost" style="width:auto; padding:0 16px;" onclick="addPlayer()">+</button>
                    </div>
                </div>

                <div class="panel">
                    <h2>Rôles & Pouvoirs (${totalSpecial} spéciaux + ${simpleVillagers} villageois)</h2>
                    ${rolesHtml}
                </div>

                <div class="panel">
                    <label class="checkbox-row">
                        <input type="checkbox" ${state.silentMode ? "checked" : ""} onchange="state.silentMode = this.checked">
                        <span>Partie non narrée (Mode silencieux / MJ physique)</span>
                    </label>
                </div>

                <button class="btn btn-primary" onclick="startDistribution()">Distribuer les rôles ›</button>
            `;
        }

        function renderReveal() {
            const p = state.gamePlayers[state.revealIndex];
            const role = ROLES_DEF[p.role];
            
            let alliesHtml = "";
            if (role.team === "loups") {
                const allies = state.gamePlayers.filter(pl => pl.id !== p.id && (pl.role === "loup" || pl.role === "infect"));
                if (allies.length > 0) {
                    alliesHtml = `<p style="font-size:1rem; margin-top:10px; color:var(--red);">Vos alliés loups : ${allies.map(a => a.name).join(", ")}</p>`;
                }
            }

            if (!state.revealed) {
                return `
                    <h1>Transmission du rôle</h1>
                    <p class="phase-subtitle">Joueur ${state.revealIndex + 1} / ${state.gamePlayers.length}</p>
                    <div class="card-reveal">
                        <p style="color:var(--text-sub);">Donnez le téléphone à</p>
                        <h2 style="font-size:1.4rem; margin:10px 0; color:var(--text-main);">${p.name}</h2>
                        <button class="btn btn-primary" style="margin-top:16px;" onclick="state.revealed=true; render();">👁️ Révéler mon rôle</button>
                    </div>
                `;
            }

            return `
                <h1>Votre Rôle Secret</h1>
                <p class="phase-subtitle">${p.name}</p>
                <div class="card-reveal">
                    <div style="font-size:3rem;">${role.icon}</div>
                    <div class="role-badge">${role.name}</div>
                    <p style="font-size:1.1rem; color:var(--text-sub); line-height:1.4;">${role.desc}</p>
                    ${alliesHtml}
                </div>
                <button class="btn btn-ghost" onclick="
                    if (state.revealIndex + 1 < state.gamePlayers.length) {
                        state.revealIndex++; state.revealed = false; render();
                    } else {
                        state.screen = 'night'; state.nightStep = 0; state.nightActions = {}; render();
                    }
                ">Cacher et passer au joueur suivant ›</button>
            `;
        }

        function renderNight() {
            const steps = getNightSteps();
            const currentStep = steps[state.nightStep];
            const alivePlayers = state.gamePlayers.filter(p => p.alive);

            let contentHtml = "";

            if (currentStep === "cupidon") {
                contentHtml = `
                    <h2>💘 Réveil de Cupidon</h2>
                    <p class="phase-subtitle">Désignez deux joueurs pour former le couple d'amoureux.</p>
                    <div class="select-list">
                        ${alivePlayers.map(p => `
                            <div class="select-item ${(state.lovers.includes(p.id)) ? 'selected' : ''}" onclick="
                                if (state.lovers.includes(${p.id})) {
                                    state.lovers = state.lovers.filter(id => id !== ${p.id});
                                } else if (state.lovers.length < 2) {
                                    state.lovers.push(${p.id});
                                }
                                render();
                            ">
                                <span>${p.name}</span>
                                <span>${state.lovers.includes(p.id) ? '❤️' : ''}</span>
                            </div>
                        `).join("")}
                    </div>
                    <button class="btn btn-primary" ${state.lovers.length === 2 ? "" : "disabled"} onclick="
                        state.gamePlayers.forEach(p => p.isLover = state.lovers.includes(p.id));
                        nextNightStep();
                    ">Valider les amoureux ›</button>
                `;
            } else if (currentStep === "garde") {
                contentHtml = `
                    <h2>🛡️ Réveil du Garde</h2>
                    <p class="phase-subtitle">Choisissez un joueur à protéger cette nuit contre les attaques.</p>
                    <div class="select-list">
                        ${alivePlayers.map(p => `
                            <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                                <span>${p.name}</span>
                            </div>
                        `).join("")}
                    </div>
                    <button class="btn btn-primary" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                        state.nightActions.protected = state.selectedTarget;
                        nextNightStep();
                    ">Protéger ce joueur ›</button>
                `;
            } else if (currentStep === "voyante") {
                const target = state.gamePlayers.find(p => p.id === state.selectedTarget);
                contentHtml = `
                    <h2>🔮 Réveil de la Voyante</h2>
                    <p class="phase-subtitle">Espionnez la carte d'un joueur en vie.</p>
                    <div class="select-list">
                        ${alivePlayers.filter(p => p.role !== "voyante").map(p => `
                            <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                                <span>${p.name}</span>
                                <span>${state.selectedTarget === p.id ? ROLES_DEF[p.role].icon + ' ' + ROLES_DEF[p.role].name : '❓'}</span>
                            </div>
                        `).join("")}
                    </div>
                    <button class="btn btn-primary" ${state.selectedTarget !== null ? "" : "disabled"} onclick="nextNightStep()">J'ai vu l'identité ›</button>
                `;
            } else if (currentStep === "loups") {
                contentHtml = `
                    <h2>🐺 Attaque de la Meute</h2>
                    <p class="phase-subtitle">Les loups-garous désignent une victime commune.</p>
                    <div class="select-list">
                        ${alivePlayers.map(p => `
                            <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                                <span>${p.name}</span>
                            </div>
                        `).join("")}
                    </div>
                    <button class="btn btn-danger" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                        state.nightActions.wolfVictim = state.selectedTarget;
                        nextNightStep();
                    ">Désigner la victime ›</button>
                `;
            } else if (currentStep === "infect") {
                contentHtml = `
                    <h2>🩸 Infect Père des Loups</h2>
                    <p class="phase-subtitle">Voulez-vous infecter la victime des loups pour la convertir à votre cause ?</p>
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <button class="btn btn-danger" onclick="
                            state.nightActions.infected = state.nightActions.wolfVictim;
                            nextNightStep();
                        ">Infecter la victime</button>
                        <button class="btn btn-ghost" onclick="nextNightStep()">Ne pas infecter</button>
                    </div>
                `;
            } else if (currentStep === "loup_blanc") {
                contentHtml = `
                    <h2>🐺⚪ Loup Blanc</h2>
                    <p class="phase-subtitle">Vous pouvez dévorer un autre loup-garou cette nuit.</p>
                    <div class="select-list">
                        ${alivePlayers.filter(p => (p.role === "loup" || p.role === "infect" || p.isInfected) && p.role !== "loup_blanc").map(p => `
                            <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                                <span>${p.name} (${ROLES_DEF[p.role].name})</span>
                            </div>
                        `).join("")}
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-danger" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                            state.nightActions.whiteKill = state.selectedTarget;
                            nextNightStep();
                        ">Éliminer</button>
                        <button class="btn btn-ghost" onclick="nextNightStep()">Passer mon tour</button>
                    </div>
                `;
            } else if (currentStep === "sorciere") {
                
                const victim = state.gamePlayers.find(p => p.id === state.nightActions.wolfVictim);
                
                contentHtml = `
                    <h2>🧪 Réveil de la Sorcière</h2>
                    <p class="phase-subtitle">Ouvrez les yeux et constatez les dégâts...</p>
                    
                    <div style="background: rgba(255, 59, 92, 0.15); border: 2px solid var(--red); padding: 16px; margin-bottom: 20px; text-align: center;">
                        <p style="color: var(--text-sub); font-size: 1rem; margin-bottom: 8px;">Cette nuit, les loups-garous ont attaqué :</p>
                        <p style="font-size: 1.5rem; font-weight: bold; color: var(--red); margin: 0;">${victim ? victim.name : "Personne"}</p>
                    </div>
                    
                    ${state.witchPotions.heal && victim ? `
                        <button class="btn" style="background: var(--green); color: #06210f; margin-bottom:20px;" onclick="
                            state.nightActions.witchSaved = true;
                            state.witchPotions.heal = false;
                            render();
                        ">💚 Sauver ${victim.name} avec la potion de vie</button>
                    ` : ""}

                    ${state.witchPotions.death ? `
                        <div class="select-list">
                            <p style="font-size:1rem; color:var(--text-sub); margin-bottom: 8px;">Voulez-vous utiliser votre potion de mort sur un autre joueur ?</p>
                            ${alivePlayers.map(p => `
                                <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                                    <span>${p.name}</span>
                                </div>
                            `).join("")}
                        </div>
                    ` : ""}

                    <button class="btn btn-primary" style="margin-top: 16px;" onclick="
                        if (state.selectedTarget !== null && state.witchPotions.death) {
                            state.nightActions.witchKill = state.selectedTarget;
                            state.witchPotions.death = false;
                        }
                        nextNightStep();
                    ">Terminer le tour de la sorcière ›</button>
                `;
            }

            return `
                <h1>🌙 Nuit ${state.nightNumber}</h1>
                <div class="panel">${contentHtml}</div>
            `;
        }

        function renderDay() {
            let summaryDeaths = "";
            if (state.dayDeaths.length === 0) {
                summaryDeaths = "<p style='color:var(--green); font-weight:bold; margin:14px 0; text-align:center;'>Le village se réveille... et personne n'est mort cette nuit ! 🎉</p>";
            } else {
                summaryDeaths = `
                    <div style="margin:14px 0;">
                        <p style="color:var(--red); font-weight:bold; margin-bottom:8px;">Victimes constatées ce matin :</p>
                        ${state.dayDeaths.map(d => `
                            <div class="select-item dead" style="margin-bottom:6px;">
                                <span>${d.player.name} (${ROLES_DEF[d.player.role].name})</span>
                                <span style="font-size:0.9rem; text-transform:uppercase; color:var(--red);">${d.cause}</span>
                            </div>
                        `).join("")}
                    </div>
                `;
            }

            const aliveHtml = state.gamePlayers.map(p => `
                <div class="alive-pill ${p.alive ? '' : 'dead'}">${p.name}</div>
            `).join("");

            return `
                <h1>☀️ Village de Jour</h1>
                <p class="phase-subtitle">Cycle du Jour ${state.nightNumber}</p>
                <div class="panel">
                    ${summaryDeaths}
                    <div class="alive-summary">${aliveHtml}</div>
                </div>
                <button class="btn btn-primary" onclick="
                    if (state.hunterPending) {
                        state.screen = 'hunter';
                    } else {
                        state.screen = 'vote';
                    }
                    state.selectedTarget = null;
                    render();
                ">Passer au vote du village ›</button>
            `;
        }

        function renderVote() {
            const alive = state.gamePlayers.filter(p => p.alive);

            return `
                <h1>⚖️ Vote du Village</h1>
                <p class="phase-subtitle">Débattez et désignez l'accusé à condamner au bûcher.</p>
                <div class="select-list">
                    ${alive.map(p => `
                        <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                            <span>${p.name}</span>
                            <span>${state.selectedTarget === p.id ? '🔥 Accusé' : ''}</span>
                        </div>
                    `).join("")}
                </div>
                <button class="btn btn-danger" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                    const condemned = state.gamePlayers.find(p => p.id === state.selectedTarget);
                    
                    if (!state.firstDayVotePassed && condemned.role === 'ange') {
                        state.winner = 'Ange';
                        state.screen = 'end';
                        render();
                        return;
                    }
                    state.firstDayVotePassed = true;
                    killPlayer(condemned.id, 'tribunal');

                    if (state.hunterPending) {
                        state.screen = 'hunter';
                    } else if (!checkGameEnd()) {
                        state.nightNumber++;
                        state.nightStep = 0;
                        state.nightActions = {};
                        state.screen = 'night';
                    }
                    render();
                ">Exécuter le joueur condamné</button>
            `;
        }

        function renderHunter() {
            const alive = state.gamePlayers.filter(p => p.alive);
            const hunter = state.hunterPending;

            return `
                <h1>🏹 Dernier Tir du Chasseur</h1>
                <p class="phase-subtitle">${hunter.name} emporte une cible dans sa tombe avant de mourir.</p>
                <div class="select-list">
                    ${alive.map(p => `
                        <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                            <span>${p.name}</span>
                        </div>
                    `).join("")}
                </div>
                <button class="btn btn-danger" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                    const target = state.gamePlayers.find(p => p.id === state.selectedTarget);
                    state.hunterPending = null;
                    killPlayer(target.id, 'balle de chasseur');
                    if (!checkGameEnd()) {
                        if (state.screen === 'day') state.screen = 'vote';
                        else {
                            state.nightNumber++;
                            state.nightStep = 0;
                            state.nightActions = {};
                            state.screen = 'night';
                        }
                    }
                    render();
                ">Tirer sur cette cible ›</button>
            `;
        }

        function renderEnd() {
            return `
                <h1>🏆 Fin de Partie</h1>
                <div class="card-reveal" style="margin:20px 0;">
                    <div style="font-size:3rem;">🎉</div>
                    <div class="role-badge">${state.winner} l'emporte !</div>
                </div>
                <div class="panel">
                    <h2>Tableau récapitulatif</h2>
                    ${state.gamePlayers.map(p => `
                        <div class="select-item ${p.alive ? '' : 'dead'}" style="margin-bottom:6px;">
                            <span>${p.name}</span>
                            <span>${ROLES_DEF[p.role].icon} ${ROLES_DEF[p.role].name} ${p.isInfected ? '(Infecté)' : ''} ${p.isLover ? '❤️' : ''}</span>
                        </div>
                    `).join("")}
                </div>
                <button class="btn btn-primary" onclick="state.screen='setup'; render();">Nouvelle partie ⟳</button>
            `;
        }

        render();
    </script>
</body>
</html>
