<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>UNO • Jeux2Soirée</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
    --bg:#08090d;
    --panel:#11131a;
    --panel2:#171a23;
    --white:#fff;
    --red:#ed1740;
    --yellow:#ffd814;
    --green:#5aaa23;
    --blue:#0874c9;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
}

body{
    color:white;
    font-family:'VT323',monospace;
    overflow-x:hidden;
    overscroll-behavior:none;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:24px 24px;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:99999;

    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.018) 0px,
        rgba(255,255,255,.018) 1px,
        transparent 2px,
        transparent 5px
    );
}

button,input{
    font-family:inherit;
}

button{
    touch-action:manipulation;
}

.hidden{
    display:none!important;
}


/* =========================================================
   ACCUEIL
========================================================= */

#home{
    min-height:100vh;
    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:18px;
}

.home-box{
    width:min(680px,100%);

    background:var(--panel);

    border:3px solid white;

    padding:32px;

    text-align:center;

    box-shadow:7px 7px 0 #000;
}

.logo{
    font-family:'Press Start 2P';

    font-size:clamp(32px,9vw,65px);

    text-shadow:4px 4px 0 #000;

    margin-bottom:15px;
}

.logo span{
    color:#ed1740;
}

.subtitle{
    font-size:28px;

    margin-bottom:28px;
}

.menu{
    display:grid;
    gap:12px;
}

.main-btn{
    width:100%;

    min-height:62px;

    background:#171a23;
    color:white;

    border:3px solid white;

    font-size:24px;

    padding:14px;

    box-shadow:5px 5px 0 #000;

    cursor:pointer;
}

.main-btn:active{
    transform:translate(2px,2px);
    box-shadow:2px 2px 0 #000;
}

.main-btn.create{
    background:#ed1740;
}

.form-box{
    display:grid;
    gap:10px;

    margin-top:20px;
}

input{
    width:100%;

    min-height:58px;

    border:3px solid white;

    background:#080a0f;

    color:white;

    font-size:24px;

    text-align:center;

    outline:none;

    padding:10px;
}

input:focus{
    border-color:#ffd814;
}

#message{
    min-height:28px;

    margin:14px 0 4px;

    font-size:22px;

    color:#ffd814;
}

.small{
    font-size:20px;
    opacity:.75;
}


/* =========================================================
   APP
========================================================= */

#app{
    min-height:100vh;
    min-height:100dvh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:500;

    min-height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:
        8px
        max(12px,env(safe-area-inset-right))
        8px
        max(12px,env(safe-area-inset-left));

    background:#101219;

    border-bottom:3px solid white;
}

.top-title{
    font-family:'Press Start 2P';
    font-size:18px;
}

.room-code{
    border:2px solid white;

    padding:7px 10px;

    font-size:20px;

    white-space:nowrap;
}

#gameArea{
    width:100%;
    max-width:1250px;

    margin:auto;

    padding:
        18px
        max(16px,env(safe-area-inset-right))
        30px
        max(16px,env(safe-area-inset-left));
}


/* =========================================================
   LOBBY
========================================================= */

#lobby{
    max-width:800px;
    margin:auto;
    text-align:center;
}

.big-room{
    font-family:'Press Start 2P';

    color:#ed1740;

    font-size:clamp(38px,12vw,85px);

    margin:30px 0 15px;

    text-shadow:
        5px 5px 0 #000,
        0 0 25px rgba(237,23,64,.5);
}

.lobby-players{
    display:grid;
    gap:8px;

    margin:25px 0;
}

.lobby-player{
    background:var(--panel2);

    border:2px solid #555;

    padding:12px;

    font-size:24px;
}

.lobby-player.host{
    border-color:#ffd814;
}

.start-btn{
    min-height:58px;

    border:3px solid white;

    background:white;
    color:#111;

    font-size:23px;

    padding:12px 22px;

    box-shadow:5px 5px 0 #000;

    cursor:pointer;
}

.start-btn:active{
    transform:translate(2px,2px);
    box-shadow:2px 2px 0 #000;
}


/* =========================================================
   TV
========================================================= */

#tvMode{
    min-height:calc(100vh - 100px);

    display:flex;
    flex-direction:column;
}

.players{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:10px;

    margin-bottom:12px;
}

.player-box{
    min-width:120px;

    padding:9px 15px;

    background:var(--panel);

    border:2px solid #555;

    text-align:center;
}

.player-box.active{
    border-color:white;

    box-shadow:
        0 0 18px rgba(255,255,255,.5);

    transform:translateY(-3px);
}

.player-name{
    font-size:23px;
}

.card-count{
    font-size:19px;
    opacity:.7;
}

.status{
    text-align:center;

    font-size:30px;

    margin:10px;
}

.table{
    flex:1;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:70px;

    min-height:400px;
}

.deck-zone{
    text-align:center;
}

.zone-title{
    font-size:24px;

    margin-bottom:10px;
}

.deck{
    width:125px;
    height:178px;

    border:4px solid white;
    border-radius:15px;

    background:
        repeating-linear-gradient(
            45deg,
            #17191e 0,
            #17191e 8px,
            #252831 8px,
            #252831 16px
        );

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:6px 6px 0 #000;
}

.deck::after{
    content:"UNO";

    font-family:'Press Start 2P';

    font-size:20px;

    background:#ed1740;

    border:2px solid white;

    padding:8px;

    transform:rotate(-18deg);

    box-shadow:3px 3px 0 #000;
}

.tv-discard-card{
    width:125px!important;
    height:178px!important;
}

.tv-actions{
    text-align:center;
    padding:15px;
}


/* =========================================================
   VRAIES CARTES
========================================================= */

.card{
    position:relative;

    flex:0 0 auto;

    width:85px;
    height:140px;

    border-radius:9px;

    overflow:hidden;

    background:#fff;

    box-shadow:4px 4px 0 rgba(0,0,0,.45);

    cursor:pointer;

    user-select:none;

    transition:
        transform .15s,
        box-shadow .15s,
        filter .15s;
}

.card img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}

.card.playable{
    box-shadow:
        0 0 0 3px white,
        0 0 18px 5px rgba(255,255,255,.8),
        4px 4px 0 rgba(0,0,0,.45);

    animation:cardGlow 1.3s infinite;
}

@keyframes cardGlow{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

.card.not-playable{
    opacity:.58;
    filter:saturate(.65);
}

.card:active{
    transform:translateY(-12px) scale(1.03);
    animation:none;
}


/* =========================================================
   MAIN JOUEUR
========================================================= */

#playerMode{
    width:100%;
    max-width:1100px;

    margin:auto;
}

.player-info{
    text-align:center;

    margin-bottom:8px;
}

.player-turn{
    font-family:'Press Start 2P';

    font-size:clamp(14px,3.5vw,22px);

    line-height:1.5;

    min-height:34px;
}

.player-turn.my-turn{
    color:#ffd814;

    text-shadow:
        0 0 14px rgba(255,216,20,.8);
}

.player-turn.other-turn{
    opacity:.75;
}

#currentColor{
    font-size:21px;
}


/* =========================================================
   TABLE MOBILE
========================================================= */

.mobile-table{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:28px;

    margin:6px 0 12px;
}

.mobile-zone{
    text-align:center;
}

.mobile-zone-title{
    font-size:19px;

    margin-bottom:5px;

    opacity:.75;
}

.mobile-card{
    width:75px!important;
    height:110px!important;

    cursor:default;
}

.mobile-card:active{
    transform:none;
}


/* =========================================================
   MAIN
========================================================= */

.hand-title{
    display:flex;

    align-items:center;
    justify-content:space-between;

    font-size:23px;

    margin:7px 0 5px;
}

.hand-count{
    font-size:19px;
    opacity:.65;
}

.hand-wrapper{
    width:100%;

    overflow-x:auto;
    overflow-y:hidden;

    padding:
        10px 5px 18px;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior-x:contain;

    scrollbar-width:thin;
}

.hand-wrapper::-webkit-scrollbar{
    height:7px;
}

.hand-wrapper::-webkit-scrollbar-track{
    background:#11141b;
}

.hand-wrapper::-webkit-scrollbar-thumb{
    background:#555;
    border-radius:10px;
}

.my-hand{
    display:flex;

    align-items:flex-end;

    justify-content:flex-start;

    gap:8px;

    width:max-content;

    min-width:100%;

    padding:5px 8px 8px;
}

.hand-card{
    width:82px;
    height:135px;
}

.hand-card:active{
    transform:translateY(-15px) scale(1.04);
}


/* =========================================================
   CONTROLES
========================================================= */

.controls{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin:5px 0 8px;
}

.action-btn{
    min-height:62px;

    border:3px solid white;

    background:#171a23;
    color:white;

    font-size:24px;

    box-shadow:4px 4px 0 #000;

    cursor:pointer;
}

.action-btn.uno{
    background:#ed1740;
}

.action-btn:active:not(:disabled){
    transform:translate(2px,2px);
    box-shadow:1px 1px 0 #000;
}

.action-btn:disabled{
    opacity:.3;
    cursor:not-allowed;
}

.mobile-help{
    text-align:center;

    font-size:18px;

    opacity:.65;
}


/* =========================================================
   MODAL COULEUR
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:10000;

    background:rgba(0,0,0,.88);

    display:flex;

    justify-content:center;
    align-items:center;

    padding:15px;
}

.modal-box{
    width:min(500px,100%);

    background:#101219;

    border:3px solid white;

    padding:25px;

    text-align:center;

    box-shadow:7px 7px 0 #000;
}

.modal-box h2{
    font-family:'Press Start 2P';

    font-size:clamp(16px,4vw,23px);

    line-height:1.5;

    margin:0 0 22px;
}

.color-buttons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:11px;
}

.color-btn{
    min-height:72px;

    border:3px solid white;

    font-size:23px;

    font-weight:bold;

    box-shadow:4px 4px 0 #000;
}

.color-btn:active{
    transform:translate(2px,2px);
    box-shadow:1px 1px 0 #000;
}

.red-btn{
    background:var(--red);
    color:white;
}

.yellow-btn{
    background:var(--yellow);
    color:#111;
}

.green-btn{
    background:var(--green);
    color:white;
}

.blue-btn{
    background:var(--blue);
    color:white;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    #home{
        padding:10px;
    }

    .home-box{
        padding:24px 16px;

        box-shadow:5px 5px 0 #000;
    }

    .subtitle{
        font-size:23px;
    }

    .main-btn{
        font-size:21px;
    }

    .topbar{
        min-height:54px;
    }

    .top-title{
        font-size:13px;
    }

    .room-code{
        font-size:16px;
        padding:6px 8px;
    }

    #gameArea{
        padding:
            8px
            max(9px,env(safe-area-inset-right))
            18px
            max(9px,env(safe-area-inset-left));
    }

    .player-turn{
        font-size:14px;
    }

    #currentColor{
        font-size:18px;
    }

    .mobile-table{
        gap:18px;
    }

    .mobile-card{
        width:70px!important;
        height:103px!important;
    }

    .hand-title{
        font-size:20px;
    }

    .my-hand{
        gap:7px;
    }

    .hand-card{
        width:70px;
        height:115px;
    }

    .controls{
        position:sticky;

        bottom:0;

        z-index:100;

        padding:
            10px 0
            max(5px,env(safe-area-inset-bottom));

        background:
            linear-gradient(
                to bottom,
                transparent,
                #08090d 20%
            );
    }

    .action-btn{
        min-height:58px;
        font-size:21px;
    }

    .mobile-help{
        font-size:16px;
    }

    .color-btn{
        min-height:68px;
        font-size:20px;
    }
}


/* =========================================================
   PETIT TELEPHONE
========================================================= */

@media(max-width:380px){

    .hand-card{
        width:62px;
        height:103px;
    }

    .action-btn{
        font-size:19px;
    }

}


/* =========================================================
   PAYSAGE MOBILE
========================================================= */

@media(max-height:520px) and (orientation:landscape){

    .topbar{
        min-height:48px;
    }

    #gameArea{
        padding-top:5px;
    }

    .player-info{
        margin-bottom:0;
    }

    .mobile-table{
        margin:2px 0;
    }

    .mobile-card{
        width:58px!important;
        height:85px!important;
    }

    .hand-wrapper{
        padding-bottom:7px;
    }

    .hand-card{
        width:58px;
        height:96px;
    }

    .action-btn{
        min-height:45px;
    }

}

</style>
</head>


<body>


<!-- ========================================================
     ACCUEIL
========================================================= -->

<section id="home">

    <div class="home-box">

        <div class="logo">
            <span>UNO</span>
        </div>

        <div class="subtitle">
            Jeux2Soirée • Multijoueur
        </div>

        <div class="menu">

            <button
                class="main-btn create"
                onclick="createRoom()"
            >
                🖥️ CRÉER UN SALON
            </button>

            <button
                class="main-btn"
                onclick="showJoin()"
            >
                📱 REJOINDRE UN SALON
            </button>

        </div>

        <div
            id="joinForm"
            class="form-box hidden"
        >

            <input
                id="roomInput"
                maxlength="6"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="CODE DU SALON"
            >

            <input
                id="nameInput"
                maxlength="18"
                autocomplete="off"
                placeholder="TON PRÉNOM"
            >

            <button
                class="main-btn create"
                onclick="joinRoom()"
            >
                REJOINDRE
            </button>

        </div>

        <div id="message"></div>

        <div class="small">
            2 à 10 joueurs
        </div>

    </div>

</section>



<!-- ========================================================
     APPLICATION
========================================================= -->

<section
    id="app"
    class="hidden"
>

    <header class="topbar">

        <div class="top-title">
            UNO
        </div>

        <div class="room-code">
            SALON :
            <strong id="roomCodeDisplay">
                ----
            </strong>
        </div>

    </header>


    <main id="gameArea">


        <!-- =================================================
             LOBBY
        ================================================== -->

        <section id="lobby">

            <div
                class="big-room"
                id="lobbyCode"
            >
                ----
            </div>

            <div class="small">
                Donnez ce code aux autres joueurs
            </div>

            <div
                class="lobby-players"
                id="lobbyPlayers"
            ></div>

            <div id="hostControls">

                <button
                    class="start-btn"
                    onclick="startGame()"
                >
                    ▶ COMMENCER LA PARTIE
                </button>

            </div>

        </section>



        <!-- =================================================
             TV
        ================================================== -->

        <section
            id="tvMode"
            class="hidden"
        >

            <div
                class="players"
                id="tvPlayers"
            ></div>

            <div
                class="status"
                id="tvStatus"
            >
                En attente...
            </div>

            <div class="table">

                <div class="deck-zone">

                    <div class="zone-title">
                        PIOCHE
                    </div>

                    <div class="deck"></div>

                </div>

                <div class="deck-zone">

                    <div class="zone-title">
                        DÉFAUSSE
                    </div>

                    <div id="tvDiscard"></div>

                </div>

            </div>

            <div class="tv-actions">

                <button
                    class="start-btn hidden"
                    id="newGameBtn"
                    onclick="newGame()"
                >
                    🔄 NOUVELLE MANCHE
                </button>

            </div>

        </section>



        <!-- =================================================
             JOUEUR
        ================================================== -->

        <section
            id="playerMode"
            class="hidden"
        >

            <div class="player-info">

                <div
                    class="player-turn"
                    id="playerTurn"
                >
                    EN ATTENTE
                </div>

                <div id="currentColor"></div>

            </div>


            <div class="mobile-table">

                <div class="mobile-zone">

                    <div class="mobile-zone-title">
                        PIOCHE
                    </div>

                    <div class="deck mobile-card"></div>

                </div>


                <div class="mobile-zone">

                    <div class="mobile-zone-title">
                        DÉFAUSSE
                    </div>

                    <div id="mobileDiscard"></div>

                </div>

            </div>


            <div class="hand-title">

                <span>
                    🎴 TA MAIN
                </span>

                <span
                    class="hand-count"
                    id="handCount"
                >
                    0 carte
                </span>

            </div>


            <div class="hand-wrapper">

                <div
                    class="my-hand"
                    id="myHand"
                ></div>

            </div>


            <div class="controls">

                <button
                    class="action-btn"
                    id="drawBtn"
                    onclick="drawCard()"
                >
                    🃏 PIOCHER
                </button>

                <button
                    class="action-btn uno"
                    id="unoBtn"
                    onclick="callUno()"
                >
                    UNO !
                </button>

            </div>


            <div class="mobile-help">
                👆 Fais glisser ta main pour voir toutes tes cartes
            </div>

        </section>

    </main>

</section>



<!-- ========================================================
     CHOIX COULEUR
========================================================= -->

<div
    class="modal hidden"
    id="colorModal"
>

    <div class="modal-box">

        <h2>
            CHOISIS UNE COULEUR
        </h2>

        <div class="color-buttons">

            <button
                class="color-btn red-btn"
                onclick="chooseColor('red')"
            >
                🔴 ROUGE
            </button>

            <button
                class="color-btn yellow-btn"
                onclick="chooseColor('yellow')"
            >
                🟡 JAUNE
            </button>

            <button
                class="color-btn green-btn"
                onclick="chooseColor('green')"
            >
                🟢 VERT
            </button>

            <button
                class="color-btn blue-btn"
                onclick="chooseColor('blue')"
            >
                🔵 BLEU
            </button>

        </div>

    </div>

</div>



<script>

/* =========================================================
   SERVEUR
========================================================= */

const SERVER_URL =
    "wss://uno-jeux2soiree.onrender.com";


/* =========================================================
   VARIABLES
========================================================= */

let socket = null;

let mode = null;

let room = null;

let playerName = null;

let playerId = null;

let gameState = null;

let pendingCardIndex = null;


/* =========================================================
   ELEMENT
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){
    $("message").textContent = text;
}


/* =========================================================
   CREER SALON
========================================================= */

function createRoom(){

    mode = "tv";

    connect();

}


/* =========================================================
   AFFICHER REJOINDRE
========================================================= */

function showJoin(){

    $("joinForm")
        .classList
        .remove("hidden");

    setTimeout(
        () => $("roomInput").focus(),
        50
    );

}


/* =========================================================
   REJOINDRE
========================================================= */

function joinRoom(){

    const roomValue =
        $("roomInput")
            .value
            .trim()
            .toUpperCase();

    const name =
        $("nameInput")
            .value
            .trim();


    if(!roomValue){

        showMessage(
            "Entre le code du salon."
        );

        return;

    }


    if(!name){

        showMessage(
            "Entre ton prénom."
        );

        return;

    }


    room = roomValue;

    playerName = name;

    mode = "player";

    connect();

}


/* =========================================================
   CONNEXION
========================================================= */

function connect(){

    showMessage(
        "Connexion..."
    );


    try{

        socket =
            new WebSocket(
                SERVER_URL
            );

    }catch(error){

        showMessage(
            "Impossible de se connecter."
        );

        return;

    }


    socket.onopen = () => {

        showMessage("");


        if(mode === "tv"){

            send({
                type:"create_room"
            });

        }else{

            send({

                type:"join_room",

                room:room,

                name:playerName

            });

        }

    };


    socket.onmessage = event => {

        let data;


        try{

            data =
                JSON.parse(
                    event.data
                );

        }catch(error){

            return;

        }


        handleMessage(data);

    };


    socket.onerror = () => {

        showMessage(
            "Erreur de connexion au serveur."
        );

    };


    socket.onclose = () => {

        if(
            !gameState ||
            gameState.status !== "finished"
        ){

            showMessage(
                "Connexion au serveur perdue."
            );

        }

    };

}


/* =========================================================
   ENVOI
========================================================= */

function send(data){

    if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================================================
   MESSAGES
========================================================= */

function handleMessage(data){

    switch(data.type){

        case "room_created":

            room =
                data.room;

            openApp();

            break;


        case "joined":

            playerId =
                data.playerId;

            room =
                data.room;

            openApp();

            break;


        case "state":

            gameState =
                data.state;

            render();

            break;


        case "error":

            alert(
                data.message
            );

            break;


        case "color_required":

            pendingCardIndex =
                data.cardIndex;

            $("colorModal")
                .classList
                .remove("hidden");

            break;


        case "round_end":

            alert(
                data.winner +
                " remporte la manche !"
            );

            break;


        case "game_end":

            alert(
                data.winner +
                " remporte la partie !"
            );

            break;

    }

}


/* =========================================================
   OUVERTURE
========================================================= */

function openApp(){

    $("home")
        .classList
        .add("hidden");


    $("app")
        .classList
        .remove("hidden");


    $("roomCodeDisplay")
        .textContent =
        room;


    $("lobbyCode")
        .textContent =
        room;


    render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    if(!gameState){

        return;

    }


    if(
        gameState.status ===
        "waiting"
    ){

        $("lobby")
            .classList
            .remove("hidden");

        $("tvMode")
            .classList
            .add("hidden");

        $("playerMode")
            .classList
            .add("hidden");

        renderLobby();

        return;

    }


    $("lobby")
        .classList
        .add("hidden");


    if(mode === "tv"){

        $("tvMode")
            .classList
            .remove("hidden");

        $("playerMode")
            .classList
            .add("hidden");

        renderTV();

    }else{

        $("playerMode")
            .classList
            .remove("hidden");

        $("tvMode")
            .classList
            .add("hidden");

        renderPlayer();

    }

}


/* =========================================================
   LOBBY
========================================================= */

function renderLobby(){

    const list =
        $("lobbyPlayers");


    list.innerHTML = "";


    if(!gameState.players){

        return;

    }


    gameState.players.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "lobby-player" +
                (
                    player.host
                        ? " host"
                        : ""
                );


            div.textContent =
                player.name +
                (
                    player.host
                        ? " 👑"
                        : ""
                );


            list.appendChild(
                div
            );

        }
    );


    if(mode === "tv"){

        $("hostControls")
            .classList
            .remove("hidden");

    }else{

        $("hostControls")
            .classList
            .add("hidden");

    }

}


/* =========================================================
   TV
========================================================= */

function renderTV(){

    const list =
        $("tvPlayers");


    list.innerHTML = "";


    if(gameState.players){

        gameState.players.forEach(
            player => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "player-box" +
                    (
                        player.id ===
                        gameState.currentPlayer
                            ? " active"
                            : ""
                    );


                div.innerHTML = `

                    <div class="player-name">
                        ${escapeHtml(player.name)}
                    </div>

                    <div class="card-count">
                        ${player.cardCount}
                        carte${player.cardCount > 1 ? "s" : ""}
                    </div>

                `;


                list.appendChild(
                    div
                );

            }
        );

    }


    $("tvStatus")
        .textContent =
        gameState.currentPlayerName
            ? "Tour de " +
              gameState.currentPlayerName
            : "Partie terminée";


    renderDiscard(
        $("tvDiscard"),
        false
    );


    if(
        gameState.status ===
        "finished"
    ){

        $("newGameBtn")
            .classList
            .remove("hidden");

    }else{

        $("newGameBtn")
            .classList
            .add("hidden");

    }

}


/* =========================================================
   JOUEUR
========================================================= */

function renderPlayer(){

    const me =
        gameState.me;


    if(!me){

        return;

    }


    const myTurn =
        gameState.currentPlayer ===
        playerId;


    const turn =
        $("playerTurn");


    if(myTurn){

        turn.textContent =
            "🔥 À TOI DE JOUER !";

        turn.classList
            .add("my-turn");

        turn.classList
            .remove("other-turn");

    }else{

        turn.textContent =
            "⏳ Tour de " +
            (
                gameState.currentPlayerName ||
                "un joueur"
            );

        turn.classList
            .remove("my-turn");

        turn.classList
            .add("other-turn");

    }


    $("currentColor")
        .textContent =
        gameState.currentColor
            ? "🎨 Couleur : " +
              colorName(
                  gameState.currentColor
              )
            : "";


    renderHand(
        me.hand || [],
        myTurn
    );


    renderDiscard(
        $("mobileDiscard"),
        true
    );


    $("drawBtn").disabled =
        !myTurn ||
        !!me.hasDrawn;


    $("unoBtn").disabled =
        !(
            me.hand &&
            me.hand.length === 1
        );


    updateHandCount(
        me.hand
            ? me.hand.length
            : 0
    );

}


/* =========================================================
   COMPTE MAIN
========================================================= */

function updateHandCount(count){

    $("handCount")
        .textContent =
        count +
        (
            count > 1
                ? " cartes"
                : " carte"
        );

}


/* =========================================================
   MAIN
========================================================= */

function renderHand(
    hand,
    myTurn
){

    const container =
        $("myHand");


    container.innerHTML = "";


    hand.forEach(
        (card,index) => {

            const element =
                createCardElement(
                    card
                );


            element.classList
                .add("hand-card");


            if(
                myTurn &&
                isPlayable(card)
            ){

                element.classList
                    .add("playable");

            }else if(myTurn){

                element.classList
                    .add("not-playable");

            }


            element.addEventListener(
                "click",
                () => {

                    playCard(index);

                }
            );


            container.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   DEFAUSSE
========================================================= */

function renderDiscard(
    container,
    mobile
){

    if(!container){

        return;

    }


    container.innerHTML = "";


    if(!gameState.discard){

        return;

    }


    const card =
        createCardElement(
            gameState.discard
        );


    if(mobile){

        card.classList
            .add("mobile-card");

    }else{

        card.classList
            .add("tv-discard-card");

    }


    container.appendChild(
        card
    );

}


/* =========================================================
   CHARGEMENT DES VRAIES IMAGES
========================================================= */

/*
    IMPORTANT :

    Les noms correspondent à ton dossier GitHub :

    cards/
        Green-0.png
        Green-1.png
        ...
        Red-1.png
        Blue-1.png
        Yellow-1.png

    Pour les cartes spéciales :

        Green Draw2-1.png
        Green Draw2-2.png

        Green Reverse-1.png
        Green Reverse-2.png

        Green Skip-1.png
        Green Skip-2.png

    etc.

    Pour les Wild :

        Wild-1.png
        Wild-2.png
        Wild-3.png
        Wild-4.png

    Pour les +4 :

        Wild Draw2-1.png
        etc.

    Le code essaie plusieurs variantes.
*/


function cardImageCandidates(card){

    const color =
        capitalize(
            card.color || ""
        );


    const candidates = [];


    /* NUMEROS */

    if(card.type === "number"){

        candidates.push(
            `cards/${color}-${card.value}.png`
        );

        return candidates;

    }


    /* +2 */

    if(card.type === "draw2"){

        candidates.push(
            `cards/${color} Draw2-1.png`,
            `cards/${color} Draw2-2.png`,
            `cards/${color} Draw2-3.png`,
            `cards/${color} Draw2-4.png`
        );

        return candidates;

    }


    /* INVERSION */

    if(card.type === "reverse"){

        candidates.push(
            `cards/${color} Reverse-1.png`,
            `cards/${color} Reverse-2.png`,
            `cards/${color} Reverse-3.png`,
            `cards/${color} Reverse-4.png`
        );

        return candidates;

    }


    /* PASSE */

    if(card.type === "skip"){

        candidates.push(
            `cards/${color} Skip-1.png`,
            `cards/${color} Skip-2.png`,
            `cards/${color} Skip-3.png`,
            `cards/${color} Skip-4.png`
        );

        return candidates;

    }


    /* JOKER */

    if(card.type === "wild"){

        candidates.push(
            "cards/Wild-1.png",
            "cards/Wild-2.png",
            "cards/Wild-3.png",
            "cards/Wild-4.png"
        );

        return candidates;

    }


    /* +4 */

    if(card.type === "wild4"){

        candidates.push(
            "cards/Wild Draw2-1.png",
            "cards/Wild Draw2-2.png",
            "cards/Wild Draw2-3.png",
            "cards/Wild Draw2-4.png",
            "cards/Wild-1.png",
            "cards/Wild-2.png"
        );

        return candidates;

    }


    return candidates;

}


/* =========================================================
   CREER CARTE
========================================================= */

function createCardElement(card){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "card";


    const candidates =
        cardImageCandidates(
            card
        );


    const img =
        document.createElement(
            "img"
        );


    img.alt =
        "Carte UNO";


    let candidateIndex = 0;


    function tryNextImage(){

        if(
            candidateIndex >=
            candidates.length
        ){

            /*
                Si aucune image n'existe,
                on affiche un fallback.
            */

            img.style.display =
                "none";

            div.innerHTML +=
                fallbackCard(
                    card
                );

            return;

        }


        img.src =
            encodeURI(
                candidates[
                    candidateIndex
                ]
            );


        candidateIndex++;

    }


    img.onerror =
        tryNextImage;


    img.onload = () => {

        img.style.display =
            "block";

    };


    div.appendChild(
        img
    );


    if(candidates.length){

        tryNextImage();

    }else{

        div.innerHTML =
            fallbackCard(card);

    }


    return div;

}


/* =========================================================
   FALLBACK
========================================================= */

function fallbackCard(card){

    let text = "?";


    switch(card.type){

        case "number":
            text =
                card.value;
            break;

        case "skip":
            text =
                "⊘";
            break;

        case "reverse":
            text =
                "↔";
            break;

        case "draw2":
            text =
                "+2";
            break;

        case "wild":
            text =
                "★";
            break;

        case "wild4":
            text =
                "+4";
            break;

    }


    return `
        <div style="
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#222;
            color:white;
            font-size:45px;
            font-weight:bold;
        ">
            ${escapeHtml(text)}
        </div>
    `;

}


/* =========================================================
   CAPITALISATION
========================================================= */

function capitalize(value){

    if(!value){

        return "";

    }


    return (
        value.charAt(0).toUpperCase() +
        value.slice(1)
    );

}


/* =========================================================
   JOUABLE
========================================================= */

function isPlayable(card){

    if(!gameState){

        return false;

    }


    const discard =
        gameState.discard;


    if(!discard){

        return true;

    }


    if(card.type === "wild"){

        return true;

    }


    if(card.type === "wild4"){

        return (
            gameState.canPlayWild4 !== false
        );

    }


    if(
        card.color &&
        card.color ===
        gameState.currentColor
    ){

        return true;

    }


    if(
        card.type ===
        discard.type &&
        card.type !== "number"
    ){

        return true;

    }


    if(
        card.type === "number" &&
        discard.type === "number" &&
        String(card.value) ===
        String(discard.value)
    ){

        return true;

    }


    return false;

}


/* =========================================================
   JOUER
========================================================= */

function playCard(index){

    if(!gameState.me){

        return;

    }


    const card =
        gameState.me.hand[index];


    if(!card){

        return;

    }


    if(!isPlayable(card)){

        return;

    }


    if(
        card.type === "wild" ||
        card.type === "wild4"
    ){

        pendingCardIndex =
            index;


        $("colorModal")
            .classList
            .remove("hidden");


        return;

    }


    send({

        type:"play_card",

        index:index

    });

}


/* =========================================================
   COULEUR
========================================================= */

function chooseColor(color){

    $("colorModal")
        .classList
        .add("hidden");


    if(
        pendingCardIndex === null
    ){

        return;

    }


    send({

        type:"play_card",

        index:
            pendingCardIndex,

        color:
            color

    });


    pendingCardIndex =
        null;

}


/* =========================================================
   PIOCHER
========================================================= */

function drawCard(){

    send({
        type:"draw"
    });

}


/* =========================================================
   UNO
========================================================= */

function callUno(){

    send({
        type:"uno"
    });

}


/* =========================================================
   PARTIE
========================================================= */

function startGame(){

    send({
        type:"start_game"
    });

}


function newGame(){

    send({
        type:"new_game"
    });

}


/* =========================================================
   COULEUR
========================================================= */

function colorName(color){

    const names = {

        red:"ROUGE",

        yellow:"JAUNE",

        green:"VERT",

        blue:"BLEU"

    };


    return names[color] || "";

}


/* =========================================================
   SECURITE
========================================================= */

function escapeHtml(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   MODAL
========================================================= */

$("colorModal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target ===
                $("colorModal")
            ){

                $("colorModal")
                    .classList
                    .add("hidden");

                pendingCardIndex =
                    null;

            }

        }
    );


/* =========================================================
   ENTREE CODE SALON
========================================================= */

$("roomInput")
    .addEventListener(
        "input",
        event => {

            event.target.value =
                event.target.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    );

        }
    );


/* =========================================================
   ENTER POUR REJOINDRE
========================================================= */

$("nameInput")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){

                joinRoom();

            }

        }
    );


$("roomInput")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){

                $("nameInput").focus();

            }

        }
    );


</script>
