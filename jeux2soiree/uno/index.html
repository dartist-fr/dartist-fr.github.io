<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>UNO • Jeux2Soirée</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
    min-height:100vh;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        #090b12;
    background-size:25px 25px;
    color:#fff;
    font-family:'VT323',monospace;
}
body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.025) 0,
        rgba(255,255,255,.025) 1px,
        transparent 2px,
        transparent 5px
    );
    z-index:999;
}
button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* =========================
   ACCUEIL
========================= */

#home{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.home-box{
    width:100%;
    max-width:700px;
    text-align:center;
    padding:35px;
    border:3px solid #fff;
    box-shadow:8px 8px 0 #000;
    background:#10131d;
}

.logo{
    font-family:'Press Start 2P';
    font-size:clamp(28px,6vw,55px);
    margin-bottom:10px;
    text-shadow:4px 4px 0 #000;
}

.logo span{
    color:#ff305f;
}

.subtitle{
    font-size:27px;
    margin-bottom:35px;
}

.menu{
    display:grid;
    gap:15px;
}

.main-btn{
    border:3px solid #fff;
    background:#171b28;
    color:#fff;
    padding:18px;
    font-size:26px;
    transition:.15s;
    box-shadow:5px 5px 0 #000;
}

.main-btn:hover{
    transform:translate(-3px,-3px);
    background:#fff;
    color:#111;
}

.main-btn.create{
    background:#e92852;
}

.form-box{
    margin-top:25px;
    display:grid;
    gap:12px;
}

input{
    width:100%;
    padding:15px;
    background:#080a10;
    border:3px solid #fff;
    color:#fff;
    font-size:25px;
    outline:none;
}

input:focus{
    border-color:#ff315e;
}

.small{
    font-size:21px;
    opacity:.8;
}

/* =========================
   APP
========================= */

#app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.topbar{
    min-height:75px;
    border-bottom:3px solid #fff;
    background:#10131d;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    gap:15px;
}

.top-title{
    font-family:'Press Start 2P';
    font-size:20px;
}

.room-code{
    border:2px solid #fff;
    padding:8px 15px;
    font-size:24px;
    white-space:nowrap;
}

#gameArea{
    flex:1;
    padding:20px;
}

/* =========================
   LOBBY
========================= */

#lobby{
    text-align:center;
    max-width:800px;
    margin:auto;
}

.big-room{
    font-family:'Press Start 2P';
    font-size:clamp(40px,10vw,80px);
    margin:30px;
}

.lobby-players{
    display:grid;
    gap:8px;
    margin:20px 0;
}

.lobby-player{
    background:#151925;
    border:2px solid #555;
    padding:12px;
    font-size:25px;
}

.lobby-player.host{
    border-color:#ffd928;
}

#hostControls{
    text-align:center;
}

#message{
    text-align:center;
    font-size:25px;
    margin:10px;
}

/* =========================
   TV
========================= */

#tvMode{
    display:flex;
    flex-direction:column;
    min-height:calc(100vh - 115px);
}

.players{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.player-box{
    background:#121622;
    border:2px solid #666;
    padding:10px 18px;
    min-width:130px;
    text-align:center;
    transition:.2s;
}

.player-box.active{
    border-color:#fff;
    box-shadow:0 0 15px rgba(255,255,255,.5);
    transform:translateY(-4px);
}

.player-name{
    font-size:23px;
}

.card-count{
    font-size:20px;
    opacity:.75;
}

.table{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:50px;
    min-height:400px;
}

.deck-zone{
    text-align:center;
}

.zone-title{
    font-size:25px;
    margin-bottom:10px;
}

.deck,
.card{
    width:105px;
    height:150px;
    border-radius:12px;
    border:4px solid #fff;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Press Start 2P';
    font-size:19px;
    text-align:center;
    box-shadow:5px 5px 0 rgba(0,0,0,.5);
    overflow:hidden;
}

.deck{
    background:
        repeating-linear-gradient(
            45deg,
            #161b28,
            #161b28 8px,
            #252c3c 8px,
            #252c3c 16px
        );
}

.deck::after{
    content:"UNO";
    color:#ff305f;
    font-size:18px;
    transform:rotate(-25deg);
}

.tv-actions{
    text-align:center;
    padding:15px;
}

.start-btn{
    padding:15px 35px;
    background:#fff;
    color:#111;
    border:3px solid #fff;
    font-size:25px;
}

/* =========================
   CARTES IMAGE
========================= */

.card-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    border-radius:8px;
    background:transparent;
}

.card-fallback{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Press Start 2P';
    font-size:18px;
}

/* =========================
   JOUEUR
========================= */

#playerMode{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.player-info{
    text-align:center;
    margin-bottom:15px;
}

.player-turn{
    font-family:'Press Start 2P';
    font-size:20px;
    margin:10px;
}

#currentColor{
    font-size:27px;
    font-weight:bold;
}

/* =========================
   TABLE TELEPHONE
========================= */

.mobile-table{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:24px;
    margin:12px 0 22px;
}

.mobile-zone{
    text-align:center;
}

.mobile-zone .zone-title{
    font-size:22px;
}

.mobile-card-slot{
    width:92px;
    height:132px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.mobile-card-slot .card{
    width:92px;
    height:132px;
    border:0;
    box-shadow:5px 5px 0 rgba(0,0,0,.45);
}

.mobile-card-slot .card-image{
    border-radius:9px;
}

/* =========================
   MAIN DU JOUEUR
========================= */

.hand-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:25px;
    margin:12px 0 8px;
    padding:0 3px;
}

.hand-groups{
    display:grid;
    gap:10px;
}

.hand-group{
    background:rgba(12,15,23,.72);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;
    padding:10px 8px;
}

.hand-group-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:22px;
    margin-bottom:8px;
}

.dot{
    width:15px;
    height:15px;
    border-radius:50%;
    display:inline-block;
    border:1px solid #fff;
}

.dot.red{
    background:#ed214e;
}

.dot.yellow{
    background:#ffd928;
}

.dot.green{
    background:#20bd63;
}

.dot.blue{
    background:#2075e8;
}

.dot.wild{
    background:
        conic-gradient(
            #ed214e 0 25%,
            #ffd928 25% 50%,
            #20bd63 50% 75%,
            #2075e8 75% 100%
        );
}

.group-count{
    opacity:.65;
}

/* =========================
   GRILLE CARTES
========================= */

.hand-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:7px;
    width:100%;
}

.hand-card{
    width:100%;
    aspect-ratio:85/140;
    min-width:0;
    border:0;
    padding:0;
    background:transparent;
    position:relative;
    cursor:pointer;
    transition:
        transform .15s,
        filter .15s;
}

.hand-card .card-image{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:
        drop-shadow(2px 3px 2px rgba(0,0,0,.45));
}

.hand-card.playable .card-image{
    filter:
        drop-shadow(0 0 7px rgba(255,255,255,.95))
        drop-shadow(0 0 12px rgba(255,255,255,.45));
}

.hand-card.playable:hover,
.hand-card.playable:active{
    transform:translateY(-7px) scale(1.04);
}

.hand-card:not(.playable){
    opacity:.82;
}

.hand-card.missing{
    border:2px dashed #777;
    border-radius:8px;
    background:#20232b;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
}

.missing-text{
    font-size:14px;
    text-align:center;
    line-height:1.05;
}

/* =========================
   CONTROLES
========================= */

.controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:20px 0 10px;
}

.action-btn{
    flex:1;
    min-width:145px;
    padding:14px 20px;
    background:#161a26;
    border:3px solid #fff;
    color:#fff;
    font-size:24px;
}

.action-btn:hover{
    background:#fff;
    color:#000;
}

.action-btn.uno{
    background:#e92852;
}

.action-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================
   MODAL COULEUR
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
    padding:20px;
}

.modal-box{
    width:90%;
    max-width:500px;
    background:#10131d;
    border:3px solid #fff;
    padding:30px;
    text-align:center;
}

.modal-box h2{
    font-family:'Press Start 2P';
    font-size:20px;
}

.color-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:25px;
}

.color-btn{
    padding:20px;
    border:3px solid #fff;
    font-size:25px;
}

.red-btn{
    background:#ed214e;
    color:#fff;
}

.yellow-btn{
    background:#ffd928;
    color:#111;
}

.green-btn{
    background:#20bd63;
    color:#fff;
}

.blue-btn{
    background:#2075e8;
    color:#fff;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    #gameArea{
        padding:10px 9px 25px;
    }

    .topbar{
        min-height:60px;
        padding:9px 14px;
    }

    .top-title{
        font-size:13px;
    }

    .room-code{
        font-size:17px;
        padding:7px 9px;
    }

    .player-turn{
        font-size:16px;
    }

    #currentColor{
        font-size:23px;
    }

    .mobile-table{
        gap:18px;
        margin-bottom:16px;
    }

    .mobile-card-slot,
    .mobile-card-slot .card{
        width:86px;
        height:124px;
    }

    .hand-title{
        font-size:23px;
    }

    .hand-group{
        padding:8px 6px;
    }

    .hand-group-title{
        font-size:20px;
    }

    .hand-grid{
        gap:5px;
    }

    .controls{
        margin-top:15px;
    }

    .action-btn{
        min-width:135px;
        font-size:22px;
        padding:12px 10px;
    }

    .small{
        font-size:18px;
    }
}

@media(max-width:380px){

    .mobile-card-slot,
    .mobile-card-slot .card{
        width:78px;
        height:112px;
    }

    .mobile-table{
        gap:12px;
    }

    .hand-grid{
        gap:3px;
    }

    .hand-group-title{
        font-size:18px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ACCUEIL
========================= -->

<section id="home">

    <div class="home-box">

        <div class="logo">
            <span>UNO</span>
        </div>

        <div class="subtitle">
            Jeux2Soirée • Multijoueur
        </div>

        <div class="menu">

            <button
                class="main-btn create"
                onclick="createRoom()">
                🖥️ CRÉER UN SALON
            </button>

            <button
                class="main-btn"
                onclick="showJoin()">
                📱 REJOINDRE UN SALON
            </button>

        </div>

        <div
            id="joinForm"
            class="form-box hidden">

            <input
                id="roomInput"
                maxlength="6"
                placeholder="CODE DU SALON">

            <input
                id="nameInput"
                maxlength="18"
                placeholder="TON PRÉNOM">

            <button
                class="main-btn create"
                onclick="joinRoom()">
                REJOINDRE
            </button>

        </div>

        <div id="message"></div>

        <div class="small">
            2 à 10 joueurs
        </div>

    </div>

</section>


<!-- =========================
     APPLICATION
========================= -->

<section
    id="app"
    class="hidden">

    <header class="topbar">

        <div class="top-title">
            UNO
        </div>

        <div class="room-code">
            SALON :
            <strong id="roomCodeDisplay">
                ----
            </strong>
        </div>

    </header>


    <main id="gameArea">

        <!-- LOBBY -->

        <section id="lobby">

            <div
                class="big-room"
                id="lobbyCode">
                ----
            </div>

            <div class="small">
                Donnez ce code aux autres joueurs
            </div>

            <div
                class="lobby-players"
                id="lobbyPlayers">
            </div>

            <div id="hostControls">

                <button
                    class="start-btn"
                    onclick="startGame()">
                    ▶ COMMENCER LA PARTIE
                </button>

            </div>

        </section>


        <!-- MODE TV -->

        <section
            id="tvMode"
            class="hidden">

            <div
                class="players"
                id="tvPlayers">
            </div>

            <div
                class="status"
                id="tvStatus">
                En attente...
            </div>


            <div class="table">

                <div class="deck-zone">

                    <div class="zone-title">
                        PIOCHE
                    </div>

                    <div class="deck"></div>

                </div>


                <div class="deck-zone">

                    <div class="zone-title">
                        DÉFAUSSE
                    </div>

                    <div id="tvDiscard"></div>

                </div>

            </div>


            <div class="tv-actions">

                <button
                    class="start-btn hidden"
                    id="newGameBtn"
                    onclick="newGame()">
                    🔄 NOUVELLE MANCHE
                </button>

            </div>

        </section>


        <!-- MODE JOUEUR -->

        <section
            id="playerMode"
            class="hidden">

            <div class="player-info">

                <div
                    class="player-turn"
                    id="playerTurn">
                    EN ATTENTE
                </div>

                <div id="currentColor"></div>

            </div>


            <!-- PIOCHE / DEFAUSSE -->

            <div class="mobile-table">

                <div class="mobile-zone">

                    <div class="zone-title">
                        PIOCHE
                    </div>

                    <div class="mobile-card-slot">

                        <div class="deck"></div>

                    </div>

                </div>


                <div class="mobile-zone">

                    <div class="zone-title">
                        DÉFAUSSE
                    </div>

                    <div
                        class="mobile-card-slot"
                        id="mobileDiscard">
                    </div>

                </div>

            </div>


            <!-- MAIN -->

            <div class="hand-title">

                <span>
                    👤 TA MAIN
                </span>

                <span id="handCount">
                    0 carte
                </span>

            </div>


            <div
                class="hand-groups"
                id="myHand">
            </div>


            <!-- BOUTONS -->

            <div class="controls">

                <button
                    class="action-btn"
                    id="drawBtn"
                    onclick="drawCard()">
                    🃏 PIOCHER
                </button>

                <button
                    class="action-btn uno"
                    id="unoBtn"
                    onclick="callUno()">
                    UNO !
                </button>

            </div>


            <div
                class="small"
                style="text-align:center">

                Les cartes sont regroupées par couleur.
                Clique sur une carte jouable pour la jouer.

            </div>

        </section>

    </main>

</section>


<!-- =========================
     MODAL COULEUR
========================= -->

<div
    class="modal hidden"
    id="colorModal">

    <div class="modal-box">

        <h2>
            CHOISIS UNE COULEUR
        </h2>

        <div class="color-buttons">

            <button
                class="color-btn red-btn"
                onclick="chooseColor('red')">
                ROUGE
            </button>

            <button
                class="color-btn yellow-btn"
                onclick="chooseColor('yellow')">
                JAUNE
            </button>

            <button
                class="color-btn green-btn"
                onclick="chooseColor('green')">
                VERT
            </button>

            <button
                class="color-btn blue-btn"
                onclick="chooseColor('blue')">
                BLEU
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   SERVEUR
========================= */

const SERVER_URL =
    "wss://uno-jeux2soiree.onrender.com";


let socket = null;
let mode = null;
let room = null;
let playerName = null;
let playerId = null;
let gameState = null;
let pendingCardIndex = null;


/* =========================
   UTILITAIRES
========================= */

function $(id){
    return document.getElementById(id);
}


function showMessage(text){
    $("message").textContent = text;
}


function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   ACCUEIL
========================= */

function showJoin(){

    $("joinForm").classList.remove("hidden");

    $("roomInput").focus();
}


function createRoom(){

    mode = "tv";

    connect();
}


function joinRoom(){

    const roomValue =
        $("roomInput").value
        .trim()
        .toUpperCase();

    const name =
        $("nameInput").value
        .trim();


    if(!roomValue){

        showMessage(
            "Entre le code du salon."
        );

        return;
    }


    if(!name){

        showMessage(
            "Entre ton prénom."
        );

        return;
    }


    room = roomValue;
    playerName = name;
    mode = "player";

    connect();
}


/* =========================
   WEBSOCKET
========================= */

function connect(){

    showMessage(
        "Connexion..."
    );


    try{

        socket =
            new WebSocket(
                SERVER_URL
            );

    }catch(e){

        showMessage(
            "Impossible de se connecter au serveur."
        );

        return;
    }


    socket.onopen = () => {

        showMessage("");


        if(mode === "tv"){

            send({
                type:"create_room"
            });

        }else{

            send({
                type:"join_room",
                room:room,
                name:playerName
            });

        }

    };


    socket.onmessage = event => {

        let data;

        try{

            data =
                JSON.parse(
                    event.data
                );

        }catch(e){

            return;
        }


        handleMessage(data);
    };


    socket.onclose = () => {

        if(
            !gameState ||
            gameState.status !== "finished"
        ){

            showMessage(
                "Connexion au serveur perdue."
            );

        }

    };


    socket.onerror = () => {

        showMessage(
            "Erreur de connexion."
        );

    };

}


function send(data){

    if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================
   MESSAGES SERVEUR
========================= */

function handleMessage(data){

    switch(data.type){

        case "room_created":

            room =
                data.room;

            openApp();

            break;


        case "joined":

            playerId =
                data.playerId;

            room =
                data.room;

            openApp();

            break;


        case "state":

            gameState =
                data.state;

            render();

            break;


        case "error":

            alert(
                data.message
            );

            break;


        case "color_required":

            pendingCardIndex =
                data.cardIndex;

            $("colorModal")
                .classList
                .remove("hidden");

            break;


        case "round_end":

            alert(
                data.winner +
                " remporte la manche !"
            );

            break;


        case "game_end":

            alert(
                data.winner +
                " remporte la partie !"
            );

            break;

    }

}


/* =========================
   OUVERTURE
========================= */

function openApp(){

    $("home")
        .classList
        .add("hidden");

    $("app")
        .classList
        .remove("hidden");


    $("roomCodeDisplay")
        .textContent = room;

    $("lobbyCode")
        .textContent = room;


    render();
}


/* =========================
   RENDER GENERAL
========================= */

function render(){

    if(!gameState)
        return;


    if(
        gameState.status ===
        "waiting"
    ){

        $("lobby")
            .classList
            .remove("hidden");

        $("tvMode")
            .classList
            .add("hidden");

        $("playerMode")
            .classList
            .add("hidden");


        renderLobby();

        return;
    }


    $("lobby")
        .classList
        .add("hidden");


    if(mode === "tv"){

        $("tvMode")
            .classList
            .remove("hidden");

        $("playerMode")
            .classList
            .add("hidden");

        renderTV();

    }else{

        $("playerMode")
            .classList
            .remove("hidden");

        $("tvMode")
            .classList
            .add("hidden");

        renderPlayer();

    }

}


/* =========================
   LOBBY
========================= */

function renderLobby(){

    const list =
        $("lobbyPlayers");

    list.innerHTML = "";


    gameState.players.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "lobby-player" +
                (
                    player.host
                        ? " host"
                        : ""
                );


            div.textContent =
                player.name +
                (
                    player.host
                        ? " 👑"
                        : ""
                );


            list.appendChild(div);

        }
    );


    $("hostControls")
        .classList
        .toggle(
            "hidden",
            mode !== "tv"
        );

}


/* =========================
   TV
========================= */

function renderTV(){

    const list =
        $("tvPlayers");

    list.innerHTML = "";


    gameState.players.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "player-box" +
                (
                    player.id ===
                    gameState.currentPlayer
                        ? " active"
                        : ""
                );


            div.innerHTML = `

                <div class="player-name">
                    ${escapeHtml(player.name)}
                </div>

                <div class="card-count">

                    ${player.cardCount}
                    carte
                    ${player.cardCount > 1 ? "s" : ""}

                </div>

            `;


            list.appendChild(div);

        }
    );


    $("tvStatus").textContent =
        gameState.currentPlayerName
            ? "Tour de " +
              gameState.currentPlayerName
            : "Partie terminée";


    renderDiscard(
        "tvDiscard"
    );


    $("newGameBtn")
        .classList
        .toggle(
            "hidden",
            gameState.status !== "finished"
        );

}


/* =========================
   JOUEUR
========================= */

function renderPlayer(){

    const me =
        gameState.me;


    if(!me)
        return;


    const myTurn =
        gameState.currentPlayer ===
        playerId;


    $("playerTurn").textContent =
        myTurn
            ? "🔥 À TOI DE JOUER !"
            : "⏳ Tour de " +
              gameState.currentPlayerName;


    $("currentColor").textContent =
        gameState.currentColor
            ? "🎨 Couleur : " +
              colorName(
                  gameState.currentColor
              )
            : "";


    renderDiscard(
        "mobileDiscard"
    );


    renderHand(
        me.hand,
        myTurn
    );


    $("handCount").textContent =
        me.hand.length +
        " carte" +
        (
            me.hand.length > 1
                ? "s"
                : ""
        );


    $("drawBtn").disabled =
        !myTurn ||
        me.hasDrawn;


    $("unoBtn").disabled =
        me.hand.length !== 1;

}


/* =========================
   DEFAUSSE
========================= */

function renderDiscard(containerId){

    const container =
        $(containerId);


    container.innerHTML = "";


    if(!gameState.discard)
        return;


    const card =
        createCardElement(
            gameState.discard
        );


    if(
        containerId ===
        "mobileDiscard"
    ){

        card.classList.add(
            "mobile-discard-card"
        );

    }


    container.appendChild(card);

}


/* =========================
   GROUPES DE COULEURS
========================= */

const GROUPS = [

    {
        key:"red",
        label:"ROUGE",
        color:"red"
    },

    {
        key:"yellow",
        label:"JAUNE",
        color:"yellow"
    },

    {
        key:"green",
        label:"VERT",
        color:"green"
    },

    {
        key:"blue",
        label:"BLEU",
        color:"blue"
    },

    {
        key:"wild",
        label:"JOKERS",
        color:"wild"
    }

];


/* =========================
   MAIN
========================= */

function renderHand(
    hand,
    myTurn
){

    const container =
        $("myHand");

    container.innerHTML = "";


    const grouped = {

        red:[],
        yellow:[],
        green:[],
        blue:[],
        wild:[]

    };


    hand.forEach(
        (card,index) => {

            const key =
                card.color &&
                grouped[card.color]
                    ? card.color
                    : "wild";


            grouped[key].push({
                card,
                index
            });

        }
    );


    GROUPS.forEach(
        group => {

            const cards =
                grouped[group.key];


            if(!cards.length)
                return;


            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "hand-group";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "hand-group-title";


            title.innerHTML = `

                <span
                    class="dot ${group.color}">
                </span>

                <span>
                    ${group.label}
                </span>

                <span class="group-count">
                    • ${cards.length}
                </span>

            `;


            const grid =
                document.createElement(
                    "div"
                );


            grid.className =
                "hand-grid";


            cards.forEach(
                item => {

                    const element =
                        createHandCardElement(
                            item.card,
                            item.index,
                            myTurn
                        );


                    grid.appendChild(
                        element
                    );

                }
            );


            section.appendChild(
                title
            );

            section.appendChild(
                grid
            );


            container.appendChild(
                section
            );

        }
    );

}


/* =========================
   CARTE MAIN
========================= */

function createHandCardElement(
    card,
    index,
    myTurn
){

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "hand-card";


    if(
        myTurn &&
        isPlayable(card)
    ){

        button.classList.add(
            "playable"
        );

    }


    const img =
        createCardImage(
            card,
            button
        );


    button.appendChild(
        img
    );


    button.onclick =
        () => playCard(index);


    return button;
}


/* =========================
   CARTE GENERIQUE
========================= */

function createCardElement(
    card
){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "card";


    const img =
        createCardImage(
            card,
            div
        );


    div.appendChild(
        img
    );


    return div;
}


/* =========================================================
   IMPORTANT
   NOMS EXACTS DES FICHIERS PNG
========================================================= */

function getCardImageCandidates(
    card
){

    const color =
        card.color;

    const type =
        card.type;

    const value =
        card.value;


    const prefix = {

        red:"Red",

        yellow:"Yellow",

        green:"Green",

        blue:"Blue"

    }[color];


    /* -------------------------
       NUMEROS
    ------------------------- */

    if(
        type === "number" &&
        prefix
    ){

        return [

            `${prefix}- ${value}.png`,

            `${prefix}-${value}.png`

        ];

    }


    /* -------------------------
       +2
    ------------------------- */

    if(
        type === "draw2" &&
        prefix
    ){

        return [

            `${prefix} Draw2- 1.png`,

            `${prefix} Draw2- 2.png`,

            `${prefix} Draw2-1.png`,

            `${prefix} Draw2-2.png`

        ];

    }


    /* -------------------------
       REVERSE
    ------------------------- */

    if(
        type === "reverse" &&
        prefix
    ){

        return [

            `${prefix} Reverse- 1.png`,

            `${prefix} Reverse- 2.png`,

            `${prefix} Reverse-1.png`,

            `${prefix} Reverse-2.png`

        ];

    }


    /* -------------------------
       SKIP
    ------------------------- */

    if(
        type === "skip" &&
        prefix
    ){

        return [

            `${prefix} Skip- 1.png`,

            `${prefix} Skip- 2.png`,

            `${prefix} Skip-1.png`,

            `${prefix} Skip-2.png`

        ];

    }


    /* -------------------------
       JOKER
    ------------------------- */

    if(
        type === "wild"
    ){

        return [

            "Wild-1.png",

            "Wild-2.png",

            "Wild-3.png",

            "Wild-4.png"

        ];

    }


    /* -------------------------
       +4
    ------------------------- */

    if(
        type === "wild4"
    ){

        return [

            "Draw4- 1.png",

            "Draw4- 2.png",

            "Draw4- 3.png",

            "Draw4- 4.png",

            "Draw4-1.png",

            "Draw4-2.png",

            "Draw4-3.png",

            "Draw4-4.png"

        ];

    }


    return [];

}


/* =========================
   CREATION IMAGE
========================= */

function createCardImage(
    card,
    parent
){

    const img =
        document.createElement(
            "img"
        );


    img.className =
        "card-image";


    img.alt =
        cardLabel(card);


    img.draggable =
        false;


    const candidates =
        getCardImageCandidates(
            card
        );


    let position = 0;


    function tryNext(){

        if(
            position >=
            candidates.length
        ){

            img.remove();


            parent.classList.add(
                "missing"
            );


            const fallback =
                document.createElement(
                    "div"
                );


            fallback.className =
                "missing-text";


            fallback.textContent =
                cardLabel(card);


            parent.appendChild(
                fallback
            );


            return;
        }


        const filename =
            candidates[position++];


        /*
         * Le fichier est dans :
         *
         * uno/cards/
         *
         * Donc depuis index.html :
         *
         * cards/nom-du-fichier.png
         */

        img.src =
            "cards/" +
            encodeURIComponent(
                filename
            );

    }


    img.onerror =
        tryNext;


    tryNext();


    return img;
}


/* =========================
   NOM CARTE
========================= */

function cardLabel(card){

    switch(card.type){

        case "number":
            return String(
                card.value
            );

        case "skip":
            return "SKIP";

        case "reverse":
            return "↔";

        case "draw2":
            return "+2";

        case "wild":
            return "JOKER";

        case "wild4":
            return "+4";

        default:
            return "?";

    }

}


/* =========================
   COULEUR
========================= */

function colorName(color){

    return {

        red:"ROUGE",

        yellow:"JAUNE",

        green:"VERT",

        blue:"BLEU"

    }[color] || "";

}


/* =========================
   JOUER CARTE
========================= */

function playCard(index){

    if(!gameState.me)
        return;


    const card =
        gameState.me.hand[index];


    if(!isPlayable(card))
        return;


    if(
        card.type === "wild" ||
        card.type === "wild4"
    ){

        pendingCardIndex =
            index;


        $("colorModal")
            .classList
            .remove("hidden");


        return;
    }


    send({

        type:"play_card",

        index:index

    });

}


/* =========================
   CHOIX COULEUR
========================= */

function chooseColor(
    color
){

    $("colorModal")
        .classList
        .add("hidden");


    send({

        type:"play_card",

        index:
            pendingCardIndex,

        color:
            color

    });


    pendingCardIndex =
        null;

}


/* =========================
   PIOCHE
========================= */

function drawCard(){

    send({
        type:"draw"
    });

}


/* =========================
   UNO
========================= */

function callUno(){

    send({
        type:"uno"
    });

}


/* =========================
   DEMARRER
========================= */

function startGame(){

    send({
        type:"start_game"
    });

}


/* =========================
   NOUVELLE MANCHE
========================= */

function newGame(){

    send({
        type:"new_game"
    });

}


/* =========================
   CARTE JOUABLE
========================= */

function isPlayable(
    card
){

    if(!gameState)
        return false;


    const discard =
        gameState.discard;


    if(!discard)
        return true;


    /* JOKER */

    if(
        card.type === "wild"
    ){

        return true;

    }


    /* +4 */

    if(
        card.type === "wild4"
    ){

        return gameState.canPlayWild4;

    }


    /* Même couleur */

    if(
        card.color ===
        gameState.currentColor
    ){

        return true;

    }


    /* Même action */

    if(
        card.type ===
        discard.type &&
        card.type !==
        "number"
    ){

        return true;

    }


    /* Même numéro */

    if(

        card.type ===
        "number" &&

        discard.type ===
        "number" &&

        card.value ===
        discard.value

    ){

        return true;

    }


    return false;
}
