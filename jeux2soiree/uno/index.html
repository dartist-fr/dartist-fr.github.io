<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>UNO • Jeux2Soirée</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');


/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        #090b12;

    background-size: 25px 25px;

    color: white;

    font-family:
        'VT323',
        monospace;

    overflow-x: hidden;
}

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 2px,
            transparent 5px
        );

    z-index: 999;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}


/* =========================================================
   ACCUEIL
========================================================= */

#home {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;
}

.home-box {

    width: 100%;

    max-width: 700px;

    text-align: center;

    padding: 35px;

    border: 3px solid white;

    box-shadow:
        8px 8px 0 #000;

    background:
        #10131d;
}

.logo {

    font-family:
        'Press Start 2P';

    font-size:
        clamp(
            28px,
            6vw,
            55px
        );

    margin-bottom: 10px;

    text-shadow:
        4px 4px 0 #000;
}

.logo span {
    color: #ff305f;
}

.subtitle {

    font-size: 27px;

    margin-bottom: 35px;
}

.menu {

    display: grid;

    gap: 15px;
}

.main-btn {

    border: 3px solid white;

    background: #171b28;

    color: white;

    padding: 18px;

    font-size: 26px;

    transition: .15s;

    box-shadow:
        5px 5px 0 #000;
}

.main-btn:hover {

    transform:
        translate(
            -3px,
            -3px
        );

    background: white;

    color: #111;
}

.main-btn.create {
    background: #e92852;
}

.form-box {

    margin-top: 25px;

    display: grid;

    gap: 12px;
}

input {

    width: 100%;

    padding: 15px;

    background: #080a10;

    border: 3px solid white;

    color: white;

    font-size: 25px;

    outline: none;
}

input:focus {
    border-color: #ff315e;
}

.small {

    font-size: 21px;

    opacity: .8;
}

#message {

    text-align: center;

    font-size: 25px;

    margin: 15px;
}


/* =========================================================
   APP
========================================================= */

#app {

    min-height: 100vh;

    display: flex;

    flex-direction: column;
}

.topbar {

    height: 75px;

    border-bottom: 3px solid white;

    background: #10131d;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 20px;

    flex-shrink: 0;
}

.top-title {

    font-family:
        'Press Start 2P';

    font-size: 20px;
}

.room-code {

    border: 2px solid white;

    padding: 8px 15px;

    font-size: 24px;
}

#gameArea {

    flex: 1;

    padding: 20px;
}


/* =========================================================
   LOBBY
========================================================= */

#lobby {

    text-align: center;

    max-width: 800px;

    margin: auto;
}

.big-room {

    font-family:
        'Press Start 2P';

    font-size:
        clamp(
            40px,
            10vw,
            80px
        );

    margin: 30px;
}

.lobby-players {

    display: grid;

    gap: 8px;

    margin: 20px 0;
}

.lobby-player {

    background: #151925;

    border: 2px solid #555;

    padding: 12px;

    font-size: 25px;
}

.lobby-player.host {

    border-color:
        #ffd928;

    box-shadow:
        0 0 12px
        rgba(
            255,
            217,
            40,
            .25
        );
}

.start-btn {

    padding:
        15px 35px;

    background: white;

    color: #111;

    border: 3px solid white;

    font-size: 25px;

    box-shadow:
        5px 5px 0 #000;
}


/* =========================================================
   TABLE TV
========================================================= */

#tvMode {

    display: flex;

    flex-direction: column;

    min-height:
        calc(
            100vh - 115px
        );
}

.players {

    display: flex;

    gap: 12px;

    justify-content: center;

    flex-wrap: wrap;

    margin-bottom: 15px;
}

.player-box {

    background: #121622;

    border: 2px solid #666;

    padding:
        10px 18px;

    min-width: 130px;

    text-align: center;

    transition: .2s;
}

.player-box.active {

    border-color: white;

    box-shadow:
        0 0 15px
        rgba(
            255,
            255,
            255,
            .5
        );

    transform:
        translateY(-4px);
}

.player-name {

    font-size: 23px;
}

.card-count {

    font-size: 20px;

    opacity: .75;
}

.table {

    flex: 1;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 50px;

    min-height: 400px;
}

.deck-zone {

    text-align: center;
}

.zone-title {

    font-size: 25px;

    margin-bottom: 10px;
}


/* =========================================================
   DOS DE CARTE
========================================================= */

.deck {

    width: 105px;

    height: 150px;

    border-radius: 12px;

    border: 4px solid white;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    box-shadow:
        5px 5px 0
        rgba(
            0,
            0,
            0,
            .5
        );

    background:
        repeating-linear-gradient(
            45deg,
            #161b28,
            #161b28 8px,
            #252c3c 8px,
            #252c3c 16px
        );
}

.deck::after {

    content:
        "UNO";

    color:
        #ff305f;

    font-family:
        'Press Start 2P';

    font-size: 18px;

    transform:
        rotate(-25deg);
}


/* =========================================================
   CARTES IMAGE
========================================================= */

.card {

    width: 105px;

    height: 150px;

    border-radius: 12px;

    border: 4px solid white;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    background:
        #151820;

    box-shadow:
        5px 5px 0
        rgba(
            0,
            0,
            0,
            .5
        );
}

.card-image {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 7px;
}

.card-fallback {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-family:
        'Press Start 2P';

    font-size: 18px;

    padding: 5px;

    background:
        #252a35;

    color: white;
}


/* =========================================================
   STATUS TV
========================================================= */

.status {

    text-align: center;

    font-size: 32px;

    margin: 15px;
}

.tv-actions {

    text-align: center;

    padding: 15px;
}


/* =========================================================
   PLAYER
========================================================= */

#playerMode {

    max-width: 1000px;

    margin: auto;

    width: 100%;
}

.player-info {

    text-align: center;

    margin-bottom: 15px;
}

.player-turn {

    font-family:
        'Press Start 2P';

    font-size: 20px;

    margin: 10px;
}

#currentColor {

    font-family:
        'Press Start 2P';

    font-size: 18px;

    margin: 15px;
}


/* =========================================================
   MAIN
========================================================= */

.my-hand {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    justify-content: center;

    margin: 20px 0;
}

.hand-card {

    width: 75px;

    height: 110px;

    cursor: pointer;

    transition:
        transform .15s,
        filter .15s;

    flex-shrink: 0;
}

.hand-card:hover {

    transform:
        translateY(-12px);
}

.hand-card.playable {

    box-shadow:
        0 0 18px
        rgba(
            255,
            255,
            255,
            .95
        );

    filter:
        brightness(1.1);
}

.hand-card:not(.playable) {

    opacity: .65;
}


/* =========================================================
   CONTROLES
========================================================= */

.controls {

    display: flex;

    gap: 10px;

    justify-content: center;

    flex-wrap: wrap;

    margin: 20px 0;
}

.action-btn {

    padding:
        14px 20px;

    background: #161a26;

    border: 2px solid white;

    color: white;

    font-size: 22px;

    box-shadow:
        4px 4px 0 #000;
}

.action-btn:hover {

    background: white;

    color: black;
}

.action-btn.uno {

    background:
        #e92852;
}

.action-btn:disabled {

    opacity: .35;

    cursor:
        not-allowed;

    box-shadow:
        none;
}


/* =========================================================
   MODAL COULEUR
========================================================= */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(
            0,
            0,
            0,
            .85
        );

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 10000;

    padding: 20px;
}

.modal-box {

    width: 90%;

    max-width: 500px;

    background:
        #10131d;

    border:
        3px solid white;

    padding:
        30px;

    text-align: center;

    box-shadow:
        8px 8px 0 #000;
}

.modal-box h2 {

    font-family:
        'Press Start 2P';

    font-size: 20px;
}

.color-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

    margin-top: 25px;
}

.color-btn {

    padding: 20px;

    border: 3px solid white;

    font-size: 25px;

    box-shadow:
        4px 4px 0 #000;
}

.red-btn {

    background:
        #ed214e;

    color: white;
}

.yellow-btn {

    background:
        #ffd928;

    color: #111;
}

.green-btn {

    background:
        #20bd63;

    color: white;
}

.blue-btn {

    background:
        #2075e8;

    color: white;
}


/* =========================================================
   VICTOIRE
========================================================= */

#victoryModal {

    position: fixed;

    inset: 0;

    z-index: 50000;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at center,
            rgba(
                237,
                23,
                64,
                .30
            ),
            rgba(
                0,
                0,
                0,
                .95
            ) 70%
        );

    backdrop-filter:
        blur(8px);

    animation:
        victoryAppear
        .4s
        ease-out;
}

.victory-box {

    width:
        min(
            560px,
            100%
        );

    padding:
        35px
        25px
        30px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            #191d29,
            #08090e
        );

    border:
        4px solid white;

    box-shadow:
        8px 8px 0 #000,
        0 0 45px
        rgba(
            237,
            23,
            64,
            .65
        );

    position: relative;

    overflow: hidden;
}

.victory-box::before {

    content: "";

    position: absolute;

    inset: -150px;

    background:
        conic-gradient(
            transparent,
            rgba(
                255,
                255,
                255,
                .15
            ),
            transparent,
            rgba(
                237,
                23,
                64,
                .25
            ),
            transparent
        );

    animation:
        victorySpin
        6s
        linear
        infinite;
}

.victory-content {

    position: relative;

    z-index: 2;
}

.victory-trophy {

    font-size:
        clamp(
            55px,
            15vw,
            95px
        );

    animation:
        trophyBounce
        .8s
        ease-in-out
        infinite
        alternate;
}

.victory-title {

    margin:
        5px 0 20px;

    font-family:
        'Press Start 2P';

    font-size:
        clamp(
            22px,
            6vw,
            36px
        );

    color:
        #ffd814;

    text-shadow:
        4px 4px 0 #000,
        0 0 20px
        rgba(
            255,
            216,
            20,
            .7
        );
}

.victory-subtitle {

    font-size: 25px;

    opacity: .85;

    margin-bottom: 10px;
}

.victory-name {

    font-family:
        'Press Start 2P';

    font-size:
        clamp(
            18px,
            5vw,
            30px
        );

    color: white;

    margin:
        15px 0;

    word-break:
        break-word;

    text-shadow:
        3px 3px 0 #000;
}

.victory-points {

    font-size: 32px;

    color:
        #ffd814;

    margin-bottom: 25px;
}

.victory-btn {

    width: 100%;

    min-height: 62px;

    border:
        3px solid white;

    background:
        #ed1740;

    color: white;

    font-family:
        'VT323',
        monospace;

    font-size: 27px;

    box-shadow:
        5px 5px 0 #000;
}

.victory-btn:hover {

    background:
        #ff315e;
}

.victory-btn:active {

    transform:
        translate(
            3px,
            3px
        );

    box-shadow:
        2px 2px 0 #000;
}

.victory-waiting {

    font-size: 22px;

    opacity: .65;

    margin-top: 15px;
}


/* =========================================================
   CONFETTIS
========================================================= */

.confetti {

    position: absolute;

    width: 10px;

    height: 10px;

    background:
        white;

    animation:
        confettiFall
        2.5s
        linear
        infinite;
}

.confetti:nth-child(3n) {
    background: #ffd814;
}

.confetti:nth-child(3n+1) {
    background: #ed1740;
}

.confetti:nth-child(3n+2) {
    background: #20bd63;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes victoryAppear {

    from {

        opacity: 0;

        transform:
            scale(.75);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}

@keyframes victorySpin {

    from {

        transform:
            rotate(0deg);
    }

    to {

        transform:
            rotate(360deg);
    }
}

@keyframes trophyBounce {

    from {

        transform:
            translateY(0)
            rotate(-3deg);
    }

    to {

        transform:
            translateY(-10px)
            rotate(3deg);
    }
}

@keyframes confettiFall {

    from {

        transform:
            translateY(-100px)
            rotate(0deg);

        opacity: 1;
    }

    to {

        transform:
            translateY(600px)
            rotate(720deg);

        opacity: 0;
    }
}


/* =========================================================
   RESPONSIVE MOBILE
========================================================= */

@media(max-width:600px) {

    body {
        min-height: 100vh;
    }

    .topbar {

        height: 58px;

        padding:
            0 10px;
    }

    .top-title {

        font-size: 13px;
    }

    .room-code {

        font-size: 17px;

        padding:
            6px 8px;
    }

    #gameArea {

        padding:
            8px;
    }


    /* -------------------------
       PLAYER
    ------------------------- */

    #playerMode {

        width: 100%;
    }

    .player-info {

        margin-bottom: 5px;
    }

    .player-turn {

        font-size:
            clamp(
                14px,
                5vw,
                21px
            );

        margin:
            7px 0;
    }

    #currentColor {

        font-size:
            17px;

        margin:
            8px 0 14px;
    }


    /* -------------------------
       CARTES TABLE
    ------------------------- */

    .table {

        gap: 25px;

        min-height:
            250px;
    }

    .deck {

        width:
            80px;

        height:
            115px;
    }

    .zone-title {

        font-size:
            20px;
    }


    /* -------------------------
       MAIN
    ------------------------- */

    .my-hand {

        justify-content:
            center;

        gap:
            7px;

        margin:
            15px 0;

        width: 100%;
    }

    .hand-card {

        width:
            calc(
                (100vw - 50px) / 7
            );

        max-width:
            62px;

        min-width:
            42px;

        height:
            calc(
                (
                    (100vw - 50px)
                    / 7
                ) * 1.47
            );

        max-height:
            92px;

        min-height:
            62px;
    }

    .controls {

        display:
            grid;

        grid-template-columns:
            1fr 1fr;

        gap:
            10px;

        margin:
            15px 0 10px;
    }

    .action-btn {

        width: 100%;

        padding:
            12px 5px;

        font-size:
            21px;
    }


    /* -------------------------
       VICTOIRE
    ------------------------- */

    .victory-box {

        padding:
            25px
            18px
            25px;
    }

    .victory-subtitle {

        font-size:
            21px;
    }

    .victory-points {

        font-size:
            27px;
    }

    .victory-btn {

        font-size:
            24px;
    }


    /* -------------------------
       LOBBY
    ------------------------- */

    .big-room {

        font-size:
            45px;

        margin:
            20px 0;
    }

    .home-box {

        padding:
            25px 18px;
    }

}


/* =========================================================
   TRÈS PETITS ÉCRANS
========================================================= */

@media(max-width:380px) {

    .hand-card {

        width:
            calc(
                (100vw - 43px) / 7
            );

        height:
            calc(
                (
                    (100vw - 43px)
                    / 7
                ) * 1.47
            );
    }

    .my-hand {

        gap: 5px;
    }

}


/* =========================================================
   TV LARGE
========================================================= */

@media(min-width:1000px) {

    .card,
    .deck {

        width: 125px;

        height: 180px;
    }

}

</style>

</head>


<body>


<!-- ========================================================
     ACCUEIL
========================================================= -->

<section id="home">

    <div class="home-box">

        <div class="logo">
            <span>UNO</span>
        </div>

        <div class="subtitle">
            Jeux2Soirée • Multijoueur
        </div>

        <div class="menu">

            <button
                class="main-btn create"
                onclick="createRoom()"
            >
                🖥️ CRÉER UN SALON
            </button>

            <button
                class="main-btn"
                onclick="showJoin()"
            >
                📱 REJOINDRE UN SALON
            </button>

        </div>


        <div
            id="joinForm"
            class="form-box hidden"
        >

            <input
                id="roomInput"
                maxlength="6"
                placeholder="CODE DU SALON"
                autocomplete="off"
            >

            <input
                id="nameInput"
                maxlength="18"
                placeholder="TON PRÉNOM"
                autocomplete="off"
            >

            <button
                class="main-btn create"
                onclick="joinRoom()"
            >
                REJOINDRE
            </button>

        </div>


        <div id="message"></div>

        <div class="small">
            2 à 10 joueurs
        </div>

    </div>

</section>



<!-- ========================================================
     APPLICATION
========================================================= -->

<section
    id="app"
    class="hidden"
>

    <header class="topbar">

        <div class="top-title">
            UNO
        </div>

        <div class="room-code">

            SALON :
            <strong id="roomCodeDisplay">
                ----
            </strong>

        </div>

    </header>


    <main id="gameArea">


        <!-- ==================================================
             LOBBY
        =================================================== -->

        <section id="lobby">

            <div
                class="big-room"
                id="lobbyCode"
            >
                ----
            </div>

            <div class="small">
                Donnez ce code aux autres joueurs
            </div>


            <div
                class="lobby-players"
                id="lobbyPlayers"
            >
            </div>


            <div id="hostControls">

                <button
                    class="start-btn"
                    onclick="startGame()"
                >
                    ▶ COMMENCER LA PARTIE
                </button>

            </div>

        </section>



        <!-- ==================================================
             MODE TV
        =================================================== -->

        <section
            id="tvMode"
            class="hidden"
        >

            <div
                class="players"
                id="tvPlayers"
            >
            </div>


            <div
                class="status"
                id="tvStatus"
            >
                En attente...
            </div>


            <div class="table">


                <div class="deck-zone">

                    <div class="zone-title">
                        PIOCHE
                    </div>

                    <div class="deck">
                    </div>

                </div>


                <div class="deck-zone">

                    <div class="zone-title">
                        DÉFAUSSE
                    </div>

                    <div id="tvDiscard">
                    </div>

                </div>


            </div>


            <div class="tv-actions">

                <button
                    class="start-btn hidden"
                    id="newGameBtn"
                    onclick="newGame()"
                >
                    🔄 NOUVELLE MANCHE
                </button>

            </div>

        </section>



        <!-- ==================================================
             MODE JOUEUR
        =================================================== -->

        <section
            id="playerMode"
            class="hidden"
        >

            <div class="player-info">

                <div
                    class="player-turn"
                    id="playerTurn"
                >
                    EN ATTENTE
                </div>

                <div
                    id="currentColor"
                >
                </div>

            </div>


            <div
                class="my-hand"
                id="myHand"
            >
            </div>


            <div class="controls">

                <button
                    class="action-btn"
                    id="drawBtn"
                    onclick="drawCard()"
                >
                    🃏 PIOCHER
                </button>


                <button
                    class="action-btn uno"
                    id="unoBtn"
                    onclick="callUno()"
                >
                    UNO !
                </button>

            </div>


            <div
                class="small"
                style="
                    text-align:center;
                    margin-bottom:15px;
                "
            >
                Clique sur une carte jouable pour la jouer.
            </div>

        </section>

    </main>

</section>



<!-- ========================================================
     MODAL CHOIX COULEUR
========================================================= -->

<div
    class="modal hidden"
    id="colorModal"
>

    <div class="modal-box">

        <h2>
            CHOISIS UNE COULEUR
        </h2>


        <div class="color-buttons">

            <button
                class="color-btn red-btn"
                onclick="chooseColor('red')"
            >
                🔴 ROUGE
            </button>


            <button

            >
                🟡 JAUNE
            </button>


            <button
                class="color-btn green-btn"
                onclick="chooseColor('green')"
            >
                🟢 VERT
            </button>


            <button
                class="color-btn blue-btn"
                onclick="chooseColor('blue')"
            >
                🔵 BLEU
            </button>

</div>



<!-- ========================================================
     MODAL VICTOIRE
========================================================= -->

<div
    id="victoryModal"
    class="hidden"
>

    <div class="victory-box">

        <div class="victory-content">


            <div class="victory-trophy">
                🏆
            </div>


            <div class="victory-title">
                VICTOIRE !
            </div>


            <div class="victory-subtitle">
                La manche est terminée !
            </div>


            <div
                id="victoryName"
                class="victory-name"
            >
                JOUEUR
            </div>


            <div
                id="victoryPoints"
                class="victory-points"
            >
                +0 points
            </div>


            <button
                id="victoryNewGame"
                class="victory-btn"
                onclick="newGame()"
            >
                🔄 NOUVELLE MANCHE
            </button>


            <div
                id="victoryWaiting"
                class="victory-waiting hidden"
            >
                En attente de l'hôte...
            </div>


        </div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const SERVER_URL =
    "wss://uno-jeux2soiree.onrender.com";


let socket = null;

let mode = null;

let room = null;

let playerName = null;

let playerId = null;

let gameState = null;

let pendingCardIndex = null;


/* =========================================================
   UTILITAIRES
========================================================= */

function $(id) {

    return document.getElementById(id);

}


function showMessage(text) {

    $("message").textContent =
        text || "";

}


/* =========================================================
   ACCUEIL
========================================================= */

function showJoin() {

    $("joinForm")
        .classList
        .remove("hidden");

    $("roomInput")
        .focus();

}


function createRoom() {

    mode = "tv";

    connect();

}


function joinRoom() {

    const roomValue =
        $("roomInput")
            .value
            .trim()
            .toUpperCase();


    const name =
        $("nameInput")
            .value
            .trim();


    if (!roomValue) {

        showMessage(
            "Entre le code du salon."
        );

        return;
    }


    if (!name) {

        showMessage(
            "Entre ton prénom."
        );

        return;
    }


    room =
        roomValue;

    playerName =
        name;

    mode =
        "player";


    connect();

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connect() {

    showMessage(
        "Connexion..."
    );


    try {

        socket =
            new WebSocket(
                SERVER_URL
            );

    } catch(e) {

        showMessage(
            "Impossible de se connecter au serveur."
        );

        return;
    }


    socket.onopen =
        () => {

            showMessage("");


            if (
                mode === "tv"
            ) {

                send({
                    type:
                        "create_room"
                });

            } else {

                send({

                    type:
                        "join_room",

                    room:
                        room,

                    name:
                        playerName

                });

            }

        };


    socket.onmessage =
        event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch(e) {

                return;
            }


            handleMessage(data);

        };


    socket.onclose =
        () => {

            if (
                !gameState ||
                gameState.status !==
                    "finished"
            ) {

                showMessage(
                    "Connexion au serveur perdue."
                );

            }

        };


    socket.onerror =
        () => {

            showMessage(
                "Erreur de connexion."
            );

        };

}


function send(data) {

    if (
        socket &&
        socket.readyState ===
            WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================================================
   MESSAGES SERVEUR
========================================================= */

function handleMessage(data) {

    switch(data.type) {


        /* -----------------------------------------
           SALON CRÉÉ
        ----------------------------------------- */

        case "room_created":

            room =
                data.room;

            openApp();

            break;


        /* -----------------------------------------
           JOINT
        ----------------------------------------- */

        case "joined":

            playerId =
                data.playerId;

            room =
                data.room;

            openApp();

            break;


        /* -----------------------------------------
           ÉTAT
        ----------------------------------------- */

        case "state":

            gameState =
                data.state;

            render();

            break;


        /* -----------------------------------------
           ERREUR
        ----------------------------------------- */

        case "error":

            showError(
                data.message
            );

            break;


        /* -----------------------------------------
           CHOIX COULEUR
        ----------------------------------------- */

        case "color_required":

            pendingCardIndex =
                data.cardIndex;

            $("colorModal")
                .classList
                .remove("hidden");

            break;


        /* -----------------------------------------
           FIN DE MANCHE
        ----------------------------------------- */

        case "round_end":

            showVictory(
                data.winner,
                data.points,
                data.score
            );

            break;


        /* -----------------------------------------
           FIN DE PARTIE
        ----------------------------------------- */

        case "game_end":

            showVictory(
                data.winner,
                data.points,
                data.score
            );

            break;

    }

}


/* =========================================================
   ERREUR
========================================================= */

function showError(message) {

    /*
       Remplace l'ancien alert() par un message
       navigateur plus discret lorsque possible.
    */

    alert(
        message ||
        "Une erreur est survenue."
    );

}


/* =========================================================
   OUVERTURE APP
========================================================= */

function openApp() {

    $("home")
        .classList
        .add("hidden");


    $("app")
        .classList
        .remove("hidden");


    $("roomCodeDisplay")
        .textContent =
        room;


    $("lobbyCode")
        .textContent =
        room;


    render();

}


/* =========================================================
   RENDER GLOBAL
========================================================= */

function render() {

    if (!gameState)
        return;


    if (
        gameState.status ===
        "waiting"
    ) {

        hideVictory();


        $("lobby")
            .classList
            .remove("hidden");


        $("tvMode")
            .classList
            .add("hidden");


        $("playerMode")
            .classList
            .add("hidden");


        renderLobby();

        return;
    }


    $("lobby")
        .classList
        .add("hidden");


    if (
        mode === "tv"
    ) {

        $("tvMode")
            .classList
            .remove("hidden");


        $("playerMode")
            .classList
            .add("hidden");


        renderTV();

    } else {

        $("playerMode")
            .classList
            .remove("hidden");


        $("tvMode")
            .classList
            .add("hidden");


        renderPlayer();

    }


    /*
       Si la manche est terminée,
       le modal reste visible.
    */

    if (
        gameState.status !==
        "finished"
    ) {

        hideVictory();

    }

}


/* =========================================================
   LOBBY
========================================================= */

function renderLobby() {

    const list =
        $("lobbyPlayers");


    list.innerHTML =
        "";


    gameState.players
        .forEach(
            player => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "lobby-player" +
                    (
                        player.host
                            ? " host"
                            : ""
                    );


                div.textContent =
                    player.name +
                    (
                        player.host
                            ? " 👑"
                            : ""
                    );


                list.appendChild(
                    div
                );

            }
        );


    if (
        mode === "tv"
    ) {

        $("hostControls")
            .classList
            .remove("hidden");

    } else {

        $("hostControls")
            .classList
            .add("hidden");

    }

}


/* =========================================================
   TV
========================================================= */

function renderTV() {

    const list =
        $("tvPlayers");


    list.innerHTML =
        "";


    gameState.players
        .forEach(
            player => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "player-box" +
                    (
                        player.id ===
                        gameState.currentPlayer
                            ? " active"
                            : ""
                    );


                div.innerHTML = `

                    <div class="player-name">
                        ${escapeHtml(
                            player.name
                        )}
                    </div>

                    <div class="card-count">
                        ${
                            player.cardCount
                        }
                        carte${
                            player.cardCount > 1
                                ? "s"
                                : ""
                        }
                    </div>

                `;


                list.appendChild(
                    div
                );

            }
        );


    if (
        gameState.currentPlayerName
    ) {

        $("tvStatus")
            .textContent =
            "Tour de " +
            gameState.currentPlayerName;

    } else {

        $("tvStatus")
            .textContent =
            "Partie terminée";

    }


    renderDiscard();


    if (
        gameState.status ===
        "finished"
    ) {

        $("newGameBtn")
            .classList
            .remove("hidden");

    } else {

        $("newGameBtn")
            .classList
            .add("hidden");

    }

}


/* =========================================================
   DÉFAUSSE TV
========================================================= */

function renderDiscard() {

    const container =
        $("tvDiscard");


    container.innerHTML =
        "";


    if (
        !gameState.discard
    )
        return;


    const card =
        createCardElement(
            gameState.discard
        );


    container.appendChild(
        card
    );

}


/* =========================================================
   JOUEUR
========================================================= */

function renderPlayer() {

    const me =
        gameState.me;


    if (!me)
        return;


    const myTurn =
        gameState.currentPlayer ===
        playerId;


    $("playerTurn")
        .textContent =

        myTurn

            ? "🔥 À TOI DE JOUER !"

            : "⏳ Tour de " +
              gameState.currentPlayerName;


    $("currentColor")
        .textContent =

        gameState.currentColor

            ? "🎨 Couleur : " +
              colorName(
                  gameState.currentColor
              )

            : "";


    renderHand(
        me.hand,
        myTurn
    );


    $("drawBtn")
        .disabled =

        !myTurn ||
        me.hasDrawn;


    $("unoBtn")
        .disabled =

        me.hand.length !== 1;

}


/* =========================================================
   MAIN
========================================================= */

function renderHand(
    hand,
    myTurn
) {

    const container =
        $("myHand");


    container.innerHTML =
        "";


    /*
       On conserve l'ordre reçu du serveur.
       Les cartes sont affichées avec les PNG réels.
    */

    hand.forEach(
        (
            card,
            index
        ) => {

            const element =
                createCardElement(
                    card
                );


            element.classList
                .add(
                    "hand-card"
                );


            if (
                myTurn &&
                isPlayable(card)
            ) {

                element.classList
                    .add(
                        "playable"
                    );

            }


            element.onclick =
                () => {

                    playCard(
                        index
                    );

                };


            container.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   NORMALISATION COULEUR
========================================================= */

function normalizeColor(
    color
) {

    if (!color)
        return "";


    return String(color)
        .toLowerCase()
        .trim();

}


/* =========================================================
   NOM COULEUR
========================================================= */

function colorName(
    color
) {

    const names = {

        red:
            "ROUGE",

        yellow:
            "JAUNE",

        green:
            "VERT",

        blue:
            "BLEU"

    };


    return (
        names[
            normalizeColor(color)
        ] || ""
    );

}


/* =========================================================
   FICHIERS PNG DES CARTES
========================================================= */

function cardImageCandidates(
    card
) {

    const color =
        normalizeColor(
            card.color
        );


    const candidates = [];


    /*
       ======================================================
       CARTES NUMÉRIQUES
       ======================================================

       IMPORTANT :

       Tes fichiers bleus comportent une anomalie :

       Blue- 12.png = BLEU 2
       Blue- 13.png = BLEU 3

       On traite donc ces deux cartes spécialement.
    */

    if (
        card.type === "number" ||
        (
            card.value !== undefined &&
            card.value !== null
        )
    ) {

        const value =
            Number(
                card.value
            );


        if (
            !Number.isNaN(value)
        ) {


            /*
               BLEU 2
            */

            if (
                color === "blue" &&
                value === 2
            ) {

                candidates.push(
                    "cards/Blue- 12.png"
                );

            }


            /*
               BLEU 3
            */

            else if (
                color === "blue" &&
                value === 3
            ) {

                candidates.push(
                    "cards/Blue- 13.png"
                );

            }


            /*
               AUTRES CARTES NUMÉRIQUES
            */

            else {

                const colorTitle =
                    color.charAt(0)
                    .toUpperCase() +
                    color.slice(1);


                candidates.push(

                    `cards/${colorTitle}- ${value}.png`,

                    `cards/${colorTitle}-${value}.png`

                );

            }

        }

    }


    /*
       ======================================================
       +2
       ======================================================
    */

    if (
        card.type === "draw2" ||
        card.type === "draw_2" ||
        card.type === "+2"
    ) {

        const colorTitle =
            color.charAt(0)
                .toUpperCase() +
            color.slice(1);


        candidates.push(

            `cards/${colorTitle} Draw2- 1.png`,

            `cards/${colorTitle} Draw2- 2.png`,

            `cards/${colorTitle} Draw2-1.png`,

            `cards/${colorTitle} Draw2-2.png`

        );

    }


    /*
       ======================================================
       REVERSE
       ======================================================
    */

    if (
        card.type === "reverse" ||
        card.type === "Reverse"
    ) {

        const colorTitle =
            color.charAt(0)
                .toUpperCase() +
            color.slice(1);


        candidates.push(

            `cards/${colorTitle} Reverse- 1.png`,

            `cards/${colorTitle} Reverse- 2.png`,

            `cards/${colorTitle} Reverse-1.png`,

            `cards/${colorTitle} Reverse-2.png`

        );

    }


    /*
       ======================================================
       SKIP
       ======================================================
    */

    if (
        card.type === "skip" ||
        card.type === "Skip"
    ) {

        const colorTitle =
            color.charAt(0)
                .toUpperCase() +
            color.slice(1);


        candidates.push(

            `cards/${colorTitle} Skip- 1.png`,

            `cards/${colorTitle} Skip- 2.png`,

            `cards/${colorTitle} Skip-1.png`,

            `cards/${colorTitle} Skip-2.png`

        );

    }


    /*
       ======================================================
       JOKER
       ======================================================
    */

    if (
        card.type === "wild" ||
        card.type === "Wild"
    ) {

        candidates.push(

            "cards/Wild-1.png",

            "cards/Wild-2.png",

            "cards/Wild-3.png",

            "cards/Wild-4.png"

        );

    }


    /*
       ======================================================
       +4
       ======================================================
    */

    if (
        card.type === "wild4" ||
        card.type === "draw4" ||
        card.type === "wild_draw4" ||
        card.type === "+4"
    ) {

        candidates.push(

            "cards/Draw4- 1.png",

            "cards/Draw4- 2.png",

            "cards/Draw4- 3.png",

            "cards/Draw4- 4.png",

            "cards/Draw4-1.png",

            "cards/Draw4-2.png",

            "cards/Draw4-3.png",

            "cards/Draw4-4.png"

        );

    }


    /*
       ======================================================
       NOM DE FICHIER FOURNI PAR LE SERVEUR
       ======================================================
    */

    if (
        typeof card.name ===
        "string"
    ) {

        const cleanName =
            card.name
                .replace(
                    /\.png$/i,
                    ""
                );


        candidates.push(
            `cards/${cleanName}.png`
        );

    }


    return [
        ...new Set(
            candidates
        )
    ];

}


/* =========================================================
   CRÉATION D'UNE CARTE
========================================================= */

function createCardElement(
    card
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "card";


    /*
       Fallback visuel si le PNG
       n'est pas trouvé.
    */

    const fallback =
        document.createElement(
            "div"
        );


    fallback.className =
        "card-fallback";


    fallback.textContent =
        getCardLabel(
            card
        );


    div.appendChild(
        fallback
    );


    const candidates =
        cardImageCandidates(
            card
        );


    tryLoadCardImage(
        div,
        fallback,
        candidates,
        0
    );


    return div;

}


/* =========================================================
   CHARGEMENT IMAGE AVEC FALLBACK
========================================================= */

function tryLoadCardImage(
    container,
    fallback,
    candidates,
    index
) {

    if (
        index >=
        candidates.length
    ) {

        fallback.style
            .display =
            "flex";

        return;
    }


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "card-image";


    img.alt =
        "";


    img.onload =
        () => {

            fallback.style
                .display =
                "none";

            container
                .appendChild(
                    img
                );

        };


    img.onerror =
        () => {

            tryLoadCardImage(

                container,

                fallback,

                candidates,

                index + 1

            );

        };


    /*
       encodeURI conserve le nom de fichier
       tout en gérant correctement les espaces.
    */

    img.src =
        encodeURI(
            candidates[index]
        );

}


/* =========================================================
   TEXTE FALLBACK
========================================================= */

function getCardLabel(
    card
) {

    if (
        card.type === "number"
    ) {

        return String(
            card.value
        );

    }


    switch(card.type) {

        case "skip":
            return "⛔";

        case "reverse":
            return "↔";

        case "draw2":
            return "+2";

        case "wild":
            return "★";

        case "wild4":
            return "+4";

        default:
            return "?";

    }

}


/* =========================================================
   JOUER CARTE
========================================================= */

function playCard(
    index
) {

    if (
        !gameState ||
        !gameState.me
    )
        return;


    const card =
        gameState.me.hand[index];


    if (!card)
        return;


    if (
        !isPlayable(card)
    )
        return;


    if (
        card.type === "wild" ||
        card.type === "wild4"
    ) {

        pendingCardIndex =
            index;


        $("colorModal")
            .classList
            .remove("hidden");


        return;
    }


    send({

        type:
            "play_card",

        index:
            index

    });

}


/* =========================================================
   CHOIX COULEUR
========================================================= */

function chooseColor(
    color
) {

    $("colorModal")
        .classList
        .add("hidden");


    if (
        pendingCardIndex === null
    )
        return;


    send({

        type:
            "play_card",

        index:
            pendingCardIndex,

        color:
            color

    });


    pendingCardIndex =
        null;

}


/* =========================================================
   FERMER MODAL COULEUR
   Si l'utilisateur clique hors de la boîte,
   il peut simplement annuler.
========================================================= */

$("colorModal")
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                $("colorModal")
            ) {

                pendingCardIndex =
                    null;

                $("colorModal")
                    .classList
                    .add("hidden");

            }

        }
    );


/* =========================================================
   PIOCHE
========================================================= */

function drawCard() {

    send({

        type:
            "draw"

    });

}


/* =========================================================
   UNO
========================================================= */

function callUno() {

    send({

        type:
            "uno"

    });

}


/* =========================================================
   SALON
========================================================= */

function startGame() {

    send({

        type:
            "start_game"

    });

}


function newGame() {

    hideVictory();


    send({

        type:
            "new_game"

    });

}


/* =========================================================
   CARTE JOUABLE
========================================================= */

function isPlayable(
    card
) {

    if (!gameState)
        return false;


    const discard =
        gameState.discard;


    if (!discard)
        return true;


    /*
       Joker
    */

    if (
        card.type === "wild"
    )
        return true;


    /*
       +4
    */

    if (
        card.type === "wild4"
    ) {

        return !!(
            gameState.canPlayWild4
        );

    }


    /*
       Même couleur
    */

    if (
        card.color ===
        gameState.currentColor
    ) {

        return true;

    }


    /*
       Même type d'action
    */

    if (
        card.type ===
            discard.type &&
        card.type !== "number"
    ) {

        return true;

    }


    /*
       Même numéro
    */

    if (
        card.type === "number" &&
        discard.type === "number" &&
        Number(card.value) ===
        Number(discard.value)
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   VICTOIRE
========================================================= */

function showVictory(
    winner,
    points,
    score
) {

    $("victoryName")
        .textContent =
        winner ||
        "JOUEUR";


    const earned =
        Number(points) || 0;


    $("victoryPoints")
        .textContent =
        "+" +
        earned +
        " points";


    /*
       L'hôte est le seul à pouvoir
       lancer la nouvelle manche.
    */

    let isHost =
        mode === "tv";


    if (
        gameState &&
        gameState.players
    ) {

        const me =
            gameState.players.find(
                player =>
                    player.id ===
                    playerId
            );


        if (me) {

            isHost =
                !!me.host;

        }

    }


    if (isHost) {

        $("victoryNewGame")
            .classList
            .remove("hidden");


        $("victoryWaiting")
            .classList
            .add("hidden");

    } else {

        $("victoryNewGame")
            .classList
            .add("hidden");


        $("victoryWaiting")
            .classList
            .remove("hidden");

    }


    createVictoryConfetti();


    $("victoryModal")
        .classList
        .remove("hidden");

}


/* =========================================================
   FERMER VICTOIRE
========================================================= */

function hideVictory() {

    $("victoryModal")
        .classList
        .add("hidden");

}


/* =========================================================
   CONFETTIS
========================================================= */

function createVictoryConfetti() {

    const box =
        document.querySelector(
            ".victory-box"
        );


    if (!box)
        return;


    box.querySelectorAll(
        ".confetti"
    ).forEach(
        element => {

            element.remove();

        }
    );


    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const confetti =
            document.createElement(
                "div"
            );


        confetti.className =
            "confetti";


        confetti.style.left =
            (
                Math.random() * 100
            ) +
            "%";


        confetti.style.top =
            (
                Math.random() * -100
            ) +
            "px";


        confetti.style.animationDelay =
            (
                Math.random() * 1.5
            ) +
            "s";


        confetti.style.animationDuration =
            (
                1.8 +
                Math.random() * 1.7
            ) +
            "s";


        confetti.style.width =
            (
                6 +
                Math.random() * 8
            ) +
            "px";


        confetti.style.height =
            (
                6 +
                Math.random() * 12
            ) +
            "px";


        box.appendChild(
            confetti
        );

    }

}


/* =========================================================
   SÉCURITÉ AFFICHAGE
========================================================= */

function escapeHtml(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   CLAVIER
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
           Entrée dans le formulaire
        */

        if (
            event.key === "Enter" &&
            !$("joinForm")
                .classList
                .contains("hidden")
        ) {

            if (
                document.activeElement ===
                    $("roomInput") ||
                document.activeElement ===
                    $("nameInput")
            ) {

                joinRoom();

            }

        }


        /*
           Échap = fermer choix couleur
        */

        if (
            event.key === "Escape"
        ) {

            pendingCardIndex =
                null;

            $("colorModal")
                .classList
                .add("hidden");

        }

    }
);

</script>
