<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>UNO • Jeux2Soirée</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    background: #080a0f;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;

    background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        #090b12;

    background-size: 25px 25px;

    color: white;
    font-family: 'VT323', monospace;

    overflow-x: hidden;
    overscroll-behavior: none;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.018) 0px,
            rgba(255,255,255,.018) 1px,
            transparent 2px,
            transparent 5px
        );

    z-index: 9999;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
    touch-action: manipulation;
}

.hidden {
    display: none !important;
}


/* =========================================================
   ACCUEIL
========================================================= */

#home {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.home-box {
    width: 100%;
    max-width: 680px;

    padding: 35px;

    background: #10131d;

    border: 3px solid white;

    box-shadow:
        8px 8px 0 #000,
        0 0 30px rgba(255,48,95,.12);

    text-align: center;
}

.logo {
    font-family: 'Press Start 2P';

    font-size: clamp(30px, 7vw, 60px);

    margin-bottom: 15px;

    text-shadow:
        4px 4px 0 #000;
}

.logo span {
    color: #ff305f;
}

.subtitle {
    font-size: 28px;
    margin-bottom: 30px;
}

.menu {
    display: grid;
    gap: 14px;
}

.main-btn {
    width: 100%;

    min-height: 62px;

    border: 3px solid white;

    background: #171b28;
    color: white;

    padding: 15px;

    font-size: 25px;

    box-shadow: 5px 5px 0 #000;

    transition:
        transform .12s,
        background .12s,
        color .12s;
}

.main-btn:hover {
    transform: translate(-3px,-3px);

    background: white;
    color: #111;
}

.main-btn:active {
    transform: translate(2px,2px);
    box-shadow: 2px 2px 0 #000;
}

.main-btn.create {
    background: #e92852;
}

.form-box {
    margin-top: 22px;

    display: grid;
    gap: 12px;
}

input {
    width: 100%;

    min-height: 58px;

    padding: 14px;

    background: #080a10;

    border: 3px solid white;

    color: white;

    font-size: 25px;

    outline: none;

    text-align: center;
}

input::placeholder {
    color: rgba(255,255,255,.55);
}

input:focus {
    border-color: #ff315e;
}

.small {
    font-size: 21px;
    opacity: .8;
}

#message {
    min-height: 30px;

    margin: 14px 0 5px;

    text-align: center;

    font-size: 23px;

    color: #ffdc32;
}


/* =========================================================
   APPLICATION
========================================================= */

#app {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;
}

.topbar {
    min-height: 68px;

    border-bottom: 3px solid white;

    background: #10131d;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding:
        8px
        max(12px, env(safe-area-inset-right))
        8px
        max(12px, env(safe-area-inset-left));

    position: sticky;
    top: 0;

    z-index: 100;
}

.top-title {
    font-family: 'Press Start 2P';

    font-size: 19px;
}

.room-code {
    border: 2px solid white;

    padding: 7px 12px;

    font-size: 21px;

    white-space: nowrap;
}

#gameArea {
    flex: 1;

    padding:
        18px
        max(18px, env(safe-area-inset-right))
        30px
        max(18px, env(safe-area-inset-left));
}


/* =========================================================
   LOBBY
========================================================= */

#lobby {
    width: 100%;
    max-width: 800px;

    margin: auto;

    text-align: center;
}

.big-room {
    font-family: 'Press Start 2P';

    font-size: clamp(40px, 12vw, 85px);

    margin: 25px 0;

    color: #ff315e;

    text-shadow:
        5px 5px 0 #000,
        0 0 20px rgba(255,49,94,.5);
}

.lobby-players {
    display: grid;
    gap: 8px;

    margin: 20px 0;
}

.lobby-player {
    background: #151925;

    border: 2px solid #555;

    padding: 13px;

    font-size: 25px;
}

.lobby-player.host {
    border-color: #ffd928;

    box-shadow:
        0 0 10px rgba(255,217,40,.2);
}

.start-btn {
    min-height: 58px;

    padding: 13px 28px;

    background: white;
    color: #111;

    border: 3px solid white;

    font-size: 24px;

    box-shadow: 5px 5px 0 #000;

    touch-action: manipulation;
}

.start-btn:active {
    transform: translate(2px,2px);
    box-shadow: 2px 2px 0 #000;
}


/* =========================================================
   TV MODE
========================================================= */

#tvMode {
    display: flex;

    flex-direction: column;

    min-height: calc(100vh - 100px);
    min-height: calc(100dvh - 100px);
}

.players {
    display: flex;

    gap: 12px;

    justify-content: center;

    flex-wrap: wrap;

    margin-bottom: 12px;
}

.player-box {
    background: #121622;

    border: 2px solid #555;

    padding: 9px 18px;

    min-width: 130px;

    text-align: center;

    transition: .2s;
}

.player-box.active {
    border-color: white;

    box-shadow:
        0 0 20px rgba(255,255,255,.45);

    transform: translateY(-4px);
}

.player-name {
    font-size: 23px;
}

.card-count {
    font-size: 20px;
    opacity: .75;
}

.status {
    text-align: center;

    font-size: 31px;

    margin: 12px;
}

.table {
    flex: 1;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: clamp(25px, 6vw, 70px);

    min-height: 380px;
}

.deck-zone {
    text-align: center;
}

.zone-title {
    font-size: 25px;

    margin-bottom: 10px;
}

.deck {
    width: 125px;
    height: 178px;

    border-radius: 16px;

    border: 4px solid white;

    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    box-shadow:
        7px 7px 0 rgba(0,0,0,.5);
}

.deck::before {
    content: "";

    position: absolute;

    inset: 8px;

    border: 2px solid rgba(255,255,255,.65);

    border-radius: 11px;

    transform: rotate(-8deg);
}

.deck::after {
    content: "UNO";

    position: relative;

    color: white;

    font-family: 'Press Start 2P';

    font-size: 21px;

    padding: 9px;

    background: #e92852;

    border: 2px solid white;

    transform: rotate(-25deg);

    z-index: 2;
}

.tv-discard-card {
    width: 125px !important;
    height: 178px !important;
}

.tv-actions {
    text-align: center;

    padding: 15px;
}


/* =========================================================
   CARTES UNO
========================================================= */

.card {
    --card-color: #151820;

    width: 125px;
    height: 178px;

    flex: 0 0 auto;

    position: relative;

    border-radius: 15px;

    border: 4px solid white;

    background: var(--card-color);

    color: white;

    overflow: hidden;

    user-select: none;

    box-shadow:
        5px 5px 0 rgba(0,0,0,.45);

    font-family: Arial, Helvetica, sans-serif;

    transition:
        transform .16s,
        box-shadow .16s;
}


/* couleurs */

.card.red {
    --card-color: #ed1b2f;
}

.card.yellow {
    --card-color: #ffd814;

    color: #111;
}

.card.green {
    --card-color: #5baa22;
}

.card.blue {
    --card-color: #0969c7;
}

.card.black {
    --card-color: #17191e;
}


/* fond intérieur blanc façon carte UNO */

.card::before {
    content: "";

    position: absolute;

    width: 112%;
    height: 72%;

    left: -6%;
    top: 14%;

    background: rgba(255,255,255,.94);

    border-radius: 50%;

    transform: rotate(-18deg);

    opacity: .98;
}

.card::after {
    content: "";

    position: absolute;

    width: 108%;
    height: 66%;

    left: -4%;
    top: 18%;

    background: var(--card-color);

    border-radius: 50%;

    transform: rotate(-18deg);
}


/* contenu */

.card-content {
    position: absolute;

    inset: 0;

    z-index: 5;
}


/* coins */

.card-corner {
    position: absolute;

    z-index: 8;

    font-family: Arial, Helvetica, sans-serif;

    font-weight: 900;

    font-size: 24px;

    line-height: 1;

    text-shadow:
        1px 1px 0 rgba(0,0,0,.25);
}

.card.yellow .card-corner {
    color: #111;
    text-shadow: none;
}

.card-corner.top {
    top: 7px;
    left: 8px;
}

.card-corner.bottom {
    right: 8px;
    bottom: 7px;

    transform: rotate(180deg);
}


/* symbole central */

.card-symbol {
    position: absolute;

    z-index: 8;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-family: Arial, Helvetica, sans-serif;

    font-weight: 900;

    font-size: 65px;

    line-height: 1;

    color: white;

    text-shadow:
        2px 2px 0 rgba(0,0,0,.45),
        -1px -1px 0 rgba(0,0,0,.25);

    white-space: nowrap;
}

.card.yellow .card-symbol {
    color: #111;

    text-shadow:
        1px 1px 0 rgba(255,255,255,.5);
}


/* cartes action */

.card.action .card-symbol {
    font-size: 52px;
}

.card.draw2 .card-symbol {
    font-size: 45px;
}

.card.wild .card-symbol,
.card.wild4 .card-symbol {
    font-size: 42px;
}


/* =========================================================
   WILD
========================================================= */

.card.wild,
.card.wild4 {
    background: #151820;
}

.card.wild::before,
.card.wild4::before {
    background:
        conic-gradient(
            #ed1b2f 0deg 90deg,
            #ffd814 90deg 180deg,
            #5baa22 180deg 270deg,
            #0969c7 270deg 360deg
        );

    width: 130%;
    height: 85%;

    left: -15%;
    top: 7%;

    transform: rotate(-18deg);

    border-radius: 50%;
}

.card.wild::after,
.card.wild4::after {
    background: #151820;

    width: 65%;
    height: 55%;

    left: 17.5%;
    top: 22.5%;

    border-radius: 50%;
}


/* +4 */

.card.wild4 .card-symbol {
    color: white;

    font-size: 35px;

    background: #151820;

    padding: 5px 7px;

    border-radius: 8px;
}


/* =========================================================
   IMAGES DE CARTES
========================================================= */

.card-image {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 20;

    display: none;

    background: white;
}

.card.has-image .card-image {
    display: block;
}

.card.has-image::before,
.card.has-image::after {
    display: none;
}


/* =========================================================
   MODE JOUEUR
========================================================= */

#playerMode {
    width: 100%;
    max-width: 1100px;

    margin: auto;

    display: flex;
    flex-direction: column;
}


/* statut */

.player-info {
    text-align: center;

    margin-bottom: 12px;
}

.player-turn {
    font-family: 'Press Start 2P';

    font-size: clamp(15px, 3vw, 23px);

    line-height: 1.5;

    margin: 8px;

    min-height: 30px;
}

.player-turn.my-turn {
    color: #ffdc32;

    text-shadow:
        0 0 12px rgba(255,220,50,.7);
}

.player-turn.other-turn {
    opacity: .8;
}

#currentColor {
    font-size: 22px;

    min-height: 25px;
}


/* =========================================================
   TABLE TELEPHONE
========================================================= */

.mobile-table {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 25px;

    margin: 8px 0 12px;
}

.mobile-zone {
    text-align: center;
}

.mobile-zone-title {
    font-size: 18px;

    opacity: .75;

    margin-bottom: 6px;
}

.mobile-card {
    width: 85px !important;
    height: 122px !important;

    border-width: 3px;

    border-radius: 11px;
}

.mobile-card .card-symbol {
    font-size: 43px;
}

.mobile-card.action .card-symbol {
    font-size: 34px;
}

.mobile-card.draw2 .card-symbol {
    font-size: 30px;
}

.mobile-card .card-corner {
    font-size: 16px;

    top: 5px;
    left: 6px;
}

.mobile-card .card-corner.bottom {
    right: 6px;
    bottom: 5px;
}


/* =========================================================
   MAIN DU JOUEUR
========================================================= */

.hand-title {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin: 10px 0 6px;

    font-size: 22px;
}

.hand-count {
    opacity: .65;

    font-size: 20px;
}


/* zone scroll */

.hand-wrapper {
    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    padding:
        10px
        5px
        18px;

    scrollbar-width: thin;

    overscroll-behavior-x: contain;

    -webkit-overflow-scrolling: touch;
}

.hand-wrapper::-webkit-scrollbar {
    height: 7px;
}

.hand-wrapper::-webkit-scrollbar-track {
    background: #11151e;
}

.hand-wrapper::-webkit-scrollbar-thumb {
    background: #555;

    border-radius: 10px;
}


/* main */

.my-hand {
    display: flex;

    align-items: flex-end;

    justify-content: flex-start;

    gap: 8px;

    width: max-content;

    min-width: 100%;

    padding:
        5px
        8px
        8px;
}


/* carte dans la main */

.hand-card {
    width: 76px;
    height: 110px;

    border-width: 3px;

    border-radius: 10px;

    cursor: pointer;

    transform-origin: bottom center;

    transition:
        transform .12s,
        box-shadow .12s,
        opacity .12s;
}

.hand-card .card-corner {
    font-size: 15px;

    top: 4px;
    left: 5px;
}

.hand-card .card-corner.bottom {
    right: 5px;
    bottom: 4px;
}

.hand-card .card-symbol {
    font-size: 50px;
}

.hand-card.action .card-symbol {
    font-size: 37px;
}

.hand-card.draw2 .card-symbol {
    font-size: 30px;
}

.hand-card.wild .card-symbol,
.hand-card.wild4 .card-symbol {
    font-size: 27px;
}


/* carte jouable */

.hand-card.playable {
    box-shadow:
        0 0 0 3px #fff,
        0 0 18px 4px rgba(255,255,255,.75),
        5px 5px 0 rgba(0,0,0,.45);

    animation:
        playablePulse 1.3s infinite;
}

@keyframes playablePulse {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

.hand-card:active {
    transform: translateY(-15px) scale(1.03);

    animation: none;
}


/* cartes non jouables */

.hand-card.not-playable {
    opacity: .65;

    filter: saturate(.7);
}


/* =========================================================
   CONTROLES
========================================================= */

.controls {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    width: 100%;

    margin: 5px 0 10px;
}

.action-btn {
    min-height: 62px;

    padding: 12px 15px;

    background: #161a26;

    border: 3px solid white;

    color: white;

    font-size: 24px;

    box-shadow: 4px 4px 0 #000;

    touch-action: manipulation;
}

.action-btn:active:not(:disabled) {
    transform: translate(2px,2px);

    box-shadow: 1px 1px 0 #000;
}

.action-btn.uno {
    background: #e92852;
}

.action-btn:disabled {
    opacity: .32;

    cursor: not-allowed;

    box-shadow: 2px 2px 0 #000;
}


/* =========================================================
   MESSAGE MOBILE
========================================================= */

.mobile-help {
    text-align: center;

    font-size: 19px;

    opacity: .7;

    margin-top: 2px;
}


/* =========================================================
   MODAL COULEUR
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.88);

    display: flex;

    justify-content: center;
    align-items: center;

    z-index: 5000;

    padding: 18px;
}

.modal-box {
    width: 100%;

    max-width: 500px;

    background: #10131d;

    border: 3px solid white;

    padding: 25px;

    text-align: center;

    box-shadow:
        8px 8px 0 #000;
}

.modal-box h2 {
    font-family: 'Press Start 2P';

    font-size: clamp(16px, 4vw, 22px);

    line-height: 1.5;

    margin-top: 0;
}

.color-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-top: 22px;
}

.color-btn {
    min-height: 72px;

    border: 3px solid white;

    font-size: 25px;

    font-weight: bold;

    box-shadow:
        4px 4px 0 #000;

    touch-action: manipulation;
}

.color-btn:active {
    transform: translate(2px,2px);

    box-shadow: 1px 1px 0 #000;
}

.red-btn {
    background: #ed1b2f;
    color: white;
}

.yellow-btn {
    background: #ffd814;
    color: #111;
}

.green-btn {
    background: #5baa22;
    color: white;
}

.blue-btn {
    background: #0969c7;
    color: white;
}


/* =========================================================
   TABLETTE
========================================================= */

@media (min-width: 601px) and (max-width: 1000px) {

    .hand-card {
        width: 72px;
        height: 105px;
    }

}


/* =========================================================
   TELEPHONE
========================================================= */

@media (max-width: 600px) {

    body {
        background-size: 20px 20px;
    }

    #home {
        padding: 12px;
    }

    .home-box {
        padding: 25px 18px;

        box-shadow:
            5px 5px 0 #000;
    }

    .subtitle {
        font-size: 23px;

        margin-bottom: 23px;
    }

    .main-btn {
        min-height: 62px;

        font-size: 21px;
    }

    .topbar {
        min-height: 56px;
    }

    .top-title {
        font-size: 13px;
    }

    .room-code {
        font-size: 17px;

        padding: 6px 9px;
    }

    #gameArea {
        padding:
            10px
            max(10px, env(safe-area-inset-right))
            20px
            max(10px, env(safe-area-inset-left));
    }

    .player-turn {
        font-size: 15px;

        margin: 4px;
    }

    #currentColor {
        font-size: 19px;
    }

    .mobile-table {
        gap: 18px;

        margin-top: 5px;
    }

    .mobile-card {
        width: 72px !important;
        height: 103px !important;
    }

    .mobile-card .card-symbol {
        font-size: 37px;
    }

    .mobile-card.action .card-symbol {
        font-size: 29px;
    }

    .mobile-card.draw2 .card-symbol {
        font-size: 25px;
    }

    .hand-title {
        font-size: 20px;
    }

    .hand-count {
        font-size: 18px;
    }

    .hand-wrapper {
        margin-left: -5px;

        width: calc(100% + 10px);
    }

    .hand-card {
        width: 68px;
        height: 99px;
    }

    .hand-card .card-symbol {
        font-size: 44px;
    }

    .hand-card.action .card-symbol {
        font-size: 33px;
    }

    .hand-card.draw2 .card-symbol {
        font-size: 27px;
    }

    .controls {
        position: sticky;

        bottom: 0;

        z-index: 50;

        background:
            linear-gradient(
                to bottom,
                transparent,
                #090b12 18%
            );

        padding:
            12px 0
            max(6px, env(safe-area-inset-bottom));
    }

    .action-btn {
        min-height: 58px;

        font-size: 22px;
    }

    .mobile-help {
        font-size: 17px;
    }

    .color-buttons {
        gap: 9px;
    }

    .color-btn {
        min-height: 68px;

        font-size: 21px;
    }

}


/* =========================================================
   PETITS TELEPHONES
========================================================= */

@media (max-width: 380px) {

    .hand-card {
        width: 61px;
        height: 90px;
    }

    .hand-card .card-symbol {
        font-size: 39px;
    }

    .hand-card.action .card-symbol {
        font-size: 29px;
    }

    .hand-card.draw2 .card-symbol {
        font-size: 24px;
    }

    .action-btn {
        font-size: 19px;
    }

}


/* =========================================================
   PAYSAGE TELEPHONE
========================================================= */

@media (max-height: 500px) and (orientation: landscape) {

    .topbar {
        min-height: 48px;
    }

    #gameArea {
        padding-top: 6px;
    }

    .player-info {
        margin-bottom: 3px;
    }

    .mobile-table {
        margin: 2px 0;
    }

    .mobile-card {
        width: 60px !important;
        height: 86px !important;
    }

    .hand-wrapper {
        padding-bottom: 8px;
    }

    .hand-card {
        width: 58px;
        height: 84px;
    }

    .controls {
        margin-top: 0;
    }

    .action-btn {
        min-height: 46px;
        padding: 6px;
    }

}

</style>
</head>


<body>


<!-- ========================================================
     ACCUEIL
========================================================= -->

<section id="home">

    <div class="home-box">

        <div class="logo">
            <span>UNO</span>
        </div>

        <div class="subtitle">
            Jeux2Soirée • Multijoueur
        </div>


        <div class="menu">

            <button
                class="main-btn create"
                onclick="createRoom()"
            >
                🖥️ CRÉER UN SALON
            </button>


            <button
                class="main-btn"
                onclick="showJoin()"
            >
                📱 REJOINDRE UN SALON
            </button>

        </div>


        <div
            id="joinForm"
            class="form-box hidden"
        >

            <input
                id="roomInput"
                maxlength="6"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="CODE DU SALON"
            >


            <input
                id="nameInput"
                maxlength="18"
                autocomplete="off"
                placeholder="TON PRÉNOM"
            >


            <button
                class="main-btn create"
                onclick="joinRoom()"
            >
                REJOINDRE
            </button>

        </div>


        <div id="message"></div>


        <div class="small">
            2 à 10 joueurs
        </div>

    </div>

</section>



<!-- ========================================================
     APPLICATION
========================================================= -->

<section
    id="app"
    class="hidden"
>


    <!-- TOPBAR -->

    <header class="topbar">

        <div class="top-title">
            UNO
        </div>

        <div class="room-code">
            SALON :
            <strong id="roomCodeDisplay">
                ----
            </strong>
        </div>

    </header>



    <main id="gameArea">


        <!-- =================================================
             LOBBY
        ================================================== -->

        <section id="lobby">

            <div
                class="big-room"
                id="lobbyCode"
            >
                ----
            </div>


            <div class="small">
                Donnez ce code aux autres joueurs
            </div>


            <div
                class="lobby-players"
                id="lobbyPlayers"
            >
            </div>


            <div id="hostControls">

                <button
                    class="start-btn"
                    onclick="startGame()"
                >
                    ▶ COMMENCER LA PARTIE
                </button>

            </div>

        </section>



        <!-- =================================================
             MODE TV
        ================================================== -->

        <section
            id="tvMode"
            class="hidden"
        >


            <div
                class="players"
                id="tvPlayers"
            >
            </div>


            <div
                class="status"
                id="tvStatus"
            >
                En attente...
            </div>


            <div class="table">


                <!-- PIOCHE -->

                <div class="deck-zone">

                    <div class="zone-title">
                        PIOCHE
                    </div>

                    <div class="deck"></div>

                </div>


                <!-- DEFAUSSE -->

                <div class="deck-zone">

                    <div class="zone-title">
                        DÉFAUSSE
                    </div>

                    <div id="tvDiscard"></div>

                </div>


            </div>


            <div class="tv-actions">

                <button
                    class="start-btn hidden"
                    id="newGameBtn"
                    onclick="newGame()"
                >
                    🔄 NOUVELLE MANCHE
                </button>

            </div>

        </section>



        <!-- =================================================
             MODE JOUEUR
        ================================================== -->

        <section
            id="playerMode"
            class="hidden"
        >


            <!-- STATUT -->

            <div class="player-info">

                <div
                    class="player-turn"
                    id="playerTurn"
                >
                    EN ATTENTE
                </div>

                <div id="currentColor"></div>

            </div>



            <!-- TABLE CENTRALE -->

            <div class="mobile-table">


                <!-- PIOCHE -->

                <div class="mobile-zone">

                    <div class="mobile-zone-title">
                        PIOCHE
                    </div>

                    <div class="deck mobile-card"></div>

                </div>


                <!-- DEFAUSSE -->

                <div class="mobile-zone">

                    <div class="mobile-zone-title">
                        DÉFAUSSE
                    </div>

                    <div id="mobileDiscard"></div>

                </div>

            </div>



            <!-- TITRE MAIN -->

            <div class="hand-title">

                <span>
                    🎴 TA MAIN
                </span>

                <span
                    class="hand-count"
                    id="handCount"
                >
                    0 carte
                </span>

            </div>



            <!-- MAIN DEFILANTE -->

            <div class="hand-wrapper">

                <div
                    class="my-hand"
                    id="myHand"
                >
                </div>

            </div>



            <!-- ACTIONS -->

            <div class="controls">


                <button
                    class="action-btn"
                    id="drawBtn"
                    onclick="drawCard()"
                >
                    🃏 PIOCHER
                </button>


                <button
                    class="action-btn uno"
                    id="unoBtn"
                    onclick="callUno()"
                >
                    UNO !
                </button>

            </div>


            <div class="mobile-help">
                👆 Fais glisser ta main pour voir toutes tes cartes
            </div>

        </section>


    </main>

</section>



<!-- ========================================================
     MODAL CHOIX COULEUR
========================================================= -->

<div
    class="modal hidden"
    id="colorModal"
>

    <div class="modal-box">

        <h2>
            CHOISIS UNE COULEUR
        </h2>


        <div class="color-buttons">


            <button
                class="color-btn red-btn"
                onclick="chooseColor('red')"
            >
                🔴 ROUGE
            </button>


            <button
                class="color-btn yellow-btn"
                onclick="chooseColor('yellow')"
            >
                🟡 JAUNE
            </button>


            <button
                class="color-btn green-btn"
                onclick="chooseColor('green')"
            >
                🟢 VERT
            </button>


            <button
                class="color-btn blue-btn"
                onclick="chooseColor('blue')"
            >
                🔵 BLEU
            </button>


        </div>

    </div>

</div>



<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const SERVER_URL =
    "wss://uno-jeux2soiree.onrender.com";


/*
    Si tu exportes les vraies cartes depuis Figma
    dans /uno/cards/, passe cette valeur à true.

    Exemple :

    cards/red-1.png
    cards/red-2.png
    cards/red-skip.png
    cards/red-reverse.png
    cards/red-draw2.png
    cards/wild.png
    cards/wild4.png
*/

const USE_CARD_ASSETS = false;


/* =========================================================
   VARIABLES
========================================================= */

let socket = null;

let mode = null;

let room = null;

let playerName = null;

let playerId = null;

let gameState = null;

let pendingCardIndex = null;


/* =========================================================
   UTILITAIRES
========================================================= */

function $(id) {

    return document.getElementById(id);

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text) {

    $("message").textContent = text;

}


/* =========================================================
   ACCUEIL
========================================================= */

function showJoin() {

    $("joinForm")
        .classList.remove("hidden");

    setTimeout(() => {

        $("roomInput").focus();

    }, 50);

}


function createRoom() {

    mode = "tv";

    connect();

}


function joinRoom() {

    const roomValue =
        $("roomInput")
            .value
            .trim()
            .toUpperCase();

    const name =
        $("nameInput")
            .value
            .trim();


    if (!roomValue) {

        showMessage(
            "Entre le code du salon."
        );

        return;

    }


    if (!name) {

        showMessage(
            "Entre ton prénom."
        );

        return;

    }


    room = roomValue;

    playerName = name;

    mode = "player";

    connect();

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connect() {

    showMessage("Connexion...");


    try {

        socket =
            new WebSocket(
                SERVER_URL
            );

    }

    catch (e) {

        showMessage(
            "Impossible de se connecter au serveur."
        );

        return;

    }


    socket.onopen = () => {

        showMessage("");


        if (mode === "tv") {

            send({
                type: "create_room"
            });

        }

        else {

            send({

                type: "join_room",

                room: room,

                name: playerName

            });

        }

    };


    socket.onmessage = event => {

        let data;


        try {

            data =
                JSON.parse(
                    event.data
                );

        }

        catch (e) {

            return;

        }


        handleMessage(data);

    };


    socket.onclose = () => {

        if (
            !gameState ||
            gameState.status !== "finished"
        ) {

            showMessage(
                "Connexion au serveur perdue."
            );

        }

    };


    socket.onerror = () => {

        showMessage(
            "Erreur de connexion."
        );

    };

}


/* =========================================================
   ENVOI
========================================================= */

function send(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================================================
   MESSAGES SERVEUR
========================================================= */

function handleMessage(data) {

    switch(data.type) {


        case "room_created":

            room =
                data.room;

            openApp();

            break;


        case "joined":

            playerId =
                data.playerId;

            room =
                data.room;

            openApp();

            break;


        case "state":

            gameState =
                data.state;

            render();

            break;


        case "error":

            alert(
                data.message
            );

            break;


        case "color_required":

            pendingCardIndex =
                data.cardIndex;

            $("colorModal")
                .classList
                .remove("hidden");

            break;


        case "round_end":

            alert(
                data.winner +
                " remporte la manche !"
            );

            break;


        case "game_end":

            alert(
                data.winner +
                " remporte la partie !"
            );

            break;

    }

}


/* =========================================================
   OUVERTURE APP
========================================================= */

function openApp() {

    $("home")
        .classList
        .add("hidden");


    $("app")
        .classList
        .remove("hidden");


    $("roomCodeDisplay")
        .textContent =
        room;


    $("lobbyCode")
        .textContent =
        room;


    render();

}


/* =========================================================
   RENDER GLOBAL
========================================================= */

function render() {

    if (!gameState) {

        return;

    }


    if (
        gameState.status === "waiting"
    ) {

        $("lobby")
            .classList
            .remove("hidden");


        $("tvMode")
            .classList
            .add("hidden");


        $("playerMode")
            .classList
            .add("hidden");


        renderLobby();

        return;

    }


    $("lobby")
        .classList
        .add("hidden");


    if (mode === "tv") {

        $("tvMode")
            .classList
            .remove("hidden");


        $("playerMode")
            .classList
            .add("hidden");


        renderTV();

    }

    else {

        $("playerMode")
            .classList
            .remove("hidden");


        $("tvMode")
            .classList
            .add("hidden");


        renderPlayer();

    }

}


/* =========================================================
   LOBBY
========================================================= */

function renderLobby() {

    const list =
        $("lobbyPlayers");


    list.innerHTML = "";


    gameState.players
        .forEach(player => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "lobby-player" +
                (
                    player.host
                        ? " host"
                        : ""
                );


            div.textContent =
                player.name +
                (
                    player.host
                        ? " 👑"
                        : ""
                );


            list.appendChild(div);

        });


    if (mode === "tv") {

        $("hostControls")
            .classList
            .remove("hidden");

    }

    else {

        $("hostControls")
            .classList
            .add("hidden");

    }

}


/* =========================================================
   TV
========================================================= */

function renderTV() {

    const list =
        $("tvPlayers");


    list.innerHTML = "";


    gameState.players
        .forEach(player => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "player-box" +
                (
                    player.id ===
                    gameState.currentPlayer
                        ? " active"
                        : ""
                );


            div.innerHTML = `

                <div class="player-name">

                    ${escapeHtml(
                        player.name
                    )}

                </div>

                <div class="card-count">

                    ${player.cardCount}
                    carte${player.cardCount > 1 ? "s" : ""}

                </div>

            `;


            list.appendChild(div);

        });


    if (
        gameState.currentPlayerName
    ) {

        $("tvStatus")
            .textContent =
            "Tour de " +
            gameState.currentPlayerName;

    }

    else {

        $("tvStatus")
            .textContent =
            "Partie terminée";

    }


    renderDiscard(
        $("tvDiscard"),
        false
    );


    if (
        gameState.status ===
        "finished"
    ) {

        $("newGameBtn")
            .classList
            .remove("hidden");

    }

    else {

        $("newGameBtn")
            .classList
            .add("hidden");

    }

}


/* =========================================================
   DEFAUSSE
========================================================= */

function renderDiscard(
    container,
    mobile
) {

    if (!container) {

        return;

    }


    container.innerHTML = "";


    if (!gameState.discard) {

        return;

    }


    const card =
        createCardElement(
            gameState.discard
        );


    if (mobile) {

        card.classList.add(
            "mobile-card"
        );

    }

    else {

        card.classList.add(
            "tv-discard-card"
        );

    }


    container.appendChild(card);

}


/* =========================================================
   JOUEUR
========================================================= */

function renderPlayer() {

    const me =
        gameState.me;


    if (!me) {

        return;

    }


    const myTurn =
        gameState.currentPlayer ===
        playerId;


    const turnElement =
        $("playerTurn");


    if (myTurn) {

        turnElement.textContent =
            "🔥 À TOI DE JOUER !";

        turnElement.classList
            .add("my-turn");

        turnElement.classList
            .remove("other-turn");

    }

    else {

        turnElement.textContent =
            "⏳ Tour de " +
            (
                gameState.currentPlayerName ||
                "un joueur"
            );

        turnElement.classList
            .remove("my-turn");

        turnElement.classList
            .add("other-turn");

    }


    $("currentColor")
        .textContent =
        gameState.currentColor
            ? "🎨 Couleur : " +
              colorName(
                  gameState.currentColor
              )
            : "";


    renderHand(
        me.hand,
        myTurn
    );


    renderDiscard(
        $("mobileDiscard"),
        true
    );


    $("drawBtn").disabled =
        !myTurn ||
        me.hasDrawn;


    $("unoBtn").disabled =
        me.hand.length !== 1;


    updateHandCount(
        me.hand.length
    );

}


/* =========================================================
   COMPTEUR MAIN
========================================================= */

function updateHandCount(count) {

    $("handCount")
        .textContent =
        count +
        (
            count > 1
                ? " cartes"
                : " carte"
        );

}


/* =========================================================
   MAIN
========================================================= */

function renderHand(
    hand,
    myTurn
) {

    const container =
        $("myHand");


    container.innerHTML = "";


    hand.forEach(
        (card, index) => {


            const element =
                createCardElement(
                    card
                );


            element.classList
                .add("hand-card");


            const playable =
                myTurn &&
                isPlayable(card);


            if (playable) {

                element.classList
                    .add("playable");

            }

            else if (myTurn) {

                element.classList
                    .add("not-playable");

            }


            element.addEventListener(
                "click",
                () => {

                    playCard(index);

                }
            );


            container.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   NOM FICHIER IMAGE
========================================================= */

function getCardAsset(card) {

    if (!USE_CARD_ASSETS) {

        return null;

    }


    if (
        card.type === "wild"
    ) {

        return "cards/wild.png";

    }


    if (
        card.type === "wild4"
    ) {

        return "cards/wild4.png";

    }


    const color =
        card.color;


    switch(card.type) {

        case "number":

            return (
                "cards/" +
                color +
                "-" +
                card.value +
                ".png"
            );


        case "skip":

            return (
                "cards/" +
                color +
                "-skip.png"
            );


        case "reverse":

            return (
                "cards/" +
                color +
                "-reverse.png"
            );


        case "draw2":

            return (
                "cards/" +
                color +
                "-draw2.png"
            );

    }


    return null;

}


/* =========================================================
   CREATION CARTE
========================================================= */

function createCardElement(card) {

    const div =
        document.createElement(
            "div"
        );


    let cardClass =
        "card " +
        (
            card.color ||
            "black"
        );


    if (
        card.type === "skip" ||
        card.type === "reverse"
    ) {

        cardClass +=
            " action";

    }


    if (
        card.type === "draw2"
    ) {

        cardClass +=
            " draw2";

    }


    if (
        card.type === "wild"
    ) {

        cardClass +=
            " wild";

    }


    if (
        card.type === "wild4"
    ) {

        cardClass +=
            " wild4";

    }


    div.className =
        cardClass;


    /* contenu */

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "card-content";


    /* coin */

    const topCorner =
        document.createElement(
            "div"
        );

    topCorner.className =
        "card-corner top";


    const bottomCorner =
        document.createElement(
            "div"
        );

    bottomCorner.className =
        "card-corner bottom";


    /* symbole */

    const symbol =
        document.createElement(
            "div"
        );

    symbol.className =
        "card-symbol";


    let text = "";


    switch(card.type) {


        case "number":

            text =
                String(
                    card.value
                );

            break;


        case "skip":

            text =
                "⊘";

            break;


        case "reverse":

            text =
                "↔";

            break;


        case "draw2":

            text =
                "+2";

            break;


        case "wild":

            text =
                "★";

            break;


        case "wild4":

            text =
                "+4";

            break;

    }


    topCorner.textContent =
        text;


    bottomCorner.textContent =
        text;


    symbol.textContent =
        text;


    content.appendChild(
        topCorner
    );

    content.appendChild(
        bottomCorner
    );

    content.appendChild(
        symbol
    );


    div.appendChild(
        content
    );


    /* =====================================================
       IMAGE OPTIONNELLE
    ===================================================== */

    const asset =
        getCardAsset(card);


    if (asset) {

        const image =
            document.createElement(
                "img"
            );


        image.className =
            "card-image";


        image.alt =
            "Carte UNO";


        image.onload = () => {

            div.classList
                .add("has-image");

        };


        image.onerror = () => {

            image.remove();

        };


        image.src =
            asset;


        div.appendChild(
            image
        );

    }


    return div;

}


/* =========================================================
   COULEURS
========================================================= */

function colorName(color) {

    const names = {

        red: "ROUGE",

        yellow: "JAUNE",

        green: "VERT",

        blue: "BLEU"

    };


    return (
        names[color] ||
        ""
    );

}


/* =========================================================
   JOUER CARTE
========================================================= */

function playCard(index) {

    if (!gameState.me) {

        return;

    }


    const card =
        gameState.me.hand[index];


    if (!card) {

        return;

    }


    if (!isPlayable(card)) {

        return;

    }


    if (
        card.type === "wild" ||
        card.type === "wild4"
    ) {

        pendingCardIndex =
            index;


        $("colorModal")
            .classList
            .remove("hidden");


        return;

    }


    send({

        type: "play_card",

        index: index

    });

}


/* =========================================================
   CHOIX COULEUR
========================================================= */

function chooseColor(color) {

    $("colorModal")
        .classList
        .add("hidden");


    if (
        pendingCardIndex === null
    ) {

        return;

    }


    send({

        type: "play_card",

        index:
            pendingCardIndex,

        color:
            color

    });


    pendingCardIndex =
        null;

}


/* =========================================================
   PIOCHE
========================================================= */

function drawCard() {

    send({

        type: "draw"

    });

}


/* =========================================================
   UNO
========================================================= */

function callUno() {

    send({

        type: "uno"

    });

}


/* =========================================================
   SALON
========================================================= */

function startGame() {

    send({

        type: "start_game"

    });

}


function newGame() {

    send({

        type: "new_game"

    });

}


/* =========================================================
   CARTE JOUABLE
========================================================= */

function isPlayable(card) {

    if (!gameState) {

        return false;

    }


    const discard =
        gameState.discard;


    if (!discard) {

        return true;

    }


    if (
        card.type === "wild"
    ) {

        return true;

    }


    if (
        card.type === "wild4"
    ) {

        return gameState.canPlayWild4;

    }


    if (
        card.color ===
        gameState.currentColor
    ) {

        return true;

    }


    if (
        card.type ===
        discard.type &&
        card.type !== "number"
    ) {

        return true;

    }


    if (
        card.type === "number" &&
        discard.type === "number" &&
        card.value ===
        discard.value
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   SECURITE
========================================================= */

function escapeHtml(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   FERMER MODAL EN CLIQUANT A COTE
========================================================= */

$("colorModal")
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                $("colorModal")
            ) {

                $("colorModal")
                    .classList
                    .add("hidden");

                pendingCardIndex =
                    null;

            }

        }
    );


/* =========================================================
   EMPECHER LE ZOOM DOUBLE TAP
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();


        if (
            now - lastTouchEnd <= 300
        ) {

            event.preventDefault();

        }


        lastTouchEnd =
            now;

    },
    {
        passive: false
    }
);

</script>

</body>
</html>
