<article class="toolview" id="view-gradient"><div class="toolhead"><div><h2>Générateur de dégradés</h2><p>Ajuste les couleurs et l’angle, puis récupère la propriété CSS.</p></div><button class="btn small" data-back>← Tous les outils</button></div><div class="split"><div><div class="field"><label for="gradA">Couleur A</label><input id="gradA" type="color" class="control" value="#23324a"></div><div class="field"><label for="gradB">Couleur B</label><input id="gradB" type="color" class="control" value="#d9a768"></div><div class="field"><label for="gradAngle">Angle : <output id="gradAngleValue">135°</output></label><input id="gradAngle" type="range" min="0" max="360" value="135" class="control"></div><div class="actions"><button class="btn primary" id="gradCopy">Copier le CSS</button></div><textarea id="gradCss" readonly style="min-height:75px"></textarea><p id="gradStatus" class="status"></p></div><div><label class="label">Aperçu</label><div id="gradientPreview" class="gradient-preview"></div></div></div></article>
