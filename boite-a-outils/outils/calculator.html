<article class="toolview" id="view-calculator"><div class="toolhead"><div><h2>Calculatrice & conversions</h2><p>Calcul rapide, pourcentage, puis conversion de longueurs, poids, températures et données numériques.</p></div><button class="btn small" data-back>← Tous les outils</button></div><div class="toolbody"><div><div class="field"><label for="calcInput">Expression mathématique</label><input id="calcInput" class="control" placeholder="Ex. (125 * 1.2) - 15" value="(125 * 1.2) - 15"></div><div class="actions"><button class="btn primary" id="calcRun">Calculer</button><button class="btn" id="calcPercent">Calculer 20 % du résultat</button></div><div class="result" style="margin-top:.8rem"><span class="hint">Résultat</span><div id="calcOutput" style="font:500 1.8rem var(--display)">—</div></div><p id="calcStatus" class="status"></p></div><div><div class="field"><label for="unitCategory">Type de conversion</label><select id="unitCategory" class="control"><option value="length">Longueur</option><option value="weight">Masse</option><option value="temp">Température</option><option value="data">Données</option></select></div><div class="split"><div class="field"><label for="unitValue">Valeur</label><input id="unitValue" class="control" type="number" value="1"></div><div class="field"><label for="unitFrom">De</label><select id="unitFrom" class="control"></select></div></div><div class="field"><label for="unitTo">Vers</label><select id="unitTo" class="control"></select></div><div class="result"><span class="hint">Conversion</span><div id="unitOutput" style="font:500 1.5rem var(--display)">—</div></div></div></div></article>
